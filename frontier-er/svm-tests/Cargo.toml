[package]
name = "frontier-er-svm-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Candidate only: the board program (frontier-er/program, SBPF v2 build) against the real MagicBlock delegation program binary in LiteSVM: delegate, the escape (request, timeout, rollback) and the compare-and-set writes"

# Own workspace, lock and toolchain, as permutation-frontier/svm-tests (whose
# LiteSVM and solana pins these are).
[workspace]

[dependencies]
litesvm = "=0.16.0"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2", "decode"] }
solana-clock = "=3.1.1"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode", "verify"] }
frontier-er = { path = ".." }
