<meta name="claude:viewport-fit-sides" content="cover">
<title>Wylls Trailer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;700&family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one 16:9 stage sized to the viewport, a slim transport bar under it */
:root{
  --bg:#060d0c; --metal:#10221f; --metal-2:#18302b; --ivory:#f4efe0; --ink-2:#a9b8b1;
  --brass:#c9a24a; --brass-hi:#f0d48a; --red:#ff2d2d;
  --ui:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ivory);font-family:var(--ui);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;width:min(100%,calc((100dvh - 110px)*16/9));max-width:100%;aspect-ratio:16/9;background:#000;
  box-shadow:0 0 0 1px rgba(201,162,74,.35),0 18px 60px rgba(0,0,0,.6);cursor:pointer}
.stage canvas{display:block;width:100%;height:100%}
.stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;box-shadow:none;display:flex;align-items:center;justify-content:center}
.stage:fullscreen canvas{width:auto;height:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9))}
.big{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font:700 15px var(--ui);letter-spacing:.08em;
  color:#10221f;background:linear-gradient(180deg,var(--brass-hi),var(--brass));border:0;border-radius:2px;padding:12px 22px;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,.5)}
.big:focus-visible,.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,calc((100dvh - 110px)*16/9));max-width:100%;flex-wrap:wrap}
.bar button{font:700 13px var(--ui);letter-spacing:.06em;color:var(--ivory);background:var(--metal-2);border:1px solid rgba(201,162,74,.5);
  border-radius:2px;padding:8px 14px;cursor:pointer;min-height:36px}
.bar button:hover{background:#20413a}
.bar input[type=range]{flex:1;min-width:120px;accent-color:var(--brass)}
.bar output{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:92px;text-align:right}
</style>

<div class="stage" id="stage">
  <canvas id="c" width="1920" height="1080" aria-label="Wylls 30-second concept trailer"></canvas>
  <button class="big" id="soundBtn" type="button">♪ Play from the start with sound</button>
</div>
<div class="bar">
  <button id="playBtn" type="button">Pause</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Seek">
  <output id="time">00.0 / 30.0</output>
  <button id="muteBtn" type="button">Sound: off</button>
  <button id="fsBtn" type="button">Fullscreen</button>
</div>

<script>
(() => {
'use strict';
const W=1920,H=1080,DUR=30,TAU=Math.PI*2;
const cv=document.getElementById('c'), g=cv.getContext('2d');

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>b===a?(x>=b?1:0):clamp((x-a)/(b-a));
const lin=t=>t, eo3=t=>1-Math.pow(1-t,3), ei3=t=>t*t*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eoX=t=>t>=1?1:1-Math.pow(2,-10*t);
const eioX=t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2;
const eoBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const h1=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const h2=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h2(xi,yi),h2(xi+1,yi),u),lerp(h2(xi,yi+1),h2(xi+1,yi+1),u),v)}
const fbm=(x,y)=>vnoise(x,y)*.55+vnoise(x*2.1+5,y*2.1+9)*.3+vnoise(x*4.3+1,y*4.3+3)*.15;
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ---------- palette (the game's own) ---------- */
const NFH=['#cc303b','#31bedb','#eac21b','#a34cd8','#edeee7','#f19232'];
const NDH=['#81242c','#237489','#8c721c','#69338c','#5f6a68','#9c581f'];
const NPH=['#701c2c','#145c77','#986a0e','#502269','#344950','#9c471c'];
const NF=NFH.map(rgb), ND=NDH.map(rgb);
const NN=['Aster','Borealis','Cinder','Dunmar','Ember','Fjordal'];
const YOU=1, AI=0;
const IVORY='#f4efe0', BRASS='#c9a24a', BRASSHI='#f0d48a', INK='#1b2e28', INK2='#a9b8b1', BG='#060d0c', WAX='#b3372a', RED='#ff2d2d';
const FD='"Cormorant Garamond",Georgia,"Times New Roman",serif';
const FU='"Inter",system-ui,-apple-system,sans-serif';
const FL='"Cinzel",Georgia,serif';
const FM='"IBM Plex Mono",ui-monospace,Menlo,monospace';
const F=(px,fam,wt=500)=>`${fam===FD?Math.min(wt,700):wt} ${px}px ${fam}`;

/* ---------- world ---------- */
const S3=Math.sqrt(3), RAD=15;
const hexes=[], hmap=new Map();
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
for(let q=-RAD;q<=RAD;q++)for(let r=Math.max(-RAD,-q-RAD);r<=Math.min(RAD,-q+RAD);r++){
  const x=S3*(q+r/2), y=1.5*r;
  hmap.set(q+','+r,hexes.length);
  hexes.push({q,r,x,y,dc:Math.hypot(x,y),land:false,type:0,h:0,cap:-1,keep:-1,ev:[],house:false,build:null,s:h2(q*1.7+3,r*2.3+1)});
}
for(const h of hexes) h.nb=DIRS.map(d=>{const k=hmap.get((h.q+d[0])+','+(h.r+d[1]));return k===undefined?-1:k});
const nearest=(x,y)=>{let b=0,bd=1e9;hexes.forEach((h,i)=>{const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;b=i}});return b};
const CAPANG=[-30,150,30,-90,90,-150], LIGHT=[5,3,0,2,4,1]; // lighting order sweeps round the board
const caps=CAPANG.map(a=>nearest(15*Math.cos(a*Math.PI/180),15*Math.sin(a*Math.PI/180)));
const keeps=[nearest(0,0)];
CAPANG.forEach(a=>keeps.push(nearest(7.6*Math.cos(a*Math.PI/180),7.6*Math.sin(a*Math.PI/180))));       // 1..6 inner, by nation
[0,60,120,180,240,300].forEach(a=>keeps.push(nearest(14*Math.cos(a*Math.PI/180),14*Math.sin(a*Math.PI/180)))); // 7..12 between
const dist=(a,b)=>Math.hypot(hexes[a].x-hexes[b].x,hexes[a].y-hexes[b].y);
hexes.forEach((h,i)=>{
  const d=Math.hypot(h.x/26.5,h.y/23), n=fbm(h.x*.11+3,h.y*.11+8);
  h.land=1-d*d*1.05+(n-.5)*.8>.2;
  caps.forEach(c=>{if(dist(i,c)<3.6)h.land=true});
  keeps.forEach(c=>{if(dist(i,c)<1.9)h.land=true});
  const el=fbm(h.x*.14+40,h.y*.14+7), fo=fbm(h.x*.22+90,h.y*.22+50);
  h.type=el>.66?3:el>.57?2:fo>.56?1:0;
  h.h=[.26,.32,.55,.95+(el-.66)*3.2][h.type]+h.s*.06;
});
caps.forEach((c,k)=>{hexes[c].cap=k;});
keeps.forEach((c,i)=>{hexes[c].keep=i;});
hexes.forEach((h,i)=>{ // flatten around seats
  let near=1e9;caps.forEach(c=>near=Math.min(near,dist(i,c)));keeps.forEach(c=>near=Math.min(near,dist(i,c)*1.6));
  if(near<2.9&&h.type>1){h.type=0;h.h=.26+h.s*.06}
  if(h.cap>=0||h.keep>=0){h.type=0;h.h=.34}
});
/* ownership history: every hex carries its own list of (time, nation) */
hexes.forEach((h,i)=>{
  if(!h.land)return;
  let k=0,dN=1e9;caps.forEach((c,j)=>{const d=dist(i,c)+(fbm(h.x*.3+j,h.y*.3)-.5)*1.6;if(d<dN){dN=d;k=j}});
  h.nat=k;h.dN=dN;
  if(h.dc<3.3){h.ev.push([18.55+h.dc*.16,YOU]);return}
  if(dN<5.6)h.ev.push([1.1+LIGHT[k]*.2+dN*.1,k]);
  else if(dN<7.7)h.ev.push([5+(dN-5.6)*4+h.s*3,k]);
  else h.ev.push([20.1+(dN-7.7)*.42+h.s*.5,k]);
  if(dN<4.4&&h.type===0&&h.cap<0&&h.keep<0&&h2(h.q+9,h.r+4)<.36)h.house=true;
});
const wave=(h,t,n)=>{h.ev=h.ev.filter(e=>e[0]<18.4);h.ev.push([t,n])};
hexes.forEach((h,i)=>{
  if(!h.land||h.dc<3.3)return;
  const dk=dist(i,keeps[3]); // Cinder's inner keep falls to Aster at the bell
  if(dk<2.5)wave(h,18.6+dk*.15,AI);
  else if(h.dc<6.2&&dist(i,caps[YOU])<dist(i,caps[AI])+3)wave(h,20.2+h.dc*.13,YOU);
  else if(h.nat===2&&dist(i,caps[0])<11.6)wave(h,20.9+(dist(i,caps[0])-6)*.22,0);
  else if(h.nat===3&&dist(i,caps[5])<11.4)wave(h,21.9+(dist(i,caps[5])-6)*.22,5);
  else if(h.nat===4&&dist(i,caps[1])<11.6)wave(h,22.6+(dist(i,caps[1])-6)*.2,1);
});
/* buildings a player places one by one (you at 4.9s, the AI citizen at 9.0s) */
const BK=['Farm','Sawmill','Quarry','House','Barracks','Mine'];
const builds=[];
function village(k,t0,step,t1,step2){
  const c=hexes[caps[k]], r1=c.nb.filter(i=>i>=0), seen=new Set([caps[k],...r1]), r2=[];
  r1.forEach(i=>hexes[i].nb.forEach(j=>{if(j>=0&&!seen.has(j)){seen.add(j);r2.push(j)}}));
  r1.forEach((i,j)=>builds.push({i,k,t:t0+j*step,kind:j%6}));
  r2.slice(0,8).forEach((i,j)=>builds.push({i,k,t:t1+j*step2,kind:(j+3)%6,quiet:j%3!==0}));
}
village(YOU,4.95,.4,7.0,.11); village(AI,9.0,.42,11.0,.1);
builds.forEach(b=>{const h=hexes[b.i];h.land=true;h.type=0;h.h=.3;h.house=false;h.build=b;if(!h.ev.length||h.ev[0][0]>2.5)h.ev=[[1.6,b.k]]});
hexes.forEach(h=>h.ev.sort((a,b)=>a[0]-b[0]));

/* marches: sealed until the bell at 18.0 */
const marches=[];
const M=(n,from,to,t0,t1,size,pre,tag)=>marches.push({n,from,to,t0,t1,size,pre,tag});
M(YOU,caps[YOU],keeps[0],13.38,18.45,240,true,'YOU');
M(AI,caps[AI],keeps[0],13.75,18.45,180,true,'AI');
M(AI,caps[AI],keeps[3],14.1,18.45,120,true);
[[2,8],[2,7],[3,11],[3,4],[4,9],[4,5],[5,10],[5,6],[1,2]].forEach(([n,kp],j)=>M(n,caps[n],keeps[kp],13.7+h1(j+2)*1.3,18.45,60+((h1(j+9)*14)|0)*10,true));
marches.slice(3).forEach(m=>{const kh=keeps.indexOf(m.to);if(kh>6)hexes.forEach((h,i)=>{if(h.land&&dist(i,m.to)<1.6&&!h._k){h._k=1;wave(h,18.55+dist(i,m.to)*.12,m.n)}})});
hexes.forEach(h=>h.ev.sort((a,b)=>a[0]-b[0]));
for(let j=0;j<18;j++){const n=j%6,kp=keeps[1+((j*5+n)%12)];M(n,caps[n],kp,19.6+j*.22,19.6+j*.22+1.5,80+((h1(j+30)*12)|0)*10,false)}

const ownAt=(h,t)=>{let o=-1;for(const e of h.ev){if(e[0]<=t)o=e[1];else break}return o};
const own=new Int8Array(hexes.length), age=new Float32Array(hexes.length);
function stepSim(t){for(let i=0;i<hexes.length;i++){const ev=hexes[i].ev;let o=-1,a=99;for(let j=0;j<ev.length;j++){if(ev[j][0]<=t){o=ev[j][1];a=t-ev[j][0]}else break}own[i]=o;age[i]=a}}

/* ---------- camera ---------- */
const P1=hexes[caps[YOU]], P0=hexes[caps[AI]];
const CK=[
 [0,{x:0,y:0,z:16,r:-.52,T:.46,ox:-260}],
 [4,{x:0,y:.6,z:24,r:-.12,T:.56,ox:-330},eo3],
 [4.8,{x:P1.x,y:P1.y,z:118,r:.18,T:.55,ox:0},eioX],
 [7.9999,{x:P1.x+.3,y:P1.y,z:136,r:.28,T:.55,ox:0},lin],
 [8,{x:P0.x,y:P0.y,z:112,r:-.2,T:.55,ox:330}],
 [11.9999,{x:P0.x,y:P0.y+.2,z:128,r:-.3,T:.55,ox:330},lin],
 [12,{x:P1.x,y:P1.y,z:118,r:.12,T:.55,ox:0}],
 [13.3,{x:P1.x,y:P1.y,z:112,r:.1,T:.55,ox:0},lin],
 [14.5,{x:0,y:.5,z:35,r:.07,T:.52,ox:0},eioX],
 [16,{x:0,y:.4,z:39,r:.02,T:.52,ox:0},lin],
 [18,{x:0,y:0,z:66,r:-.07,T:.5,ox:0},eio],
 [18.3,{x:0,y:0,z:55,r:-.06,T:.5,ox:0},eoX],
 [19.9999,{x:0,y:0,z:60,r:.1,T:.5,ox:0},lin],
 [20,{x:-7,y:5,z:92,r:.52,T:.38,ox:120}],
 [20.9999,{x:-2.5,y:1.5,z:96,r:.42,T:.38,ox:120},lin],
 [21,{x:10,y:-1,z:74,r:-.36,T:.42,ox:300}],
 [21.9999,{x:11.5,y:3,z:78,r:-.27,T:.42,ox:300},lin],
 [22,{x:-10,y:-7,z:84,r:.95,T:.37,ox:-80}],
 [22.9999,{x:-6,y:-10.5,z:88,r:.84,T:.37,ox:-80},lin],
 [23,{x:0,y:0,z:45,r:-.32,T:.5,ox:-260}],
 [24,{x:0,y:0,z:41,r:-.22,T:.5,ox:-260},lin],
 [27,{x:0,y:.4,z:26.5,r:.04,T:.56,ox:-250},eo3],
 [30,{x:0,y:.4,z:23.5,r:.2,T:.56,ox:0},eo3],
];
const SHAKES=[[13.0,12],[18.0,30],[18.45,12],[27.0,16]];
const cam={x:0,y:0,z:20,r:0,T:.5,ox:0,sx:0,sy:0};
let CS=1,SN=0,HS=1,CX=W/2,CY=H/2;
function setCam(t){
  let i=0;while(i<CK.length-1&&CK[i+1][0]<=t)i++;
  const a=CK[i],b=CK[i+1]||a,u=b===a?0:(b[2]||lin)(inv(a[0],b[0],t));
  for(const k of ['x','y','z','r','T','ox'])cam[k]=lerp(a[1][k],b[1][k],u);
  cam.sx=cam.sy=0;
  for(const [ts,amp] of SHAKES){const d=t-ts;if(d>=0&&d<.55){const f=amp*Math.pow(1-d/.55,2);cam.sx+=f*Math.sin(d*95);cam.sy+=f*Math.cos(d*71)}}
  CS=Math.cos(cam.r);SN=Math.sin(cam.r);HS=Math.sqrt(1-cam.T*cam.T)*cam.z;CX=W/2+cam.ox+cam.sx;CY=H/2+cam.sy;
}
const P=(x,y,h=0)=>{const dx=x-cam.x,dy=y-cam.y;return[CX+(dx*CS-dy*SN)*cam.z,CY+(dx*SN+dy*CS)*cam.z*cam.T-h*HS]};

/* ---------- small drawing helpers ---------- */
function spaced(txt,x,y,sp,align='left'){ // letter-spaced text without ctx.letterSpacing
  const ws=[...txt].map(c=>g.measureText(c).width), tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  g.textAlign='left';[...txt].forEach((c,i)=>{g.fillText(c,cx,y);cx+=ws[i]+sp});return tot;
}
function kline(txt,x,y,px,t,t0,o={}){ // kinetic line: each glyph rises out of a mask
  const st=o.st??.022,dur=o.dur??.55,tOut=o.out??99,q=ei3(inv(tOut-.28,tOut,t));
  if(t<t0||q>=1)return 0;
  g.save();g.font=F(px,o.fam||FD,o.wt||800);g.textBaseline='alphabetic';g.fillStyle=o.color||IVORY;
  const chars=[...txt],ws=chars.map(c=>g.measureText(c).width+(o.sp||0)),tot=ws.reduce((a,b)=>a+b,0);
  let cx=o.align==='center'?x-tot/2:o.align==='right'?x-tot:x;cx-=q*40;
  chars.forEach((c,i)=>{
    const p=eoX(inv(t0+i*st,t0+i*st+dur,t));
    if(p>0){g.save();if(p<.999){g.beginPath();g.rect(cx-px*.2,y-px*1.05,ws[i]+px*.4,px*1.32);g.clip()}g.globalAlpha=p*(1-q);
      if(o.shadow){g.shadowColor='rgba(0,0,0,.75)';g.shadowBlur=18}
      g.fillText(c,cx,y+(1-p)*px*.95);g.restore()}
    cx+=ws[i];
  });g.restore();return tot;
}
function vline(txt,x,y,px,t,t0,tOut){ // vertical Japanese setting
  const q=ei3(inv(tOut-.3,tOut,t));if(t<t0||q>=1)return;
  g.save();g.font=F(px,FD,800);g.textAlign='center';g.textBaseline='middle';g.fillStyle=IVORY;
  [...txt].forEach((c,i)=>{const p=eoX(inv(t0+i*.075,t0+i*.075+.7,t));if(p<=0)return;
    const pun=c==='、'||c==='。';g.globalAlpha=p*(1-q);
    g.fillText(c,x+(pun?px*.6:0),y+i*px*1.1-(pun?px*.58:0)-(1-p)*46+q*30)});
  g.restore();
}
function plate(x,y,w,h,a=1){
  g.save();g.globalAlpha=a;
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(28,54,47,.94)');gr.addColorStop(1,'rgba(11,25,22,.94)');
  g.fillStyle=gr;g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=30;g.shadowOffsetY=10;g.fillRect(x,y,w,h);
  g.shadowColor='transparent';g.strokeStyle='rgba(201,162,74,.75)';g.lineWidth=1.5;g.strokeRect(x+.75,y+.75,w-1.5,h-1.5);
  g.strokeStyle='rgba(240,212,138,.22)';g.lineWidth=1;g.strokeRect(x+6.5,y+6.5,w-13,h-13);
  g.fillStyle=BRASSHI;for(const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]])g.fillRect(cx-3,cy-3,6,6);
  g.restore();
}
function hexPath(cx,cy,r,rot=0){g.beginPath();for(let i=0;i<6;i++){const a=rot+i*TAU/6;g[i?'lineTo':'moveTo'](cx+r*Math.cos(a),cy+r*Math.sin(a))}g.closePath()}
const LOGO=[[148,292,252,259,401,733,297,766],[449,331,550,368,402,768,301,731],[551,331,450,368,598,768,699,731],[748,258,852,291,703,766,598,733]];
function logo(cx,cy,size,t,t0,white=IVORY){ // the real mark: four slanted bars, the last one red
  const s=size/1000;
  LOGO.forEach((b,i)=>{const p=eoX(inv(t0+i*.09,t0+i*.09+.45,t));if(p<=0)return;
    const dx=b[4]-b[0],dy=b[5]-b[1],sgn=(i%2?-1:1)*(1-p)*.9;
    g.save();g.globalAlpha=Math.min(1,p*1.6);g.translate(cx+dx*sgn*s,cy+dy*sgn*s);g.beginPath();
    for(let j=0;j<8;j+=2)g[j?'lineTo':'moveTo']((b[j]-500)*s,(b[j+1]-512)*s);
    g.closePath();g.fillStyle=i===3?RED:white;g.fill();g.restore()});
}
