name: CI

# Key-free by default (owner rule, 2026-11-06): no job started by a push or a
# pull request generates, derives or signs with any key, test keys and common
# setup included. Every check that does — the LiteSVM suites, the SBF builds
# (cargo-build-sbf writes a program keypair when none exists: not yet ruled
# out, so treated as key generation), the frontier-node workspace tests (test
# payers, test-beacon key) and the Node tests listed in
# scripts/ci/node-key-tests.txt — is kept unchanged in the `key-tests` job at
# the end, which runs only by hand (Actions → CI → Run workflow) with
# key_tests set to "approved". Nothing in it runs until the owner allows it.
# What runs and what does not: docs/ci/KEY-FREE-CI.ja.md.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      key_tests:
        description: 'Run the key-using tests (LiteSVM, SBF builds, frontier-node workspace, listed Node tests). Only "approved" runs them.'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'approved']

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser source smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check permutation-state-prototype/app.js
          node --check permutation-state-prototype/civilization/app.mjs
          node --check permutation-state-prototype/civilization/copy.mjs
          node --check permutation-state-prototype/civilization/map.mjs
          node --check permutation-state-prototype/civilization/core.mjs
          node --check permutation-state-prototype/world/app.js
          node --check permutation-state-prototype/world/core.mjs
          node --check permutation-state-prototype/proof/core.js
          node --check permutation-state-prototype/proof/app.js
          node --check permutation-state-solana-receipt-spike/server/devnet-gateway.mjs
          node --check permutation-state-solana-receipt-spike/server/game-contract.mjs
          node --check permutation-state-solana-receipt-spike/server/world-service.mjs
          node --check permutation-state-solana-receipt-spike/server/civilization-service.mjs
          node --check permutation-state-solana-receipt-spike/server/civilization-server.mjs
          node --check permutation-state-solana-receipt-spike/client/world-magicblock-transport.mjs
          node --check permutation-state-solana-receipt-spike/server/local-e2e.mjs
          node --check permutation-state-solana-receipt-spike/server/world-chain-local-e2e.mjs
          node --check permutation-state-solana-receipt-spike/server/start-local-stack.mjs
      - name: Run living-world simulation tests
        run: node --test permutation-state-prototype/world/core.test.mjs
      - name: Run civilization strategy simulation tests
        run: node --test permutation-state-prototype/civilization/*.test.mjs
      - name: Validate recorded proof result
        run: python3 -m json.tool permutation-state-prototype/proof/qa-proof-result.json >/dev/null
      - name: CI stays key-free on push and pull request
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml==6.0.2
          python3 scripts/ci/check-ci-keyfree.py .github/workflows/ci.yml

  receipt-tests:
    name: Solana receipt scaffold tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: permutation-state-solana-receipt-spike
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: permutation-state-solana-receipt-spike/package-lock.json
      - name: Run Rust tests
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      # Key-free subset under the runtime guard; the listed files that use
      # keys run only in the key-tests job.
      - name: Run adapter tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh permutation-state-solana-receipt-spike 'client/*.test.mjs' 'server/*.test.mjs'
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate

  program:
    name: Rules, program (host + SBF + LiteSVM), server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchains
        # The root, crate and svm-tests rust-toolchain.toml files select them;
        # rustup may not auto-install, so both are installed explicitly.
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            permutation-chain/target
            permutation-server/target
            permutation-chain/svm-tests/target
          key: program-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
      - name: Rules
        run: cargo test --locked --release -p permutation-rules
      - name: Program host tests
        run: cargo test --locked -p permutation-chain
      - name: Program layouts build without the program feature
        run: cd permutation-chain && cargo check --locked --no-default-features --features no-entrypoint
      - name: Server (golden, codec vectors)
        run: cd permutation-server && cargo test --locked --release
      - name: Server binaries (verify, play, replay) outside cargo test
        run: cd permutation-server && cargo build --locked --release --bins
      # Moved to key-tests: permutation-chain/svm-tests/run.sh (SBF build + LiteSVM).

  frontier-sim:
    name: Frontier simulator (conservation, replay, doctrine balance gate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontier-sim
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml pins 1.89.0)
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontier-sim/target
          key: frontier-sim-${{ hashFiles('frontier-sim/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format and lints
        run: |
          cargo fmt -- --check
          cargo clippy --locked --release --all-targets -- -D warnings
      # Includes `balance::tests::doctrine_balance_gate` (the rules-v10
      # doctrine table on a 360-season paired harness, D23 on: each mean index
      # within ±0.2%, a proxy for O5) and its negative controls, which must
      # fail: the draft table, F on the Knight line and an in-bounds A
      # boost (design §4.1, O5). The O5 band itself (16.7 ± 2 on 1,500
      # seasons) runs in doctrine-balance.yml, nightly and on demand.
      - name: Simulator tests
        run: cargo test --locked --release
      # M1 CL-16: the bot criterion restated on a held-out seed set
      # (30002..30004) with D23 (one office-term per wallet) on; exit 1 if
      # any bot choice returns >= 1.0.
      - name: Bot criterion, held-out seeds (CL-16)
        run: cargo run --locked --release -- criterion --best-response --seeds 3 --first-seed 30001 --gate

  gateway:
    name: Gateway and web client tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: permutation-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: permutation-gateway/package-lock.json
      - run: npm ci --ignore-scripts
      # Key-free subset under the runtime guard (scripts/ci/no-keys-guard.mjs);
      # the files listed in scripts/ci/node-key-tests.txt run only in the key-tests job.
      - name: Gateway and web tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh permutation-gateway 'test/*.test.mjs' 'screens/logic.screen.mjs'

  # Workstream 12 (memory): its audited key-free test files (workstreams/12-memory/tools/keyfree-tests.txt) through
  # the same runner and guard as the gateway job. No npm install (12 has no dependencies). Node 22: node:sqlite
  # (reading workstream 4's store) and JSON.parse source text (exact u64). 12's tests that sign test allocations
  # are not in the list and are not run anywhere in CI.
  memory12:
    name: Workstream 12 memory tests (key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Workstream 12 tests (key-free)
        run: scripts/ci/node-keyfree.sh workstreams/12-memory $(grep -v '^#' workstreams/12-memory/tools/keyfree-tests.txt | grep .)

  # ------------------------------------------------------------------ M1
  # Frontier M1 (docs/frontier/m1/M1-CONTRACT.md §3.2, §12; CL-36). The
  # crates arrive wave by wave (frontier-abi and frontier-node in wave 1,
  # permutation-frontier and its svm-tests in wave 2), so each step runs
  # only once its crate exists on the branch. Agave 3.1.9's validator has
  # no BLS12-381 syscalls; LiteSVM with the mainnet feature set is enough
  # for the CU gates (the 7-day season runs locally, not in CI).
  frontier-program:
    name: Frontier M1 rules, ABI and program (host + SBF v2 + LiteSVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
            permutation-frontier/svm-tests/target
          key: frontier-program-${{ hashFiles('Cargo.lock', 'permutation-frontier/svm-tests/Cargo.lock', '**/rust-toolchain.toml') }}
      # The owner-approved rename (docs/frontier/DECISIONS.md V1) legitimately
      # changed one comment in permutation-chain/src/lib.rs and the key-backup
      # header in permutation-server/web/session.mjs (commit 8c1b5ea), so the
      # pinned base for "untouched" is that commit, not d95fa25. The script
      # also guards that sessionText() and every domain/seed literal
      # ("PS/...", "permutation-state/...", "PSF-...") are unchanged since
      # d95fa25. Needs the full history (fetch-depth 0 above).
      - name: v9 files the Frontier must not touch (session text, v9 program)
        run: scripts/check-v9-frozen.sh
      - name: Format (root workspace)
        run: cargo fmt --all -- --check
      - name: Rules lints
        run: cargo clippy --locked -p permutation-rules --all-targets -- -D warnings
      - name: ABI lints, tests and vector freshness
        if: hashFiles('frontier-abi/Cargo.toml') != ''
        run: |
          cargo clippy --locked -p frontier-abi --all-targets -- -D warnings
          cargo test --locked -p frontier-abi
          cargo run --locked -p frontier-abi --bin abi-vectors -- --check
      - name: Program host tests (default features and layouts only)
        if: hashFiles('permutation-frontier/Cargo.toml') != ''
        run: |
          cargo clippy --locked -p permutation-frontier --all-targets -- -D warnings
          cargo test --locked -p permutation-frontier
          cargo test --locked -p permutation-frontier --no-default-features
      # Moved to key-tests: the SBF v2 builds (twice; Prize for cross-program
      # tests) and the LiteSVM suite G1-G13.

  frontier-node:
    name: Frontier M1 off-chain workspace (keeper, herald, verifier, localnet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (frontier-node/rust-toolchain.toml pins 1.95.0)
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontier-node/target
          key: frontier-node-${{ hashFiles('frontier-node/Cargo.lock', 'frontier-node/rust-toolchain.toml') }}
      # In-process tests bind 127.0.0.1:0 and use the test-beacon key
      # (drand-replay --test-key, I-53); no network, no fixed ports.
      # Format and lints compile every target but run none. The tests run only
      # for the library crates with no key use (findex, herald); the workspace
      # tests (test payers derived from a seed, the test-beacon key, signed
      # transactions) are in key-tests.
      - name: Format, lints and key-free tests
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p findex --lib
          cargo test --locked -p herald --lib

  frontier-wasm:
    name: Frontier M1 web kernels (WASM build and hash)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The wasm32 target is installed on the CI runner only; the local
      # machine waits for owner decision O-M1-12 (PENDING-OWNER there).
      - name: Rust toolchain and wasm32 target
        if: hashFiles('scripts/build-wasm.sh') != ''
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      - name: WASM build matches the committed module
        if: hashFiles('scripts/build-wasm.sh') != ''
        run: scripts/build-wasm.sh --check
      # The S1 module the web client loads for an S1 season (program version 4).
      - name: S1 WASM build matches the committed module
        if: hashFiles('scripts/build-wasm.sh') != ''
        run: scripts/build-wasm.sh --s1 --check

  prize-program:
    name: Prize pool program (host + SBF v2 + LiteSVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            permutation-prize/target
            permutation-prize/svm-tests/target
          key: prize-program-${{ hashFiles('permutation-prize/Cargo.lock', 'permutation-prize/svm-tests/Cargo.lock', 'rust-toolchain.toml', 'permutation-prize/svm-tests/rust-toolchain.toml') }}
      - name: Prize pool format, lints and host tests
        working-directory: permutation-prize
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Moved to key-tests: the Prize SBF v2 build and the LiteSVM tests.

  # Workstream 04's host runs of the real prize and game programs (no keys:
  # fixed keys and program addresses only; System, SPL Token and sysvars are
  # host stubs).
  exec-native:
    name: Execution host E2E (prize + game programs, key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Format, lints and tests
        if: hashFiles('workstreams/04-execution/e2e-native/Cargo.toml') != ''
        working-directory: workstreams/04-execution/e2e-native
        run: |
          cargo fmt -- --check
          cargo test --locked

  # ------------------------------------------------------------ key tests
  # Every check that generates, derives or signs with a key, unchanged from
  # the jobs above. Never started by a push or a pull request.
  key-tests:
    name: Key-using tests (manual, owner-approved only)
    if: github.event_name == 'workflow_dispatch' && inputs.key_tests == 'approved'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Agave 3.1.9 (cargo-build-sbf, platform-tools v1.52)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.9/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Program tests against the SBF build (builds it with scripts/build-program.sh)
        run: permutation-chain/svm-tests/run.sh
        env:
          RELEASE_CHECK: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
      - name: Frontier SBF v2 build, twice
        if: hashFiles('scripts/build-frontier.sh') != ''
        run: scripts/build-frontier.sh --twice
      - name: Prize SBF v2 build
        run: scripts/build-prize.sh
      - name: Frontier LiteSVM suite (G1-G13 against the SBF build)
        if: hashFiles('permutation-frontier/svm-tests/run.sh') != ''
        working-directory: permutation-frontier/svm-tests
        run: ./run.sh --release
        env:
          RELEASE_CHECK: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
          PRIZE_SO: ${{ github.workspace }}/permutation-prize/target/deploy/permutation_prize.so
      - name: Prize pool LiteSVM format, lints and tests
        working-directory: permutation-prize/svm-tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
      - name: frontier-node workspace tests
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo test --locked --workspace
          cargo test --locked --release --workspace
      - name: Gateway and web tests (all, including the listed key tests)
        working-directory: permutation-gateway
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Receipt adapter tests (all)
        working-directory: permutation-state-solana-receipt-spike
        run: |
          npm ci --ignore-scripts
          npm test
