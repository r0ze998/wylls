name: CI

# Key-free by default (owner rule, 2026-11-06): no job started by a push or a
# pull request generates, derives or signs with any key, test keys and common
# setup included. Every check that does — the LiteSVM suites, the SBF builds
# (cargo-build-sbf writes a program keypair when none exists: not yet ruled
# out, so treated as key generation), the frontier-node workspace tests (test
# payers, test-beacon key) and the Node tests listed in
# scripts/ci/node-key-tests.txt — is kept unchanged in the `key-tests` job at
# the end, which runs only by hand (Actions → CI → Run workflow) with
# key_tests set to "approved". Nothing in it runs until the owner allows it.
# What runs and what does not: docs/ci/KEY-FREE-CI.ja.md.
#
# Triggers (owner decision Q-D6, 2026-11-18): pull requests and pushes to main
# only. A push to any other branch starts nothing by itself; its pull request
# does, once, and still runs every job. Manual runs are unchanged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      key_tests:
        description: 'Run the key-using tests (LiteSVM, SBF builds, frontier-node workspace, listed Node tests). Only "approved" runs them.'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'approved']

# A new push to a pull request cancels that pull request's older run: only the
# newest commit's result matters. Pushes to main and manual runs are never
# cancelled and never wait for each other: they fall back to run_id, a group
# of their own, so every merge to main keeps a full result. (A shared
# per-branch group would not do that even with cancel-in-progress false:
# GitHub keeps one pending run per group and cancels the older pending one,
# and a manual key-tests run on main would queue behind a main push.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser source smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check permutation-state-prototype/app.js
          node --check permutation-state-prototype/civilization/app.mjs
          node --check permutation-state-prototype/civilization/copy.mjs
          node --check permutation-state-prototype/civilization/map.mjs
          node --check permutation-state-prototype/civilization/core.mjs
          node --check permutation-state-prototype/world/app.js
          node --check permutation-state-prototype/world/core.mjs
          node --check permutation-state-prototype/proof/core.js
          node --check permutation-state-prototype/proof/app.js
          node --check permutation-state-solana-receipt-spike/server/devnet-gateway.mjs
          node --check permutation-state-solana-receipt-spike/server/game-contract.mjs
          node --check permutation-state-solana-receipt-spike/server/world-service.mjs
          node --check permutation-state-solana-receipt-spike/server/civilization-service.mjs
          node --check permutation-state-solana-receipt-spike/server/civilization-server.mjs
          node --check permutation-state-solana-receipt-spike/client/world-magicblock-transport.mjs
          node --check permutation-state-solana-receipt-spike/server/local-e2e.mjs
          node --check permutation-state-solana-receipt-spike/server/world-chain-local-e2e.mjs
          node --check permutation-state-solana-receipt-spike/server/start-local-stack.mjs
      - name: Run living-world simulation tests
        run: node --test permutation-state-prototype/world/core.test.mjs
      - name: Run civilization strategy simulation tests
        run: node --test permutation-state-prototype/civilization/*.test.mjs
      - name: Validate recorded proof result
        run: python3 -m json.tool permutation-state-prototype/proof/qa-proof-result.json >/dev/null
      - name: CI stays key-free on push and pull request
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml==6.0.2
          python3 scripts/ci/check-ci-keyfree.py .github/workflows/ci.yml
      - name: Local play kit (scripts/play-local.sh) arguments and refusals (no build, no world)
        run: python3 -I scripts/tests/test_play_local.py

  receipt-tests:
    name: Solana receipt scaffold tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: permutation-state-solana-receipt-spike
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: permutation-state-solana-receipt-spike/package-lock.json
      - name: Run Rust tests
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      # Key-free subset under the runtime guard; the listed files that use
      # keys run only in the key-tests job.
      - name: Run adapter tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh permutation-state-solana-receipt-spike 'client/*.test.mjs' 'server/*.test.mjs'
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate

  program:
    name: Rules, program (host + SBF + LiteSVM), server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchains
        # The root, crate and svm-tests rust-toolchain.toml files select them;
        # rustup may not auto-install, so both are installed explicitly.
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            permutation-chain/target
            permutation-server/target
            permutation-chain/svm-tests/target
          key: program-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
      - name: Rules
        run: cargo test --locked --release -p permutation-rules
      - name: Program host tests
        run: cargo test --locked -p permutation-chain
      - name: Program layouts build without the program feature
        run: cd permutation-chain && cargo check --locked --no-default-features --features no-entrypoint
      - name: Server (golden, codec vectors)
        run: cd permutation-server && cargo test --locked --release
      - name: Server binaries (verify, play, replay) outside cargo test
        run: cd permutation-server && cargo build --locked --release --bins
      # Moved to key-tests: permutation-chain/svm-tests/run.sh (SBF build + LiteSVM).
      # Format and lints of what this job builds but nothing linted (2026-11-21):
      # the v9 program (clippy; its format is the root workspace's, checked in
      # frontier-program), the server, and the v9 LiteSVM harness. Clippy
      # compiles every target and runs none: no test, no .so, no key.
      - name: v9 program lints
        run: cargo clippy --locked -p permutation-chain --all-targets -- -D warnings
      - name: Server format and lints
        working-directory: permutation-server
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: v9 LiteSVM harness format and lints (compile only)
        working-directory: permutation-chain/svm-tests
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

  frontier-sim:
    name: Frontier simulator (conservation, replay, doctrine balance gate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontier-sim
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml pins 1.89.0)
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontier-sim/target
          key: frontier-sim-${{ hashFiles('frontier-sim/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format and lints
        run: |
          cargo fmt -- --check
          cargo clippy --locked --release --all-targets -- -D warnings
      # Includes `balance::tests::doctrine_balance_gate` (the rules-v10
      # doctrine table on a 360-season paired harness, D23 on: each mean index
      # within ±0.2%, a proxy for O5) and its negative controls, which must
      # fail: the draft table, F on the Knight line and an in-bounds A
      # boost (design §4.1, O5). The O5 band itself (16.7 ± 2 on 1,500
      # seasons) runs in doctrine-balance.yml, nightly and on demand.
      - name: Simulator tests
        run: cargo test --locked --release
      # M1 CL-16: the bot criterion restated on a held-out seed set
      # (30002..30004) with D23 (one office-term per wallet) on; exit 1 if
      # any bot choice returns >= 1.0.
      - name: Bot criterion, held-out seeds (CL-16)
        run: cargo run --locked --release -- criterion --best-response --seeds 3 --first-seed 30001 --gate

  gateway:
    name: Gateway and web client tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: permutation-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: permutation-gateway/package-lock.json
      - run: npm ci --ignore-scripts
      # Key-free subset under the runtime guard (scripts/ci/no-keys-guard.mjs);
      # the files listed in scripts/ci/node-key-tests.txt run only in the key-tests job.
      - name: Gateway and web tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh permutation-gateway 'test/*.test.mjs' 'screens/logic.screen.mjs'
      # Workstream 01: the closed-account caravan link (coop/arrived.mjs) and the board page's row and click routing, on a
      # fake chain only; same runner and guard (a file listed in node-key-tests.txt or naming a key API is refused there).
      - name: Workstream 01 closed caravan link tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh workstreams/01-national-strategy test/coop.arrived.test.mjs
      # Workstream 01: the board's English (coop/tr.mjs, coop/lang/en.mjs): every Japanese text of the board's code has
      # English, the table is well formed, texts as shown come out in English. No world, no browser, no key.
      - name: Workstream 01 board English tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh workstreams/01-national-strategy test/coop.lang.test.mjs
      # test-gaps-2: every other key-free test of the ① board — requests, deliveries and their verdict (coop/ws04.mjs
      # fulfilmentOf: "fulfilled" / "not-reached" never claimed against the true amounts, coop.delivery-test-gaps), the
      # supply model, placement, conditions, joint counts and their fuzz tests (207 tests the two steps above never ran).
      # The same runner and guard: a file listed in node-key-tests.txt (the board's signing tests) is never run here.
      - name: Workstream 01 board, requests and delivery tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh workstreams/01-national-strategy 'test/*.test.mjs'
      # The six-nation recording tool (scripts/demo/sixnation): its pure part — argument parsing, the refusal of any
      # non-TEST cluster, the seed's choices, the launcher's command line, the summary and the grid. No world is started.
      - name: Six-nation recording tool tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh scripts/demo/sixnation test/lib.test.mjs
      # The six-nation map timelapse (scripts/demo/sixnation/map): argument parsing, the refusal of any chain/RPC/key
      # flag, the simulator's command line, the video clock and the ffmpeg lines. No browser, no simulator run.
      - name: Six-nation map timelapse tool tests (key-free)
        working-directory: .
        run: scripts/ci/node-keyfree.sh scripts/demo/sixnation/map test/lib.test.mjs

  # Workstream 12 (memory): its audited key-free test files (workstreams/12-memory/tools/keyfree-tests.txt) through
  # the same runner and guard as the gateway job. Node 22: node:sqlite (reading workstream 4's store) and JSON.parse
  # source text (exact u64). 12 has no dependencies of its own; the gateway's npm install lets the real-13 resident
  # test (adapters-ws13-real) load 13's demo world, which imports the gateway client (@solana/web3.js, ...).
  # WS13_KEYLESS=1: 13's harness hands out keyless identities (its default; stated here so no environment changes it).
  # 12's tests that sign (allocation-signature, presigned-table) are not in the list and are not run anywhere in CI;
  # the others read their test signatures from fixtures/presigned-signatures.json.
  memory12:
    name: Workstream 12 memory tests (key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: permutation-gateway/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: permutation-gateway
      - name: Workstream 12 tests (key-free)
        env:
          WS13_KEYLESS: '1'
        run: scripts/ci/node-keyfree.sh workstreams/12-memory $(grep -v '^#' workstreams/12-memory/tools/keyfree-tests.txt | grep .)

  # Workstream 15 (co-op outcome evaluator): its node tests through the same runner and guard. No npm install (15 has
  # no dependencies). Node 20 and 22: parseExact reads ④'s u64 tags through JSON.parse's source text on 22 and through
  # its quoting fallback on 20; both must give the same result.
  coop15:
    name: Workstream 15 co-op evaluator tests (key-free, Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Workstream 15 tests (key-free)
        run: scripts/ci/node-keyfree.sh workstreams/15-coop-outcomes 'test/*.test.mjs'

  # Workstream 06 (creation): its node test files that the scan does not list (scripts/ci/node-key-tests.txt lists the
  # other 12, which sign with fixed demo seeds; 14 of the 15 run are cleared by scripts/ci/node-key-reviewed.txt)
  # through the same runner and guard. No npm install (06 has no dependencies). Node 20 and 22, as 06's
  # tests run locally on both (the journal lock reads /proc on Linux, injectable in the tests). The ③/④ integration
  # tests skip without WS03_ROOT, WS04_ROOT and RUNEXEC_BIN, as on a fresh checkout; the runexec-live job runs them.
  creation06:
    name: Workstream 06 creation tests (key-free, Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Workstream 06 tests (key-free)
        run: scripts/ci/node-keyfree.sh workstreams/06-creation 'test/*.test.mjs'

  # Devnet readiness (DRAFT, 2026-11-18): the dry-run planner's tests (cost model, artefact checks, send gate) with a
  # fake file system and a fake Solana CLI. Nothing builds, deploys or contacts a cluster; no npm install.
  devnet-dry-run:
    name: Devnet dry-run planner tests (key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Devnet dry-run tests (key-free)
        run: scripts/ci/node-keyfree.sh scripts/devnet 'test/*.test.mjs'

  # ------------------------------------------------------------------ M1
  # Frontier M1 (docs/frontier/m1/M1-CONTRACT.md §3.2, §12; CL-36). The
  # crates arrive wave by wave (frontier-abi and frontier-node in wave 1,
  # permutation-frontier and its svm-tests in wave 2), so each step runs
  # only once its crate exists on the branch. Agave 3.1.9's validator has
  # no BLS12-381 syscalls; LiteSVM with the mainnet feature set is enough
  # for the CU gates (the 7-day season runs locally, not in CI).
  frontier-program:
    name: Frontier M1 rules, ABI and program (host + SBF v2 + LiteSVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
            permutation-frontier/svm-tests/target
          key: frontier-program-${{ hashFiles('Cargo.lock', 'permutation-frontier/svm-tests/Cargo.lock', '**/rust-toolchain.toml') }}
      # The owner-approved rename (docs/frontier/DECISIONS.md V1) legitimately
      # changed one comment in permutation-chain/src/lib.rs and the key-backup
      # header in permutation-server/web/session.mjs (commit 8c1b5ea), so the
      # pinned base for "untouched" is that commit, not d95fa25. The script
      # also guards that sessionText() and every domain/seed literal
      # ("PS/...", "permutation-state/...", "PSF-...") are unchanged since
      # d95fa25. Needs the full history (fetch-depth 0 above).
      - name: v9 files the Frontier must not touch (session text, v9 program)
        run: scripts/check-v9-frozen.sh
      - name: Format (root workspace)
        run: cargo fmt --all -- --check
      - name: Rules lints
        run: cargo clippy --locked -p permutation-rules --all-targets -- -D warnings
      - name: ABI lints, tests and vector freshness
        if: hashFiles('frontier-abi/Cargo.toml') != ''
        run: |
          cargo clippy --locked -p frontier-abi --all-targets -- -D warnings
          cargo test --locked -p frontier-abi
          cargo run --locked -p frontier-abi --bin abi-vectors -- --check
      - name: Program host tests (default features and layouts only)
        if: hashFiles('permutation-frontier/Cargo.toml') != ''
        run: |
          cargo clippy --locked -p permutation-frontier --all-targets -- -D warnings
          cargo test --locked -p permutation-frontier
          cargo test --locked -p permutation-frontier --no-default-features
      # expansion-gameplay-1: the wide claim's reach from the nation's land (0xD9 with the optional reach witness). The
      # wide land harness (`wide-world-experimental`) is built by no other step; only this test of it runs here (the
      # harness's muster/return test fails on main too: reports/expansion-gameplay-1.md).
      - name: Program host tests (wide claim reach, neutral wide land)
        if: hashFiles('permutation-frontier/Cargo.toml') != ''
        run: cargo test --locked -p permutation-frontier --features wide-world-experimental --lib -- map_growth_runtime_tests::wide_land::wide_claim_reaches_from_the_nations_land_not_only_from_home map_growth_runtime_tests::wide_land::wide_land_opens_unowned_under_the_neutral_rule --exact
      # territory-impl (owner 2026-11-24 12:09 T-1..T-8, E-Q1, U3): the player-territory flow through the real dispatch
      # (tile claims, upkeep, decay, villages on own tiles, conquest transfer, no idle-home release), single-threaded
      # (the harness shares the test clock), and the territory model of frontier-abi.
      # test-gaps-territory: + proc::wide::territory:: (the program's settle_into over the shared Q-LP17-1 (b) upkeep
      # vectors frontier-abi/vectors/territory-upkeep-b.txt; frontier-abi's world_index::territory runs the (b)
      # property tests and checks the vectors are current).
      - name: Program host tests (player territory)
        if: hashFiles('permutation-frontier/Cargo.toml') != ''
        run: |
          cargo test --locked -p permutation-frontier --features wide-world-experimental --lib -- map_growth_runtime_tests::wide_land::territory_tests proc::wide::territory:: --test-threads=1
          cargo test --locked -p frontier-abi --features world-index-experimental --lib -- world_index::territory world_index::rules world_index::land
      # Moved to key-tests: the SBF v2 builds (twice; Prize for cross-program
      # tests) and the LiteSVM suite G1-G13.
      # The LiteSVM harness itself (67k lines of tests) was formatted and linted
      # nowhere, key-tests included, and drifted (D-ws02-stockswap-10). Format
      # and clippy only (2026-11-21): clippy compiles every target and runs
      # none, so no test runs, no .so is read and no key is made;
      # scripts/ci/check-ci-keyfree.py allows a step naming svm-tests only when
      # its `run` is nothing but such lines. The probe and workstream 03's
      # courier tests (which link the harness) reuse the harness's target dir.
      - name: Frontier LiteSVM harness format and lints (compile only)
        if: hashFiles('permutation-frontier/svm-tests/Cargo.toml') != ''
        working-directory: permutation-frontier/svm-tests
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Harness probe format and lints (compile only)
        if: hashFiles('permutation-frontier/svm-tests/probe/Cargo.toml') != ''
        working-directory: permutation-frontier/svm-tests/probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/permutation-frontier/svm-tests/target
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Workstream 03 courier tests format and lints (compile only)
        if: hashFiles('workstreams/03-composability/courier-tests/Cargo.toml') != ''
        working-directory: workstreams/03-composability/courier-tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/permutation-frontier/svm-tests/target
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
      # Format only: this crate compiles the program source on 1.95.0, whose
      # clippy has lints the program (linted on 1.89.0 above) does not meet.
      - name: Runtime-contract support crate format
        if: hashFiles('permutation-frontier/runtime-contract-tests/Cargo.toml') != ''
        working-directory: permutation-frontier/runtime-contract-tests
        run: cargo fmt -p runtime-contract-support -- --check

  # Workstreams 09 (capacity-preview) and 10 (custody-preview): host only, key-free. No other job compiles these
  # features (frontier-program builds default features and --no-default-features), so ~6.6k lines of feature-gated
  # rules, ABI and program code would rot unseen. Lints and tests of only the three crates the features touch, with
  # each feature alone and both together (the combinations lib.rs allows; with rights/nft/wide-world they are
  # compile_error!). No SBF build and no LiteSVM here: those stay local / key-tests. One runner, cache seeded from
  # frontier-program's (same lock files and toolchain), so a warm run is a few minutes.
  frontier-previews:
    name: Frontier previews 09 capacity / 10 custody (rules, ABI, program host tests, key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml pins 1.89.0)
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: frontier-previews-${{ hashFiles('Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: |
            frontier-program-
      - name: Lints with the preview features
        run: |
          cargo clippy --locked -p permutation-rules --features capacity-preview --all-targets -- -D warnings
          cargo clippy --locked -p permutation-rules --features std,territory-preview --all-targets -- -D warnings
          cargo clippy --locked -p frontier-abi --features capacity-preview --all-targets -- -D warnings
          cargo clippy --locked -p permutation-frontier --features capacity-preview --all-targets -- -D warnings
          cargo clippy --locked -p permutation-frontier --features custody-preview --all-targets -- -D warnings
          cargo clippy --locked -p permutation-frontier --features capacity-preview,custody-preview --all-targets -- -D warnings
          cargo clippy --locked -p frontier-abi --features capacity-preview,feature-coexist --all-targets -- -D warnings
          cargo clippy --locked -p permutation-frontier --features coexist-experimental --all-targets -- -D warnings
      - name: Host tests with the preview features
        run: |
          cargo test --locked -p permutation-rules --features capacity-preview
          # territory preview (owner Q-2): the kernel and its committed vectors (the page/AI copy checks the same file)
          cargo test --locked -p permutation-rules --features territory-preview territory
          # (test-gaps-2: includes capacity::custody_address_vectors_tests — the ⑨ pool/job, ⑩ lot and ② grant addresses
          #  with their generation, and the two lanes, written to frontier-abi/vectors/custody-addresses.txt and checked
          #  current; the page's builders replay the file in web-frontier-custody-test-gaps / -rights-test-gaps)
          cargo test --locked -p frontier-abi --features capacity-preview
          cargo test --locked -p permutation-frontier --features capacity-preview
          cargo test --locked -p permutation-frontier --features custody-preview
          cargo test --locked -p permutation-frontier --features capacity-preview,custody-preview
          # ②+⑨+⑩ coexist (workstream 4 rev 8): the one registry, and the combined build on S1 (0x3005)
          cargo test --locked -p frontier-abi --lib --features capacity-preview,land-preview,conquest-dispatch-experimental,feature-coexist feature_registry
          cargo test --locked -p permutation-frontier --lib --features coexist-experimental -- --test-threads=1

  frontier-node:
    name: Frontier M1 off-chain workspace (keeper, herald, verifier, localnet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (frontier-node/rust-toolchain.toml pins 1.95.0)
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontier-node/target
          key: frontier-node-${{ hashFiles('frontier-node/Cargo.lock', 'frontier-node/rust-toolchain.toml') }}
      # In-process tests bind 127.0.0.1:0 and use the test-beacon key
      # (drand-replay --test-key, I-53); no network, no fixed ports.
      # Format and lints compile every target but run none. The tests run only
      # for the library crates with no key use (findex, herald); the workspace
      # tests (test payers derived from a seed, the test-beacon key, signed
      # transactions) are in key-tests.
      - name: Format, lints and key-free tests
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p findex --lib
          # Literal records only (no key generated, derived or signed): a
          # reader never sees a healthy ingest as blocked (loop-play B4-D).
          cargo test --locked -p findex --test reader_during_ingest
          # verify-pr158: lookup table snapshots in record frames (literal
          # records): old archives byte-identical, malformed ones refused.
          cargo test --locked -p findex --test pr158_archive_tables
          cargo test --locked -p herald --lib
          # test-gaps-territory: the wide routes' tests (territory + player territory routes: ETag/304/gzip per
          # revision, served tiles and summary bytes = the captured chain records, #240/#242) compile only with
          # `wide-world-experimental`, so the line above never ran them. In-memory folds and handlers, no listener, no key.
          cargo test --locked -p herald --features wide-world-experimental --lib
          # test-gaps-2: ② rights' Grant fold (/h/grants: every record into its Grant, parties and places, orphans,
          # the checkpoint, the Province scope) compiles only with `rights-records`; the lines above never ran it.
          cargo test --locked -p herald --features rights-records --lib
          # test-gaps-2: the verifier's ⑩ custody check V26 (history, instruction replay incl. the caravans' DepositLot /
          # WithdrawLot / SettleCustody / ReconcileLot, state audit: a seized vault's open lot is never PASS) and ② VR
          # (the Grant's records, option A's station = the grantee's Vault). Literal and recorded fixtures, unsigned
          # wire bytes with placeholder signatures: no key is generated, derived or signed. They ran nowhere before.
          cargo test --locked -p verify --test custody --test custody_history --test custody_replay --test custody_replay_caravans --test custody_state --test rights_replay
          # fix-herald-gw-502: the /gw relay proxy when the relay answers early
          # and resets (429 kept, one write, no re-send). Loopback fakes only.
          cargo test --locked -p herald --test gw_relay_reset
          # herald-pull-chunk: a 1,587-tx backlog archived in chunks of 50 (an account-read failure re-fetches ≤ 50), the
          # live slot moving on its own Clock timer during pulls, /h/status ingest.backlog / lastArchivedSlot. Loopback
          # fake RPC (127.0.0.1:0), unsigned wires with placeholder signatures: no key.
          cargo test --locked -p findex --test pull_chunk
          cargo test --locked -p herald --test pull_chunk
          # test-gaps-7: verify-pr288/292's hand checks at the herald's level (same loopback fake RPC, no key): a herald
          # pulling 50 at a time with getMultipleAccounts failures archives and folds the same as an unchunked one and
          # reopens (checkpoint + tail) at the newest archived slot; a getTransaction 429 storm on the shared per-method
          # pacer, through RpcClient::call, never freezes the live slot and keeps every request ≥ the gap apart (the
          # pre-#292 Process scope freezes it); the frontier-herald binary (--listen 127.0.0.1:0) logs hundreds of
          # failed Clock reads in ONE line while its ingest archives everything.
          cargo test --locked -p herald --test test_gaps_7
          # test-gaps-3: nation chat (#263) with no key. tests/chat.rs signs as players (key tests only), so CI ran no
          # chat test. This one replays literal posts and read tokens signed once by hand (tests/vectors/chat-signed.json;
          # the herald only verifies): 3 per turn under parallel posts and across the ±1 turn window, 40 per bell-day,
          # a replay refused also after a restart, nation-only reads and reports, bad token windows, 7-day expiry, and
          # the text rules = the page's on the shared vectors (tests/vectors/chat-text-rules.json). 127.0.0.1:0 only.
          # test-gaps-4 (#274): K9 a nation's every answer (socket, posts, reads, reports, info, after a restart) is byte
          # for byte the same whether another nation speaks; K10 a stale nextSeq on disk never reuses a kept id.
          cargo test --locked -p herald --test chat_keyfree
          # B5 (read-only devnet run): the recorded devnet answers replayed
          # offline on loopback (429 + Retry-After retried and bounded, a
          # version-1 transaction read and never stalling the keeper feed),
          # the node-filtered getProgramAccounts on the in-memory localnet,
          # and VS / V1 over the recorded devnet read (a v1 transaction of
          # the program is never PASS). No key, no network beyond loopback.
          cargo test --locked -p fclient --lib
          cargo test --locked -p fclient --test rpc_devnet_replay
          # test-gaps-7: rpc-pacer-per-method (#292)'s verifier tests V1-V8 (verify-pr292) never ran in CI: a fake
          # transport and the public Pacer API, no socket, no key (total rate ≤ 1/gap under mixed storms, a
          # getTransaction 429 never delays getAccountInfo, 503 holds every method, cap/jitter/reset per method,
          # the Process scope, the throttle log, FCLIENT_PACER_SCOPE).
          cargo test --locked -p fclient --test pacer_verify
          # test-gaps-7: verify-local-source (#291)'s `frontier-verify pull --incremental` tests never ran in CI
          # either; plus killed twice mid-chunk, resumed and grown = one default pull's judge input and verdict.
          # A JSON-RPC stand-in on 127.0.0.1:0, opaque transactions, nothing signed.
          cargo test --locked -p verify --test pull_incremental --test test_gaps_7_incremental
          cargo test --locked -p keeper --test cluster_feed_v1
          # keeper-test-seam: the key-free send-pass / care tests (see the playable-lane step) without features.
          cargo test --locked -p keeper --lib -- tg6_ fkc_ v290_ test_gaps_6_
          cargo test --locked -p keeper --test key_free_send_pass
          cargo test --locked -p verify --test devnet_b5_witness --test devnet_b5_program_accounts
      # verify-pr157: `scripts/play-local.sh` builds itest, herald and keeper with feature sets that no other
      # step compiles (the workspace lint above builds itest without features, so its feature-gated modules,
      # e.g. destination_driver, are never compiled). #154 changed keeper_core's evidence_of / commands_in and
      # main stayed green while play-local could not build. Compile (never run) every target of each feature
      # set play-local and the itest harnesses use: `cargo check` runs nothing, so no key is generated,
      # derived or signed. No SBF build (play-local's own program step is not here).
      - name: Local-play builds (play-local's feature sets compile; key-free)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo check --locked -p itest --features localnet-land-play --all-targets
          cargo check --locked -p itest --features localnet-coexist-lane-play --all-targets
          cargo check --locked -p itest --features localnet-coexist-harness --all-targets
          cargo check --locked -p itest --features localnet-conquest-play --all-targets
          cargo check --locked -p itest --features localnet-nft-harness --all-targets
          cargo check --locked -p itest --features localnet-expedition-harness --all-targets
          cargo check --locked -p herald --features land-preview,wide-world-experimental,expedition-records-experimental --all-targets
          cargo check --locked -p herald --features land-preview,wide-world-experimental,expedition-records-experimental,coexist-lane,rights-records --all-targets
          cargo check --locked -p keeper --features expedition-dispatch-experimental --all-targets
          cargo check --locked -p keeper --features expedition-dispatch-experimental,coexist-lane --all-targets
      # test-gaps-7: the demo setup's FoldStale retry (#293 fix-loop27: a fold restarted from part 0 at the next bell,
      # at most 4 folds, any other refusal or an unknown outcome stopped at once) is tested only under
      # localnet-land-play, which the step above compiles but never runs. These are pure: a bell model and literal
      # `Sent` outcomes, no chain, no socket, no key (the filter runs no other itest lib test).
      - name: Local-play demo setup's fold retry (pure tests; key-free)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo test --locked -p itest --features localnet-land-play --lib capture_demo::tests::
          cargo test --locked -p itest --features localnet-land-play --test test_gaps_7_fold
      # Q16-1 = A (prize gate): the verifier's PLAYABLE lane (program version
      # 0x4804) is behind the `playable-lane` feature, which no other step
      # builds. Lint it, and run its checks over the committed recordings
      # (VL, VWL: wide land, claims, closes, economy, garrison, muster,
      # resolve and the wide keep capture; and
      # wallet_finals, the S1 lane with wallets in the finals; playable_march,
      # the ordinary sealed march judged by the S1 checks; playable_expedition,
      # the expedition wrapper and Free City conquest re-executed by VX with
      # the committed pinned .so in LiteSVM, signatures verified, none made;
      # playable_witness, VS's second-source cross-check, ⑰ Q-P1's lift of
      # an RPC history and ⑰ Q-P2's FAIL on agreeing witnesses, over the
      # genesis recording; p14b_devnet_no_conquest, P14 (b): the recorded
      # conquest kinds 12-18 re-executed on the NEW devnet .so are refused
      # BadData and never latch keeper A's indexes; playable_rent, rent-live-rest:
      # VX / VG re-execute under the season's recorded Rent sysvar — the
      # 6,960 recording passes under it and never under an assumed 5,080;
      # versioned_season and verify_pr155_vt_tampers, verifier-v0v1: a season
      # of v0 (lookup tables) and v1 player transactions PASSes, VT checks every
      # archived loadedAddresses against the lookup tables, tampers never PASS;
      # playable_territory, verifier-territory: #209's player territory on world 3's
      # .so, VWL re-runs every claim / upkeep settle / decay / conquest, tampers FAIL;
      # verifier_clock_fix, Q-W3VWS-1 (a): VG takes the Clock from the transactions'
      # effects when the RPC's blockTime is one second above it, never a tolerance). These tests
      # read recorded archives only: no key is generated, derived or signed
      # (every recorder in these files is #[ignore] and is not run here).
      - name: Verifier playable lane (lints, recorded-fixture tests; key-free)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo clippy --locked -p verify --features playable-lane --all-targets -- -D warnings
          # test-gaps-territory: VWL's settle_into over the shared Q-LP17-1 (b) upkeep vectors (pure, no archive, no key)
          cargo test --locked -p verify --features playable-lane --lib -- vwl_wide_land::territory::
          # verifier-clock-fix: genesis::ClockRule's slot decision, re-take and final-state survival (pure)
          cargo test --locked -p verify --features playable-lane --lib -- genesis::clock_rule::
          cargo test --locked -p verify --features playable-lane --test playable_lane --test playable_wide_land --test playable_wide_claims --test playable_wide_next --test playable_wide_march --test playable_march --test playable_legacy_war --test playable_expedition --test playable_genesis --test playable_witness --test playable_rent --test wallet_finals --test p14b_devnet_no_conquest --test versioned_season --test verify_pr155_vt_tampers --test verify_alt_archive --test verify_pr158_attacks --test playable_v11_declared --test playable_v7_declared --test verify_pr179_attacks --test playable_territory --test verifier_clock_fix

      # Devnet blocker B3 (owner decision B7): frontier-operator's playable-lane
      # preset S1_DEVNET_WIDE_7D (program version 0x4804) is behind the stack
      # crate's `playable-lane` feature, which no other step builds. Lint it;
      # run its pure unit tests, the offline plan of the committed playable
      # profile (snapshot) and the send gate on the profile's devnet URL
      # (refused before any key is read or host contacted). These generate,
      # derive and sign nothing; the end-to-end run (TEST keys, a local chain)
      # is in key-tests.
      # Devnet runbook gaps P6 + P7: the keeper's wide rings (rings duty
      # `wide_rings`) and `wide-tickets` role are behind the keeper's
      # `playable-lane` feature, which no other step lints. Their unit tests
      # (plans, builders, config, order) generate, derive and sign nothing;
      # the end-to-end run (P5) is in key-tests. Gap P8: the feed guard's
      # accounting of wide-land PSW1 records (`wide_feed_guard`, literal bytes);
      # its end-to-end run (P6) is in key-tests too. Gaps P10 + P13: the feed
      # guard's reading of the expedition's records over the committed real
      # recordings (`expedition_feed_guard`, literal bytes) and the
      # `expeditions` role's config; its end-to-end run (operator_playable P11) is in key-tests.
      # Gap P14 option (a): the same test reads the wide Free City conquest's
      # records (kinds 12-18) and its mutations; its end-to-end run (operator_playable P14) too.
      - name: Keeper playable lane (lints, unit tests; key-free)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo clippy --locked -p keeper --features playable-lane --all-targets -- -D warnings
          # test-gaps-territory: + territory:: (the territory role's keys, thinning, caps, landed-settle memory, feed
          # claims, home lookup; pure, literal records) — the filter above it never matched `territory::tests`.
          cargo test --locked -p keeper --features playable-lane --lib -- widelane:: widetickets:: wideresolve:: config:: rings:: territory::
          cargo test --locked -p keeper --features playable-lane --test wide_feed_guard
          cargo test --locked -p keeper --features playable-lane --test expedition_feed_guard
          cargo test --locked -p keeper --features playable-lane --test verify_pr121_guard_mutations
          cargo test --locked -p keeper --features playable-lane --test verify_pr124_conquest_mutations
          # test-gaps-6: #282's never-landed settle over a 134-row care backlog (literal journal rows, a port that refuses
          # send; 32 proven per read, care blocked until the last, then a top-up admitted; cache-only nulls never settle)
          # and #280's 32,000 CU Reveal request per lane in the keeper's unsigned message (+ the fee rise). No key.
          cargo test --locked -p keeper --features playable-lane --test test_gaps_6
          # keeper-test-seam (Q-TG6-2): the #282/#290 send-pass and care-cadence tests (16 sends per blockhash, the 15 s
          # refresh on tokio's paused clock, the sent Reveal CU, the side care inside a 107-min tick) sign with
          # testkit::FakeSigner (no key, no seed) and read public drand info; key_free_send_pass pins that set.
          cargo test --locked -p keeper --features playable-lane --lib -- tg6_ fkc_ v290_ test_gaps_6_
          cargo test --locked -p keeper --features playable-lane --test key_free_send_pass
      - name: Operator playable lane (lints, offline plan, send gate; key-free)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          cargo clippy --locked -p stack --features playable-lane --all-targets -- -D warnings
          cargo test --locked -p stack --features playable-lane --lib operator::
          # devnet-end-season (verify-pr180): end-season's plan, order, refunds and flag checks (pure; no key)
          cargo test --locked -p stack --features playable-lane --lib operator_end::
          # devnet-72bell-pair (PKF): why PPAIR's OUT leg is TEST-sealed (the shipped real quicknet rounds give a
          # season at most one real arrival bell; public signatures verified only), PCAP's lag report and PPAIR's
          # OUT tile (pure). No key is generated, derived or signed.
          cargo test --locked -p stack --features playable-lane --test operator_playable -- p1_ p2_ pkf_

  frontier-wasm:
    name: Frontier M1 web kernels (WASM build and hash)
    runs-on: ubuntu-24.04
    env:
      # The runner's own builds are kept and uploaded below (the bytes differ
      # from the reference host's; see "Cross-host bytes" in build-wasm.sh).
      BUILD_WASM_KEEP: ${{ github.workspace }}/wasm-built
    steps:
      - uses: actions/checkout@v7
      # The wasm32 target is installed on the CI runner only; the local
      # machine waits for owner decision O-M1-12 (PENDING-OWNER there).
      - name: Rust toolchain and wasm32 target
        if: hashFiles('scripts/build-wasm.sh') != ''
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      # Host-target format and lints of the kernel crate, each feature set the
      # three modules are built with (2026-11-21). Compiles, runs nothing.
      - name: Kernel crate format and lints
        if: hashFiles('frontier-wasm/Cargo.toml') != ''
        working-directory: frontier-wasm
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --features cq --all-targets -- -D warnings
          cargo clippy --locked --features s1 --all-targets -- -D warnings
      - name: WASM build matches the committed module
        if: hashFiles('scripts/build-wasm.sh') != ''
        run: scripts/build-wasm.sh --check
      # The conquest module (program version 3 seasons and the conquest scripts).
      - name: Conquest WASM build matches the committed module
        if: ${{ !cancelled() && hashFiles('scripts/build-wasm.sh') != '' }}
        run: scripts/build-wasm.sh --cq --check
      # The S1 module the web client loads for an S1 season (program version 4).
      - name: S1 WASM build matches the committed module
        if: ${{ !cancelled() && hashFiles('scripts/build-wasm.sh') != '' }}
        run: scripts/build-wasm.sh --s1 --check
      - name: Upload this runner's modules
        if: ${{ !cancelled() && hashFiles('scripts/build-wasm.sh') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontier-wasm-x86_64-unknown-linux-gnu
          path: wasm-built/
          if-no-files-found: warn
          retention-days: 14

  # The Linux job above can only compare its build with the Linux hash recorded
  # in <module>.hosts. Whether the COMMITTED module is what the source builds is
  # only visible on the host that built it (aarch64-apple-darwin): PR #69 merged
  # a frontier.wasm that its own source did not build, and the Linux job was
  # green. This job rebuilds on an Apple-silicon runner and accepts byte
  # identity only. Key-free: it compiles the kernels and runs no test.
  frontier-wasm-reference:
    name: Frontier M1 web kernels (reference host, byte-identical)
    runs-on: macos-15
    env:
      BUILD_WASM_KEEP: ${{ github.workspace }}/wasm-built
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          rustc +1.95.0 -vV
      - name: WASM build is byte-identical to the committed module
        run: scripts/build-wasm.sh --check --reference
      - name: Conquest WASM build is byte-identical to the committed module
        if: ${{ !cancelled() }}
        run: scripts/build-wasm.sh --cq --check --reference
      - name: S1 WASM build is byte-identical to the committed module
        if: ${{ !cancelled() }}
        run: scripts/build-wasm.sh --s1 --check --reference
      - name: Upload this runner's modules
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontier-wasm-aarch64-apple-darwin
          path: wasm-built/
          if-no-files-found: warn
          retention-days: 14

  prize-program:
    name: Prize pool program (host + SBF v2 + LiteSVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            permutation-prize/target
            permutation-prize/svm-tests/target
          key: prize-program-${{ hashFiles('permutation-prize/Cargo.lock', 'permutation-prize/svm-tests/Cargo.lock', 'rust-toolchain.toml', 'permutation-prize/svm-tests/rust-toolchain.toml') }}
      - name: Prize pool format, lints and host tests
        working-directory: permutation-prize
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          # ⑰ settlement windows (feature `epochs`; test USDC, local/devnet only)
          cargo clippy --locked --all-targets --features epochs -- -D warnings
          cargo test --locked --features epochs
          # World goals' prize pool (feature `goals`; test USDC, local/devnet only; win-conditions §10.1)
          cargo clippy --locked --all-targets --features goals -- -D warnings
          cargo test --locked --features goals
      # Moved to key-tests: the Prize SBF v2 build and the LiteSVM tests.
      # Their format and lints run here too (2026-11-21; key-tests is manual,
      # so they were checked on no pull request). Compile only, no test run.
      - name: Prize pool LiteSVM harness format and lints (compile only)
        working-directory: permutation-prize/svm-tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

  # Workstream 04's host runs of the real prize and game programs (no keys:
  # fixed keys and program addresses only; System, SPL Token and sysvars are
  # host stubs).
  exec-native:
    name: Execution host E2E (prize + game programs, key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Format, lints and tests
        if: hashFiles('workstreams/04-execution/e2e-native/Cargo.toml') != ''
        working-directory: workstreams/04-execution/e2e-native
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Lints only: 04's executor is written wider than rustfmt's 100 columns
      # and tests/store_observation.rs pins two of its source lines, so its
      # format is not checked (2026-11-21).
      - name: Executor lints
        if: hashFiles('workstreams/04-execution/Cargo.toml') != ''
        working-directory: workstreams/04-execution
        run: cargo clippy --locked --all-targets -- -D warnings

  # The workstreams' small host crates (kernels, bridges, a vector tool), each
  # its own workspace, were built by no job (2026-11-21). Format and clippy
  # only: every target is compiled, nothing is run, no key. with-bridge10 has
  # no lock file (its run.sh builds it in a temporary tree), so format only.
  workstream-crates:
    name: Workstream host crates (format and lints, key-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml files pin 1.89.0)
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Format and lints
        run: |
          for d in \
            workstreams/03-composability/courier \
            workstreams/07-player-experience/rust-vectors \
            workstreams/09-capacity/kernel \
            workstreams/09-capacity/bridge10 \
            workstreams/10-custody/custody \
            workstreams/10-custody/adapter-09 \
            workstreams/11-extensions/creation-bridge \
            workstreams/11-extensions/ext-kernel
          do
            echo "== $d"
            (cd "$d" && cargo fmt -- --check && cargo clippy --locked --all-targets -- -D warnings)
          done
          echo "== workstreams/10-custody/adapter-09/with-bridge10 (format only)"
          (cd workstreams/10-custody/adapter-09/with-bridge10 && cargo fmt -- --check)

  # Workstream 04's native `runexec` (2026-11-20, STATE D34): build it, run 04's own cargo tests (simulated world;
  # the gateway cases stay #[ignore], their bridge signs with test keys) and 06's connect-live tests against this
  # checkout's ③ and ④ with the binary just built (RUNEXEC_BIN_SHA256 names it for node-keyfree.sh). All 7
  # connect-live tests must run, none skipped. Network: crates.io and npm only.
  runexec-live:
    name: Execution runexec + 06 connect-live (key-free, Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build runexec, run 04's tests and 06's connect-live tests
        run: scripts/ci/ws04-runexec-live.sh

  # ------------------------------------------------------------ key tests
  # Every check that generates, derives or signs with a key, unchanged from
  # the jobs above. Never started by a push or a pull request.
  walletless-demo:
    # The walletless static demo (permutation-gateway/demo): the real page + the screens sample world in the browser.
    # Key-free here: build the bundle and check it without a browser. Its Playwright play-through signs with the page's
    # test Dev Wallet in the browser, so it runs only in the manual key-tests job below.
    name: Walletless demo bundle (build + key-free checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the static bundle and check it
        working-directory: permutation-gateway/demo
        run: |
          npm ci --ignore-scripts
          node build.mjs
          node check.mjs
      - name: Keep the bundle (download it to try the demo from any static host)
        uses: actions/upload-artifact@v4
        with:
          name: walletless-demo
          path: permutation-gateway/demo/dist
          retention-days: 7

  key-tests:
    name: Key-using tests (manual, owner-approved only)
    if: github.event_name == 'workflow_dispatch' && inputs.key_tests == 'approved'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchains
        run: rustup toolchain install 1.89.0 1.95.0 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Agave 3.1.9 (cargo-build-sbf, platform-tools v1.52)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.9/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Program tests against the SBF build (builds it with scripts/build-program.sh)
        run: permutation-chain/svm-tests/run.sh
        env:
          RELEASE_CHECK: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
      - name: Frontier SBF v2 build, twice
        if: hashFiles('scripts/build-frontier.sh') != ''
        run: scripts/build-frontier.sh --twice
      - name: Prize SBF v2 build
        run: scripts/build-prize.sh
      - name: Prize SBF v2 build with settlement windows (⑰, --features epochs)
        run: scripts/build-prize.sh --features epochs
      - name: Prize SBF v2 build with world goals (win-conditions §10.1, --features goals)
        run: scripts/build-prize.sh --features goals
      - name: Frontier LiteSVM suite (G1-G13 against the SBF build)
        if: hashFiles('permutation-frontier/svm-tests/run.sh') != ''
        working-directory: permutation-frontier/svm-tests
        run: ./run.sh --release
        env:
          RELEASE_CHECK: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
          PRIZE_SO: ${{ github.workspace }}/permutation-prize/target/deploy/permutation_prize.so
      - name: Prize pool LiteSVM format, lints and tests
        working-directory: permutation-prize/svm-tests
        env:
          # Named explicitly, so a missing epochs build fails instead of skipping (verify-pr54 D-8).
          PRIZE_EPOCH_SO: ${{ github.workspace }}/permutation-prize/target/deploy-epochs/permutation_prize.so
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
          # The legacy suite against the epochs build too: the feature changes no legacy behaviour.
          PRIZE_SO="$GITHUB_WORKSPACE/permutation-prize/target/deploy-epochs/permutation_prize.so" cargo test --locked --release --test pool
          # ... and against the goals build (the feature changes no legacy behaviour either).
          PRIZE_SO="$GITHUB_WORKSPACE/permutation-prize/target/deploy-goals/permutation_prize.so" cargo test --locked --release --test pool
      - name: frontier-node workspace tests
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo test --locked --workspace
          cargo test --locked --release --workspace
      - name: Operator playable lane end to end (devnet .so fixture, keeper, drand-replay fixture rounds, herald; ports 41450-41459, 41560-41565, 41590-41595, 41650-41655, 41950-41955 (P8, the legacy war), 41500-41505 (P11, the rim to wide expedition), 41670-41675 (P14, a third party's wide Free City conquest), 41540-41545 (PEND, the season's end with frontier-operator end-season); P7, P9 and P10 need a browser and skip)
        if: hashFiles('frontier-node/Cargo.toml') != ''
        working-directory: frontier-node
        run: |
          # (with `playable-lane`: P5 runs keeper A's wide rings and `wide-tickets` role; P3/P4 leave them off)
          cargo build --locked -p keeper --features playable-lane --bin frontier-keeper
          cargo build --locked -p drand-replay --bin drand-replay
          cargo build --locked -p herald --bin frontier-herald
          cargo test --locked -p stack --features playable-lane --test operator_playable
      - name: Gateway and web tests (all, including the listed key tests)
        working-directory: permutation-gateway
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Receipt adapter tests (all)
        working-directory: permutation-state-solana-receipt-spike
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Walletless demo play-through (Playwright; the page signs with its test Dev Wallet)
        working-directory: permutation-gateway/demo
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium
          node build.mjs
          node smoke.mjs --lang en --loop
          node smoke.mjs --lang ja --prefix /wylls/
