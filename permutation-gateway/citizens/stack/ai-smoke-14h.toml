# The smoke and slice-gate stack (AI-CITIZENS contract v1.2 sections 8.4 and 11.4; unit AC5): 6 AI citizens (deck-1,
# one Conqueror per nation) and the presenter seat, 30 script bots following the nation council, 12 game hours at 10x
# (about 72 min of wall time). The length is set from AC3a step 0 (d); 8 to 16 game hours are allowed.
#
# THIS COPY (integ-B, smoke-b4): the same stack with game_hours = 14 (84 bells of play, about 100 min with the drain) so that the fleet outlives
# council period 3 (c0 = 72); everything else equals ai-smoke.toml. Pass --deck deck-1 (the script derives the deck from the file name).
#
# Local test chain only. Base port 41900 (see ai-citizens.toml); one AI stack at a time.
