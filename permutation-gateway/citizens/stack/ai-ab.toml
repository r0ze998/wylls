# The A/B runs (AI-CITIZENS contract v1.2 section 9.3; unit AC5): 12 AI citizens (deck-2), 120 script bots following
# the nation council, 16 game hours at 10x (about 1.6 h of wall time per arm). Rep 1 uses bot_seed 33; the run script
# writes the copy for rep 2 (bot_seed 34) and rep 3 (bot_seed 35), where bot_seed and season_id are the same number
# and run_id names arm and rep. The two arms of a rep share every value here: only the seat's ballot differs.
#
# Local test chain only. Base port 41900 (see ai-citizens.toml); one AI stack at a time.
run_id = "ai-ab"
mode = "accel"
beacon = "test-key"
scale = 10
preseason_scale = 2000
game_hours = 16
drain_bells = 26
bots = 120
bot_seed = 33
season_id = 33
base_port = 41900
bots_args = "--follow-council"

[pools]
beneficiary_lamports = 1000000000

[chaos]
enabled = false

[adversary]
enabled = false
