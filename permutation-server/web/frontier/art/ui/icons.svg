<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <!--
    The Wylls HUD icons (docs/frontier/ux/UX-DESIGN.md section 6), authored by hand for this repository.
    One hand: a 24 px grid, 1.75 px strokes with round caps and joins, no fills except a light tone
    (fill-opacity) where a shape needs weight. Colour comes from the page (currentColor).
    Used as <svg class="ic"><use href="art/ui/icons.svg#name"/></svg> (hud/icons.mjs).
    No style attributes and no scripts: the page's CSP allows neither.
  -->

