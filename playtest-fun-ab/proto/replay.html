<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wylls 記録の見返し</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="replay">
<header class="top">
  <span class="title">Wylls 記録の見返し</span>
  <span class="chip" id="info">記録を読み込んでください</span>
  <span class="grow"></span>
  <input type="file" id="file" accept=".json,application/json">
  <button class="small" id="local">この端末の最後の記録</button>
  <a href="index.html">遊ぶ画面へ</a>
</header>
<main>
  <section class="mapbox">
    <div class="score" id="score"></div>
    <div id="map"></div>
    <div style="padding:6px 10px">
      <input type="range" class="slider" id="slider" min="0" max="0" value="0">
      <div class="formrow"><button class="small" id="prev">◀ 前</button><span id="pos"></span><button class="small" id="nextb">次 ▶</button>
        <label class="muted" style="font-size:13px"><input type="checkbox" id="reveal"> 他国の行き先も表示</label></div>
      <p class="muted" style="font-size:12px">地図は、そのラウンドの始め（誰も操作する前）の様子です。</p>
    </div>
  </section>
  <section class="panel">
    <div class="tabbody" id="body" style="max-height:none"><p class="muted">遊んだ後に「記録を保存」で出した JSON ファイルを選んでください。記録には操作だけが入っていて、戦いはこの画面で計算し直します。最後の状態が記録と一致するかも確かめます。</p></div>
  </section>
</main>
<script src="engine.js"></script>
<script src="bots.js"></script>
<script src="text.js"></script>
<script src="metrics.js"></script>
<script src="map.js"></script>
<script src="replay.js"></script>
</body>
</html>
