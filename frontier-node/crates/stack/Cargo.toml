[package]
name = "stack"
description = "Frontier local stack orchestrator: check-ports, up (Mode A), verify, tamper, load, report, down (M1 contract §8.7, §10.3, §12, §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "frontier_stack"
path = "src/lib.rs"

[[bin]]
name = "frontier-stack"
path = "src/main.rs"

# Devnet blocker B3 (G4): the operator's season setup against a public RPC.
[[bin]]
name = "frontier-operator"
path = "src/bin/frontier-operator.rs"

[dependencies]
fclient.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
keeper = { path = "../keeper" }
rusqlite.workspace = true
verify = { path = "../verify" }
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# The operator tool's end-to-end test serves an in-process frontier-localnet
# (in-workspace path crate, already in the lock).
localnet.workspace = true
# The playable-lane test reads the committed devnet .so fixture
# (frontier-node/fixtures/verify/devnet-playable-da3dc1aa.so.gz; DECISIONS J2's
# flate2, already a workspace dependency: no new crate).
flate2.workspace = true
# P4 (Q-W1) judges its wide claim segment with the verifier's playable-lane VWL check (tests only; the operator
# binary's own build is unchanged).
verify = { path = "../verify", features = ["playable-lane"] }

[features]
# Devnet blocker B3, owner decision B7: frontier-operator's playable-lane
# preset S1_DEVNET_WIDE_7D (program version 0x4804) and its WideSetRules step,
# which need the wide-land ABI tables (frontier-abi's opt-in world_index).
# Off by default, so no other build of this workspace changes.
playable-lane = ["frontier-abi/world-index-experimental"]

[[test]]
name = "operator_playable"
required-features = ["playable-lane"]
