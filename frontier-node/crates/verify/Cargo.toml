[package]
name = "verify"
description = "Frontier verifier v2: checks V1-V13 over a season's transactions and final account states, the report, the tamper classes T1-T22 and the recorded fixtures (M1 contract §8.5, W4-D)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "verify_core"

[[bin]]
name = "frontier-verify"
path = "src/main.rs"

# Checks of the checks (contract §8.5): each feature disables one check, so
# the tamper test of that check must then PASS (`mutate.sh` builds each in
# turn). V10 is the report and has no feature.
[features]
mutate-v1 = []
mutate-v2 = []
mutate-v3 = []
mutate-v4 = []
mutate-v5 = []
mutate-v6 = []
mutate-v7 = []
mutate-v8 = []
mutate-v9 = []
mutate-v11 = []
mutate-v12 = []
mutate-v13 = []
# 02-rights (candidate): the Grant check.
mutate-vr = []
# The wide world's event chains (VW1, workstream 04; experimental, opt-in).
wide-world-experimental = ["frontier-abi/world-index-experimental"]
# Experimental, opt-in, off by default: the independent state-transition
# replay of one wide S1 Harvest / Build / Train receipt (`wide_economy`,
# the wide event kinds 15 and 16) over caller-supplied snapshots. Enables
# the ABI's experimental `world_index` and nothing else: no dependency is
# added, no check of the default verifier changes, no season verdict is
# produced by it.
wide-economy-experimental = ["frontier-abi/world-index-experimental"]

# Dependency sections belong to the integrator (contract §3.4, I-55); every
# crate below is already a workspace dependency (W4-D notes, request R1).
[dependencies]
fclient.workspace = true
findex.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
# integ-W4 review (W4-D blocker): the program's recorded march season is
# committed gzip-compressed (DECISIONS J2's flate2; no new crate).
flate2.workspace = true
# integ-W4 review: getProgramAccounts' base64 data (a workspace dependency).
base64.workspace = true

[dev-dependencies]
keeper = { path = "../keeper" }
localnet.workspace = true
