[package]
name = "verify"
description = "Frontier verifier v2: checks V1-V13 over a season's transactions and final account states, the report, the tamper classes T1-T22 and the recorded fixtures (M1 contract §8.5, W4-D)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "verify_core"

[[bin]]
name = "frontier-verify"
path = "src/main.rs"

# Checks of the checks (contract §8.5): each feature disables one check, so
# the tamper test of that check must then PASS (`mutate.sh` builds each in
# turn). V10 is the report and has no feature.
[features]
mutate-v1 = []
mutate-v2 = []
mutate-v3 = []
mutate-v4 = []
mutate-v5 = []
mutate-v6 = []
mutate-v7 = []
mutate-v8 = []
mutate-v9 = []
mutate-v11 = []
mutate-v12 = []
mutate-v13 = []
# 02-rights (candidate): the Grant check.
mutate-vr = []
# Q16-1: the playable lane's land check (with `playable-lane`).
mutate-vl = []
# Q16-1 continued: the playable lane's wide land check (with `playable-lane`).
mutate-vwl = []
# Q16-1 = A (prize gate): the playable lane's re-execution check (with `playable-lane`).
mutate-vx = []
# The playable lane's genesis replay of an archive without post-states (with `playable-lane`).
mutate-vg = []
# ⑰ Q-P1 (b): the second-source cross-check (VS) trusts every witness blindly.
mutate-vs = []
# The wide world's event chains (VW1, workstream 04; experimental, opt-in).
wide-world-experimental = ["frontier-abi/world-index-experimental"]
# Experimental, opt-in, off by default: the independent state-transition
# replay of one wide S1 Harvest / Build / Train receipt (`wide_economy`,
# the wide event kinds 15 and 16) over caller-supplied snapshots. Enables
# the ABI's experimental `world_index` and nothing else: no dependency is
# added, no check of the default verifier changes, no season verdict is
# produced by it.
wide-economy-experimental = ["frontier-abi/world-index-experimental"]
# Q16-1 = A (2026-11-18): the PLAYABLE lane, program version 0x4804 (S1 |
# wide 0x4000 | dispatch revision 0x0800), as the devnet build
# `devnet-playable-sbf` (conquest-dispatch-experimental + land-preview until
# P14 b, 2026-11-22: since then expedition-dispatch-experimental +
# land-preview; the verifier keeps the conquest codecs to judge the recorded
# da3dc1aa seasons and the local land lane) runs it. With this feature 0x4804 is a known version: its ABI v2 instructions
# are judged by the S1 checks, the land preview's FoldLand / ClaimLandYield
# by VL, the wide land opening (WideSetRules / WideRequestRingSeed /
# WideConsumeRingSeed / WideOpenProvince), the wide claims (WideClaimSite
# wallet form / WideSettleTicket / WideFinalize), the season-end WideClose
# of a ticket record, a holding and a province, the wide economy and
# garrison (wallet forms), WideMuster (wallet form), WideResolve (the
# bell, with the wide keep capture) and player territory (WideClaimTile,
# WideTerritorySettle / Decay / Conquer, #209) by VWL, the expedition dispatch envelope (the expedition wrapper
# and the Free City conquest, kinds 0-18) by VX, re-executed by the pinned `.so` in LiteSVM
# (`--program-so`), with every legacy OpenProvince (D-verify-pr89-3), an archive
# WITHOUT post-states re-executed from genesis by VG (with the chain's balances,
# `--balances`), and every other wide instruction stays
# UNVERIFIABLE with its command named (V0 `WideUnmodelled`). Without it (the default build) 0x4804 stays
# `UnknownProgramVersion`. Opt-in so the land/conquest ABI features never
# unify into the keeper's or herald's default build.
playable-lane = [
    "wide-world-experimental",
    # VWL judges WideEconomy / WideGarrison with the independent replays of
    # `wide_economy` / `wide_garrison` (over the archive's states).
    "wide-economy-experimental",
    "frontier-abi/conquest-dispatch-experimental",
    "frontier-abi/land-preview",
    "permutation-rules/land-preview",
    # VWL re-runs WideOpenProvince's terrain (`terrain::wide`), as the
    # program's wide build does.
    "permutation-rules/wide-terrain-experimental",
    # VX re-executes the expedition wrapper and Free City conquest with the
    # pinned `.so` in LiteSVM (workspace crates the local node already uses).
    # The playable lane's wrapper message builders (unsigned drafts; the
    # recorder of `tests/playable_expedition.rs` and VX's diagnostics).
    "fclient/conquest-dispatch-experimental",
    "dep:litesvm",
    "dep:solana-account",
    "dep:solana-clock",
    "dep:solana-rent",
]

# Dependency sections belong to the integrator (contract §3.4, I-55); every
# crate below is already a workspace dependency (W4-D notes, request R1).
[dependencies]
fclient.workspace = true
findex.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
# verifier-v0v1: the legacy-shaped view of a v0 / v1 message (`src/vmsg.rs`);
# already in Cargo.lock through fclient, no new crate.
solana-message.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
# integ-W4 review (W4-D blocker): the program's recorded march season is
# committed gzip-compressed (DECISIONS J2's flate2; no new crate).
flate2.workspace = true
# integ-W4 review: getProgramAccounts' base64 data (a workspace dependency).
base64.workspace = true
# Q16-1 = A (prize gate), `playable-lane` only: VX's re-execution of the
# expedition wrapper by the pinned program (`src/reexec.rs`). Workspace
# dependencies already in Cargo.lock (the local node's); no new crate.
litesvm = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-clock = { workspace = true, optional = true }
solana-rent = { workspace = true, optional = true }

[dev-dependencies]
keeper = { path = "../keeper" }
localnet.workspace = true
# The ignored live VS tests' lying RPC proxy (`tests/playable_lane.rs`): the
# workspace's axum, already in Cargo.lock through localnet; no new crate.
axum.workspace = true
