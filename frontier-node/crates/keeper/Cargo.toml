[package]
name = "keeper"
description = "Frontier keeper: beacons, genesis, payer pools, escalation engine, journal, loopback API (W2-F); land, reveals, gathers, resolves and settlements from W3/W4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "keeper_core"

[[bin]]
name = "frontier-keeper"
path = "src/main.rs"

[[bin]]
name = "frontier-wide-claim-preview"
path = "src/bin/wide_claim_preview.rs"
required-features = ["wide-world-experimental"]

[[bin]]
name = "frontier-original-expedition-preview"
path = "src/bin/wide_expedition_preview.rs"
required-features = ["wide-world-experimental"]

[[bin]]
name = "frontier-experimental-expedition-prepare"
path = "src/bin/experimental_expedition_prepare.rs"
required-features = ["expedition-dispatch-experimental"]

[[bin]]
name = "frontier-experimental-expedition-depart-prepare"
path = "src/bin/experimental_expedition_depart_prepare.rs"
required-features = ["expedition-dispatch-experimental"]

[[bin]]
name = "frontier-experimental-conquest-prepare"
path = "src/bin/experimental_conquest_prepare.rs"
required-features = ["expedition-dispatch-experimental"]

[dependencies]
fclient.workspace = true
# devnet-readiness B2: the public-cluster feed reuses findex's RpcPoll
# (`clusterfeed`); an in-workspace path crate, no new external dependency.
findex.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
solana-hash.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
rusqlite.workspace = true
axum.workspace = true
tokio.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde_json.workspace = true

[features]
# Experimental, opt-in, read-only: the wide-world discovery model
# (`wideindex`) over `frontier_abi::world_index::event` PSW1 bodies. Off by
# default; this feature alone keeps the PSW1 feed guard and the closed debit
# gate exactly as before and adds no wide duty (`playable-lane` below does:
# P6/P7 duties and, gap P8, the guard's accounting of wide-land records).
wide-world-experimental = [
    "frontier-abi/world-index-experimental",
    "fclient/wide-records-experimental",
    "fclient/snapshot",
]
expedition-dispatch-experimental = ["wide-world-experimental", "fclient/expedition-dispatch-experimental"]
# Devnet runbook gaps P6 + P7 (the playable lane 0x4804, owner decision B7): the `rings` duty's wide rings
# (`wide_rings`: WideRequestRingSeed / WideConsumeRingSeed / WideOpenProvince) and the `wide-tickets` role
# (WideSettleTicket 0xDC, WideFinalize 0xDF). It only compiles the wide-land ABI tables in; both duties stay OFF
# unless keeper.toml turns them on, and a keeper built without it refuses those keys.
# Gap P8: with it the legacy feed guard ACCOUNTS FOR (counts, never applies) the PSW1 records of the wide land's own
# actions (kinds 1..=17, every named province wide and of the season's world) instead of latching; every other PSW1
# record still latches (`feedguard.rs` module doc). Without it every PSW1 record latches as before.
# Gaps P10 + P13 (devnet-expedition-keeper): the guard APPLIES the rim -> wide expedition's records exactly (PS2
# 146-149 with their PSW1 25/26 parts, PSFF, PSFT), and the `expeditions` role sends every step after the player's
# ExpeditionDepart (`expeditions.rs`, `expedition_steps.rs`); off unless keeper.toml names the role.
# Gap P14 option (a) (devnet-guard-conquest; r0ze chose (a)+(b), 2026-11-22): the guard also READS the Free City conquest records
# of the wrapper's kinds 12-18 exactly (PSW1 18-24, PS2 145, PSWC, PSWR; paired) instead of latching. Their receipts'
# reservation actions (RESERVE 8, RESERVATION_REFUND 9) exist only under frontier-abi's
# `conquest-dispatch-experimental`, which the devnet `.so` is built with (`devnet-playable-sbf`); with it the keeper's
# ABI reads the conquest table as the devnet program writes it (version 2, the reservations).
playable-lane = ["frontier-abi/world-index-experimental", "frontier-abi/conquest-dispatch-experimental"]
# The wrapped DeclareSiege (kind 12) of the conquest lane. Without it the conquest prepare CLI
# still reads and checks, and answers the closed blocker DispatchKindUnavailable.
conquest-dispatch-experimental = ["expedition-dispatch-experimental", "fclient/conquest-dispatch-experimental"]
# TEST-ONLY (2026-11-20, rights-play): the keeper tools of a `play-local.sh --coexist` world (depart / preview /
# resident prepare) pin the coexist Season (0x7805, RULESET_HASH_V4) through frontier-abi's `coexist-lane`. Off by default.
coexist-lane = ["frontier-abi/coexist-lane"]

[dev-dependencies]
localnet.workspace = true
# fix-keeper-care: the care-cadence tests run a 107-minute tick on tokio's
# paused test clock (`start_paused`); dev only, never the binary.
tokio = { workspace = true, features = ["test-util"] }
# integ-W4 review (W4-C): the play scenario plans its marches with the bots'
# kernel path planner (a workspace crate; no new external crate).
agents = { path = "../agents" }
# The wide archive/typed-index parity test (`tests/wide_duties.rs`) drives
# the real `WideFindex` over literal records; dev only, never the binary.
findex = { path = "../findex", features = ["wide-records-experimental"] }
solana-program-runtime.workspace = true
# P10 (`tests/expedition_feed_guard.rs`): reads the committed gzipped verifier recordings of the devnet `.so`
# (a workspace dependency already in the lock; dev only).
flate2.workspace = true
