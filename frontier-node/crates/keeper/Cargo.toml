[package]
name = "keeper"
description = "Frontier keeper: beacons, genesis, payer pools, escalation engine, journal, loopback API (W2-F); land, reveals, gathers, resolves and settlements from W3/W4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "keeper_core"

[[bin]]
name = "frontier-keeper"
path = "src/main.rs"

[[bin]]
name = "frontier-wide-claim-preview"
path = "src/bin/wide_claim_preview.rs"
required-features = ["wide-world-experimental"]

[dependencies]
fclient.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
solana-hash.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
rusqlite.workspace = true
axum.workspace = true
tokio.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde_json.workspace = true

[features]
# Experimental, opt-in, read-only: the wide-world discovery model
# (`wideindex`) over `frontier_abi::world_index::event` PSW1 bodies. Off by
# default; the default keeper keeps its PSW1 feed guard and its closed
# debit gate exactly as before, and gains no wide duty.
wide-world-experimental = [
    "frontier-abi/world-index-experimental",
    "fclient/wide-records-experimental",
]

[dev-dependencies]
localnet.workspace = true
# integ-W4 review (W4-C): the play scenario plans its marches with the bots'
# kernel path planner (a workspace crate; no new external crate).
agents = { path = "../agents" }
# The wide archive/typed-index parity test (`tests/wide_duties.rs`) drives
# the real `WideFindex` over literal records; dev only, never the binary.
findex = { path = "../findex", features = ["wide-records-experimental"] }
solana-program-runtime.workspace = true
