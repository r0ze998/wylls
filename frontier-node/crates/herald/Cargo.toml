[package]
name = "herald"
description = "Frontier herald: the fold (per-bell files, overview binaries, clash reports), the /h/* read path, WS fan-out, /frontier/* static and the /gw/* relay proxy (M1 contract §8.4, §9.2, §9.3); viewer load generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "herald_fold"

[[bin]]
name = "frontier-herald"
path = "src/main.rs"

[[bin]]
name = "frontier-viewers"
path = "src/bin/viewers.rs"

[dependencies]
fclient.workspace = true
findex.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
flate2.workspace = true

[features]
default = []
# Experimental, opt-in: the read-only recorded wide world (`src/wide.rs`,
# `/h/world/wide`) over frontier-abi's `world_index`. Off by default: the
# default build compiles none of it and answers `503 WideWorldUnavailable`
# on that path. No new dependency.
wide-world-experimental = ["frontier-abi/world-index-experimental"]
# Explicit read-only external index, independent of the legacy ingest path.
wide-index-read-experimental = ["wide-world-experimental", "findex/wide-records-experimental"]
# Opt-in: `--local-play-metadata FILE` seeds an empty fold with the temporary
# local-play chain's four synthetic first-world accounts (src/local_play.rs).
# Off by default; no new dependency.
local-play-bootstrap = []
# Typed experimental PS2 + paired wide observations, never the default reader.
expedition-records-experimental = ["findex/expedition-records-experimental"]
# Opt-in, TEST-ONLY: the land preview's land records (PSFLAND1) kept as
# captures and served inside the province envelope as `land`. Off by default:
# the default build drops them like any unknown account. No new dependency.
land-preview = ["frontier-abi/land-preview"]
# Opt-in, TEST-ONLY (② rights, the coexist lane): the Grants folded from
# their PS2 records (kinds 114-119) and served as `/h/grants`
# (src/grants.rs). Off by default: the default build folds and serves
# nothing new (`/h/grants` answers 503 GrantsUnavailable). No new dependency.
rights-records = []
# TEST-ONLY (2026-11-20, rights-play): the herald of a `play-local.sh --coexist` world: `--local-play-metadata`
# pins the coexist Season (0x7805, RULESET_HASH_V4) instead of the plain lane's. Off by default.
coexist-lane = ["frontier-abi/coexist-lane"]

[dev-dependencies]
# W3-D (request R4): `tests/real_chain.rs` drives the keeper over the
# in-process chain with the keeper tests' harness (included by path).
keeper = { path = "../keeper" }
localnet.workspace = true
solana-program-runtime.workspace = true
solana-instruction.workspace = true
# herald-v0v1-decode: the alarm test builds v0 / v1 messages (already a workspace dependency).
solana-message.workspace = true
# nation chat tests sign as players' wallets (already workspace dependencies).
solana-keypair.workspace = true
solana-signer.workspace = true
