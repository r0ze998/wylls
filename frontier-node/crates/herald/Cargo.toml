[package]
name = "herald"
description = "Frontier herald: the fold (per-bell files, overview binaries, clash reports), the /h/* read path, WS fan-out, /frontier/* static and the /gw/* relay proxy (M1 contract §8.4, §9.2, §9.3); viewer load generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "herald_fold"

[[bin]]
name = "frontier-herald"
path = "src/main.rs"

[[bin]]
name = "frontier-viewers"
path = "src/bin/viewers.rs"

[dependencies]
fclient.workspace = true
findex.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
solana-address.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
flate2.workspace = true

[features]
default = []
# Experimental, opt-in: the read-only recorded wide world (`src/wide.rs`,
# `/h/world/wide`) over frontier-abi's `world_index`. Off by default: the
# default build compiles none of it and answers `503 WideWorldUnavailable`
# on that path. No new dependency.
wide-world-experimental = ["frontier-abi/world-index-experimental"]
# Explicit read-only external index, independent of the legacy ingest path.
wide-index-read-experimental = ["wide-world-experimental", "findex/wide-records-experimental"]

[dev-dependencies]
# W3-D (request R4): `tests/real_chain.rs` drives the keeper over the
# in-process chain with the keeper tests' harness (included by path).
keeper = { path = "../keeper" }
localnet.workspace = true
solana-program-runtime.workspace = true
solana-instruction.workspace = true
