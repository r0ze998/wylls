[package]
name = "permutation-prize"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Wylls prize pool (test assets): entry fees into a vault, the winner tallied from the game's Province accounts, shares claimed against a published ledger"
license = "MIT"

# Its own workspace and lock (seeded from the root lock): the game program's
# workspace, lock and artefact are untouched by this crate.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Continuous-world settlement windows (InitEpochPool, EpochTally,
# EpochFinalize, Sweep; src/epoch.rs). Test assets, local and devnet only;
# OFF by default, so the default build has none of these instructions.
epochs = []
# World goals without a deadline (InitGoalPool … GoalWithdrawOps, tags
# 13–23; src/goals.rs; design record win-conditions §10.1). Test USDC,
# local and devnet only; OFF by default (marker PRZ_GOALS_TEST_USDC_BUILD).
goals = []

[dependencies]
solana-program = "=4.0.0"
frontier-abi = { path = "../frontier-abi" }
permutation-rules = { path = "../permutation-rules" }

[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
