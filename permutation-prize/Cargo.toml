[package]
name = "permutation-prize"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Wylls prize pool (test assets): entry fees into a vault, the winner tallied from the game's Province accounts, shares claimed against a published ledger"
license = "MIT"

# Its own workspace and lock (seeded from the root lock): the game program's
# workspace, lock and artefact are untouched by this crate.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# NFT pass entries and claims (tags 8–10, errors 0x113–0x11A; provisional
# numbers, NFT-PRIZE.md). The pass's current owner is read from the game
# program's resident policy, the Core asset and the resident program's record
# (workstream 20's `nft-experimental` accounts). Off by default: without it the
# tags are `BadData` (fail closed), and nothing else changes.
# NOT DEPLOYABLE (NFT-PRIZE.md §8.3): a pool that settles in refund mode holds
# the passes' fees with no exit until the refund rule is decided.
# scripts/build-prize.sh refuses an artefact built with it; never add it to
# `default`.
nft-experimental = []

[dependencies]
solana-program = "=4.0.0"
frontier-abi = { path = "../frontier-abi" }
permutation-rules = { path = "../permutation-rules" }

[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
