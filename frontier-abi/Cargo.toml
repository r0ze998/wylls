[package]
name = "frontier-abi"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Wylls M1 ABI: account layouts, instruction tags and data, errors, PS2 log records, budgets, presets, prologue tables and the entry codec (no Solana dependencies)"
license = "MIT"

[lib]
crate-type = ["rlib"]

# The vector writer (`cargo run -p frontier-abi --bin abi-vectors [-- --check]`)
# is a plain std binary over the no_std library.
[[bin]]
name = "abi-vectors"
path = "src/bin/abi-vectors.rs"

# Dependency section: owned by the integrator (M1 contract §3.4, I-55).
# frontier-abi depends only on permutation-rules (I-03).
[dependencies]
permutation-rules = { path = "../permutation-rules" }

[features]
default = []
# Experimental, opt-in reader and geometry foundation: `world_index` (wide i64
# province coordinates, world-scoped keys, versioned host references and
# a sparse paginated opened-province index). Off by default, so the
# program, the vectors and every hash are built exactly as before; it adds
# no dependency (I-03 holds).
world-index-experimental = []
# Host/localnet-only: the expedition dispatch wrapper's provisional conquest
# kinds 12–17 (`world_index::expedition_dispatch_ix`). Off by default, so the
# default decoder keeps refusing them; never a deployed allocation.
conquest-dispatch-experimental = ["world-index-experimental"]
# Workstream 09 (capacity lending), a preview: `capacity`, the instruction
# tags 0xF0-0xFD, their data, account lists and addresses. Off by default:
# no vector, hash or default-build change; no new dependency.
capacity-preview = []
# "Standing Ground" land, a preview: `land_preview`, the land record and its
# reading of a v2 Province. Off by default: no vector, hash or default-build
# change; no existing account written; no new dependency.
land-preview = ["permutation-rules/land-preview"]
# ⑳ NFT resident ID (owner decision 2026-11-18 18:26 JST: local and devnet
# only): `resident_terms::ACTIVE.transfer` becomes `Refused` (soulbound: only
# the first holder acts). Off by default (transfers allowed, option B).
resident-transfer-refused = []
# ②+⑨+⑩ in one LOCAL build (2026-11-20, ABI-ALLOCATION rev 8, provisional):
# `feature_registry`, the one table of tags, errors, record kinds, account
# kinds and version bits (`permutation-frontier` feature
# `coexist-experimental` reads its combined versions). Off by default: no
# vector, hash or default-build change; no new dependency.
feature-coexist = []
# TEST-ONLY, off-chain clients of a `play-local.sh --coexist` world (2026-11-20, rights-play): the local-play
# runner, herald and keeper tools pin the coexist Season (0x7805, RULESET_HASH_V4) instead of the plain lane's
# (0x4804, V3) through `world_index::expedition_dispatch_ix::{PROGRAM_VERSION, LANE_RULESET_HASH}`. No program build
# enables it (the program's coexist lane is `permutation-frontier` `localnet-coexist-sbf`); off by default.
coexist-lane = ["world-index-experimental"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
