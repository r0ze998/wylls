[package]
name = "wylls-custody-diff-bridge10"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Workstream 10: the same scenarios through workstream 9's bridge10 (pinned 992f4ba5, MockCustody and its own lots) and through workstream 10's adapter (one lot store), compared step by step"

# Own workspace. ../../../09-capacity/bridge10 is NOT in this branch:
# ../run.sh extracts it from 992f4ba5 into a temporary tree (checking its
# tree hash) and builds this crate there.
[workspace]

[dependencies]
wylls-capacity = { path = "../../../09-capacity/kernel" }
wylls-capacity-bridge10 = { path = "../../../09-capacity/bridge10" }
wylls-custody = { path = "../../custody", default-features = false }
wylls-custody-adapter-09 = { path = ".." }
permutation-rules = { path = "../../../../permutation-rules", features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
