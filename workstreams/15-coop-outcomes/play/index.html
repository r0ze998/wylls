<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>協力の勝ち方比較</title>
<style>
  :root { --bg: #f7f6f2; --fg: #1f1f1c; --muted: #6b6a63; --card: #fff; --line: #dedbd2; --accent: #2f6f5e; --warn: #9a5b13; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1a18; --fg: #ecebe6; --muted: #a3a29b; --card: #24241f; --line: #3a3a33; --accent: #7cc4ad; --warn: #e0a45a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0; }
  .note { color: var(--muted); font-size: 13px; }
  .note strong { color: var(--warn); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  label { display: flex; gap: 6px; align-items: center; min-width: 0; max-width: 100%; }
  select { min-width: 0; max-width: 100%; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  #start { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .choices button { text-align: left; }
  .choices button small { color: var(--muted); }
  .choices button:disabled { opacity: .45; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h3 { font-size: 15px; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .reasons { padding-left: 18px; font-size: 13px; }
  code { font-size: 12px; }
  .log { color: var(--muted); }
  .hash { color: var(--muted); font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>協力の勝ち方を比べる（試作）</h1>
  <p class="note">同じ出来事を、A（今のコードの勝ち方。旧経路の互換確認）・B（共同・国・個人を別々に判定）・C（比較案：共同達成で評価期間だけを閉じる）で判定します。どの案でも世界は終わりません。賞金の扱いは未決で、ここでは決めません。数字はすべて仮の置き値です。<strong>人間による理解しやすさ・面白さの確認はしていません（未評価）。</strong></p>
  <p class="controls">
    <label>話 <select id="story"></select></label>
    <label>あなた <select id="actor">
      <option value="n4-0">n4-0（小さい国）</option>
      <option value="n5-0">n5-0（一人の国）</option>
      <option value="n2-2">n2-2（協力しない人）</option>
      <option value="n0-2">n0-2（大きい国）</option>
    </select></label>
    <button id="start" type="button">始める</button>
  </p>
</header>
<main id="main"></main>
<script type="module" src="./play.mjs"></script>
</body>
</html>
