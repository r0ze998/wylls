[package]
name = "wylls-courier-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Workstream 03: local LiteSVM tests of the external courier program calling the Frontier program's SendCaravan by CPI (release-equivalent SBF builds of both programs)"

# Own workspace; its lock is a copy of permutation-frontier/svm-tests's, so
# the pinned LiteSVM and Solana crates are the harness's and its target
# directory can be shared (CARGO_TARGET_DIR, run.sh).
[workspace]

[dependencies]
permutation-frontier-svm-tests = { path = "../../../permutation-frontier/svm-tests" }
litesvm = "=0.16.0"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2", "decode"] }
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
frontier-abi = { path = "../../../frontier-abi" }
fclient = { path = "../../../frontier-node/crates/fclient" }
permutation-rules = { path = "../../../permutation-rules", features = ["std"] }
solana-message = "=4.4.1"
# The validator drill (tests/validator_drill.rs) only.
solana-hash = "=4.5.0"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode", "verify"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
bincode = "=1.3.3"

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
