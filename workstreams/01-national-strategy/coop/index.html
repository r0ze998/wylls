<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国をまたぐ依頼</title>
<style>
  :root { --bg: #f6f3ea; --ink: #1f2a24; --mute: #5f6b63; --line: #d6d0c0; --card: #fffdf7; --ok: #2f6b3f; --warn: #8a5a00; --bad: #9b2c2c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header, main { max-width: 980px; margin: 0 auto; padding: 12px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .note { color: var(--mute); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 12px 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; border: 1px solid var(--line); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #8b8470; background: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 3px 6px; max-width: 100%; }
  input[type=number] { width: 6.5em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .req { border-top: 1px solid var(--line); padding: 8px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  #msg { min-height: 1.5em; }
  code { font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>国をまたぐ依頼</h1>
  <span id="season" class="note"></span>
  <span class="row">
    <select id="wallet" aria-label="ウォレット"></select><button id="connect">このウォレットで署名する</button>
    <span id="who" class="note">署名する人：未接続</span>
  </span>
  <label class="row">自分の国（申告。判定には使わない）
    <select id="nation"><option value="0">国1</option><option value="1">国2</option><option value="2">国3</option><option value="3">国4</option><option value="4">国5</option><option value="5">国6</option></select>
  </label>
</header>
<main>
  <p class="note" id="rules">
    依頼に「応じる」は、送るつもりがあるという表明だけです。物は動かず、送る義務もありません。物が動くのは、送る人がゲームの村の引き出し「交易と防備」から自分のウォレットで署名して出した隊商だけです。
    物々交換・加工の貸出・届いたら払う、はありません（贈り物です。届いた物は受け取った人の物になります）。数えるのは、確定の記録で確かめた到着だけです。
  </p>
  <div id="msg" role="status"></div>

  <div class="grid">
    <section id="joint"><h2>共同の目的</h2><div class="body"></div></section>
    <section id="nationPanel"><h2>国の記録</h2><div class="body"></div></section>
    <section id="personal"><h2>自分</h2><div class="body"></div></section>
  </div>

  <section id="newRequest">
    <h2>依頼を出す</h2>
    <div class="row">目的：<b id="goalTitle"></b></div>
    <div class="row">
      <label>木材 <input id="needWood" type="number" min="0" max="100000" value="200"></label>
      <label>石材 <input id="needStone" type="number" min="0" max="100000" value="200"></label>
      <label>期限（時間） <input id="hours" type="number" min="1" max="720" value="24"></label>
    </div>
    <div class="row">届け先（自分の村）：
      <label>P <input id="toP" type="number" value="0"></label>
      <label>Q <input id="toQ" type="number" value="0"></label>
      <label>村の番号 <input id="toSite" type="number" min="0" max="63" value="0"></label>
      <label>世代 <input id="toGen" type="number" min="0" value="0"></label>
    </div>
    <div class="row"><button id="send">依頼を出す（署名）</button> <button id="leave">この目的から抜ける（署名）</button></div>
  </section>

  <section id="requests" style="margin-top:12px"><h2>依頼の一覧</h2><div class="body"></div></section>

  <section id="arrivals" style="margin-top:12px">
    <h2>隊商と到着（④の確定の記録）</h2>
    <div class="row">判定（仮）：<select id="judge"></select></div>
    <ul class="note" id="judgeMeans"></ul>
    <div class="body"></div>
  </section>
</main>
<script type="module" src="./coop-ui.mjs"></script>
</body>
</html>
