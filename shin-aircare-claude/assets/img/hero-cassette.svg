<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t d">
  <title id="t">天井埋込カセット形エアコンのイメージ図</title>
  <desc id="d">天井を見上げた視点で描いた、4方向吹出しの天井埋込形室内機の線画風イラスト。実際の施工写真ではありません。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f45"/>
      <stop offset="0.55" stop-color="#2a2e33"/>
      <stop offset="1" stop-color="#1f2226"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5158"/>
      <stop offset="0.5" stop-color="#363b41"/>
      <stop offset="1" stop-color="#24282c"/>
    </linearGradient>
    <linearGradient id="flapV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b5158"/>
      <stop offset="0.5" stop-color="#363b41"/>
      <stop offset="1" stop-color="#24282c"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e22"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd0e2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fd0e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0e2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fd0e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fd0e2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="airH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd0e2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fd0e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fd0e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tiles" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0v128" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 天井の目地 -->
  <rect width="640" height="640" fill="url(#tiles)"/>

  <!-- 空気のにじみ -->
  <circle cx="320" cy="320" r="300" fill="url(#glow)" filter="url(#soft)"/>

  <!-- 吹き出しの気流（4方向） -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M250 112 C250 70, 240 48, 228 24" stroke="url(#air)"/>
    <path d="M320 104 C320 66, 320 44, 320 16" stroke="url(#air)"/>
    <path d="M390 112 C390 70, 400 48, 412 24" stroke="url(#air)"/>
    <path d="M250 528 C250 570, 240 592, 228 616" stroke="url(#air)"/>
    <path d="M320 536 C320 574, 320 596, 320 624" stroke="url(#air)"/>
    <path d="M390 528 C390 570, 400 592, 412 616" stroke="url(#air)"/>
    <path d="M112 250 C70 250, 48 240, 24 228" stroke="url(#airH)"/>
    <path d="M104 320 C66 320, 44 320, 16 320" stroke="url(#airH)"/>
    <path d="M112 390 C70 390, 48 400, 24 412" stroke="url(#airH)"/>
    <path d="M528 250 C570 250, 592 240, 616 228" stroke="url(#airH)"/>
    <path d="M536 320 C574 320, 596 320, 624 320" stroke="url(#airH)"/>
    <path d="M528 390 C570 390, 592 400, 616 412" stroke="url(#airH)"/>
  </g>

  <!-- 化粧パネル -->
  <g filter="url(#shadow)">
    <rect x="112" y="112" width="416" height="416" rx="22" fill="url(#panel)"/>
  </g>
  <rect x="112.5" y="112.5" width="415" height="415" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="128" y="128" width="384" height="384" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- コーナーの化粧カバー -->
  <g fill="#2d3136" stroke="#ffffff" stroke-opacity="0.1">
    <rect x="128" y="128" width="56" height="56" rx="8"/>
    <rect x="456" y="128" width="56" height="56" rx="8"/>
    <rect x="128" y="456" width="56" height="56" rx="8"/>
    <rect x="456" y="456" width="56" height="56" rx="8"/>
  </g>
  <g fill="#1a1d20">
    <circle cx="156" cy="156" r="3"/>
    <circle cx="484" cy="156" r="3"/>
    <circle cx="156" cy="484" r="3"/>
    <circle cx="484" cy="484" r="3"/>
  </g>

  <!-- 4方向のフラップ -->
  <g>
    <rect x="196" y="136" width="248" height="40" rx="10" fill="url(#flap)"/>
    <rect x="196" y="464" width="248" height="40" rx="10" fill="url(#flap)"/>
    <rect x="136" y="196" width="40" height="248" rx="10" fill="url(#flapV)"/>
    <rect x="464" y="196" width="40" height="248" rx="10" fill="url(#flapV)"/>
    <!-- フラップのハイライト -->
    <path d="M206 142 H434" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M206 470 H434" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M142 206 V434" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M470 206 V434" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
    <!-- フラップの奥の暗がり -->
    <rect x="196" y="176" width="248" height="6" fill="#0f1114" opacity="0.8"/>
    <rect x="196" y="458" width="248" height="6" fill="#0f1114" opacity="0.8"/>
    <rect x="176" y="196" width="6" height="248" fill="#0f1114" opacity="0.8"/>
    <rect x="458" y="196" width="6" height="248" fill="#0f1114" opacity="0.8"/>
  </g>

  <!-- 中央の吸込グリル -->
  <rect x="196" y="196" width="248" height="248" rx="10" fill="url(#grille)"/>
  <rect x="196.5" y="196.5" width="247" height="247" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2">
    <path d="M212 220 H428"/>
    <path d="M212 240 H428"/>
    <path d="M212 260 H428"/>
    <path d="M212 280 H428"/>
    <path d="M212 300 H428"/>
    <path d="M212 320 H428"/>
    <path d="M212 340 H428"/>
    <path d="M212 360 H428"/>
    <path d="M212 380 H428"/>
    <path d="M212 400 H428"/>
    <path d="M212 420 H428"/>
  </g>
  <!-- グリルの桟 -->
  <g stroke="#2b2f34" stroke-width="3">
    <path d="M260 204 V436"/>
    <path d="M320 204 V436"/>
    <path d="M380 204 V436"/>
  </g>
  <!-- 中央の小さな表示部 -->
  <rect x="300" y="448" width="40" height="8" rx="4" fill="#0f1114"/>
  <circle cx="312" cy="452" r="1.6" fill="#8fd0e2"/>
</svg>
