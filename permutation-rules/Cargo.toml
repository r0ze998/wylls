[package]
name = "permutation-rules"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Deterministic rules engine for Wylls (Rules Specification v0.2, Game Design V5)"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# Pinned to match permutation-state-solana-receipt-spike so the crate can be
# linked into the ER program without a second borsh version.
borsh = { version = "=1.6.1", default-features = false, features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false }

[features]
default = []
std = ["borsh/std", "sha2/std"]
# Compute-unit probes on Solana (measurement builds only; see `probe`).
cu-trace = []
# Experimental, opt-in wide terrain kernel (`frontier::terrain::wide`): the
# legacy shaping rules over i64 province coordinates, byte-identical inside
# ring 128, a versioned candidate noise path past it. Off by default: no
# default-build code, vector, hash input or budget changes; no new dependency.
wide-terrain-experimental = []
# Workstream 09 (capacity lending), a preview: `frontier::capacity`, the
# pool and job accounts and their operations. Off by default: no default
# build code, vector, hash input or budget changes.
capacity-preview = []
# "Standing Ground" land, a preview: `frontier::land`, land a nation holds
# tile by tile, grown where its hosts stand and taken where a hostile host
# stands. Off by default: no default-build code, vector, hash input or
# budget changes; no new dependency.
land-preview = []
# Player territory (owner Q-2, 2026-11-24), a preview: `frontier::territory`,
# the pure seams (upkeep curve, claim cost, reach sources, unpaid upkeep,
# decay order) with every open owner question as a parameter. Off by
# default: no default-build code, vector, hash input or budget changes.
territory-preview = []
# ⑪(b) declarative extension effects, the first LOCAL slice (2026-11-28,
# docs/design/extensions/item11b-plan.md): `frontier::effects`, a closed op
# vocabulary (Require/Set/Add + the core effects Lock/Release) interpreted
# over the caller's own Holding, and the verifier-side replay. Off by
# default: no default-build code, vector, hash input or budget changes; no
# program links it (owner Q-11B-1 = A: world 4, Lock/Release only; any
# program build or deploy still needs r0ze's OK).
declarative-effects = []

# On Solana, hash with the runtime's sol_sha256 syscall (bit-identical, far
# cheaper in compute units than hashing in SBF code).
[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = "=4.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[[example]]
name = "territory_calibrate"
required-features = ["std", "territory-preview"]
