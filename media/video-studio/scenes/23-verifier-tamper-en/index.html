    flash.render(t, 15.6, 0.35, 0.25);

    // ---------------- S4 grid
    hd.h4.render(t, 21.2, 29.2); gNote.render(t, 21.9, 29.2); hd.n4.render(t, 23.5, 29.2);
    X.show(gCount, t, 21.4, 29.3, { dy: -20 });
    let caught = 0;
    const gA = WY.env(t, 21.2, 29.4, 0.3, 0.4);
    grid.style.display = gA > 0 ? '' : 'none';
    cells.forEach((cl, i) => {
      const col = i % 6, row = Math.floor(i / 6);
      const a = 21.4 + (col + row) * 0.07;
      const k = WY.seg(t, a, a + 0.6, E.outCubic);
      const td = 23.4 + i * 0.12; const det = t > td;
      if (det) caught++;
      const kd = WY.seg(t, td, td + 0.25);
      cl.c.style.opacity = k * WY.env(t, 0, 29.4, 0.01, 0.45);
      cl.c.style.transform = `translateY(${(1 - k) * 30}px) scale(${1 + 0.06 * Math.sin(kd * Math.PI)})`;
      cl.c.style.borderColor = det ? 'rgba(255,90,100,.85)' : 'rgba(201,162,74,.45)';
      cl.c.style.background = det ? 'linear-gradient(180deg, rgba(70,20,26,.95), rgba(40,14,18,.95))' : 'rgba(16,36,29,.92)';
      cl.st.style.opacity = kd; cl.co.style.opacity = 0.35 + 0.65 * kd;
    });
    WY.$('#gc').textContent = caught;
    WY.$('#gc').style.color = caught === 30 ? '#ff8a8f' : '#fffaf0';

    // ---------------- S5 bars
    hd.h5.render(t, 29.7, 36.8); hd.n5.render(t, 30.4, 36.8);
    bars.forEach((b, i) => {
      const a = 30.0 + i * 0.55;
      const k = X.show(b.r, t, a, 37.0, { dy: 20, fi: 0.5 });
      if (k <= 0) return;
      const kf = WY.seg(t, a + 0.3, a + 2.0, E.outQuart);
      const w = 1000 * (b.v / 272004) * kf;
      b.fill.style.width = w + 'px';
      b.num.style.left = 500 + w + 22 + 'px';
      b.val.textContent = X.num(Math.round(b.v * kf));
      b.pass.style.opacity = WY.seg(t, a + 2.0, a + 2.3);
    });

    // ---------------- S6 honesty
    honL.render(t, 37.2, 40.4);
    X.show(hon, t, 38.0, 40.6, { dy: 20 });

    badge.render(t, 5.6, 40.8);
    ov.render(t);
    end.render(t - 41);
  },

  audio(A) {
    A.music({ style: 'tech', bpm: 112, key: 'E', minor: true, sections: [[0, 0.3], [5, 0.6], [13, 0.4], [16.3, 0.5], [21.2, 0.9], [29.6, 0.75], [37, 0.3]], end: 41, outro: 'hit' });
    A.whoosh(0.3, { dur: 1.2 }); A.hit(0.6, { gain: 0.6 });
    A.whoosh(4.9); A.type(5.6, 6.9, { cps: 24, gain: 0.4 });
    for (let i = 0; i < 13; i++) A.tick(7.0 + i * 0.22, { pitch: 1.2 + i * 0.03, gain: 0.7 });
    A.ok(10.7); A.hit(10.75, { gain: 0.5, bright: 0.8 });
    A.whoosh(12.8); A.drone(13, 16.3, { note: 'E2', gain: 0.8 });
    A.glitch(14.2, { dur: 0.6 }); A.bad(15.6); A.hit(16.35, { gain: 0.9 }); A.clash(16.35, { gain: 0.5 });
    A.whoosh(20.9);
    for (let i = 0; i < 30; i++) A.tick(23.4 + i * 0.12, { pitch: 0.9 + (i % 6) * 0.05, gain: 0.55 });
    A.hit(26.9, { gain: 0.7 });
    A.whoosh(29.4);
    for (let i = 0; i < 4; i++) { A.riser(30.3 + i * 0.55, 32.0 + i * 0.55, { gain: 0.15 }); A.ok(32.3 + i * 0.55, { gain: 0.5 }); }
    A.whoosh(36.9); A.swell(37.0, 40.5, { note: 'E3', gain: 0.6 });
    A.chime(41.2, { note: 'B5', gain: 0.6 });
  },
});
