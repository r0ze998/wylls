<!doctype html><html><head><meta charset="utf-8"><title>16 AI citizens</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="aik.js"></script>
<style>
.tile { width:760px; padding:24px 32px; border-radius:20px; background:linear-gradient(180deg, rgba(27,58,47,.97), rgba(16,36,29,.98)); border:2px solid rgba(201,162,74,.8); box-shadow:0 20px 50px rgba(0,0,0,.45); color:#fffaf0; }
.tile .k { font:700 22px var(--mono); letter-spacing:.2em; color:#c9a24a; }
.tile .h { font:700 44px/1.2 'Cormorant Garamond', serif; margin-top:6px; }
.tile .s { font:500 26px/1.4 var(--sans); color:rgba(255,250,240,.75); margin-top:6px; }
.steps { display:flex; flex-direction:column; gap:26px; }
.st { display:flex; gap:22px; align-items:flex-start; opacity:.28; }
.st .n { flex:none; width:70px; height:70px; border-radius:50%; display:grid; place-items:center; font:700 40px Cinzel, serif; color:#0b1512; background:#c9a24a; }
.st.model .n { background:#9fd8c9; }
.st .h { font:700 46px/1.15 'Cormorant Garamond', serif; color:#fffaf0; }
.st .s { font:500 25px/1.4 var(--sans); color:rgba(255,250,240,.75); margin-top:6px; width:520px; }
.cc.en { font-family: var(--sans); font-size:22px; }
.cc.en .cand { font-size:21px; padding:6px 12px; overflow:hidden; }
.cc.en .cand-id { font-size:18px; min-width:34px; }
.cc.en .words, .cc.en .remembered { font-size:24px; }
.cited-note { width:620px; padding:16px 22px; border-radius:16px; background:rgba(122,74,156,.25); border:2px solid rgba(190,150,220,.7); font:600 27px/1.4 var(--sans); color:#f1e6fa; }
.lims { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; width:1600px; }
.lim2 { padding:18px 28px; border-radius:18px; background:linear-gradient(180deg, rgba(27,58,47,.97), rgba(16,36,29,.98)); border:2px solid rgba(201,162,74,.8); color:#fffaf0; font:600 30px var(--sans); white-space:nowrap; }
.lim2 b { font:800 44px var(--sans); color:#f0d48a; margin-right:10px; }
.pend { display:flex; align-items:center; gap:20px; padding:18px 30px; border-radius:16px; font:600 36px var(--sans); background:rgba(10,24,19,.85); border:1.5px solid rgba(255,250,240,.25); color:#fffaf0; white-space:nowrap; }
.pend .k { min-width:160px; text-align:center; padding:4px 14px; border-radius:10px; font:800 24px var(--sans); letter-spacing:.06em; }
.pend .ok { background:#2e5b6e; color:#e3f6ff; }
.pend .no { background:#5a3a6b; color:#f5e3ff; }
.keys { display:flex; gap:40px; align-items:stretch; }
.kp { width:560px; padding:28px 34px; border-radius:22px; }
.kp .k { font:700 22px var(--mono); letter-spacing:.2em; }
.kp .h { font:700 50px/1.1 'Cormorant Garamond', serif; margin-top:6px; }
.kp .s { font:500 27px/1.45 var(--sans); margin-top:10px; }
.kp-m { background:linear-gradient(180deg,#14302a,#0b1c18); border:2px solid rgba(159,216,201,.6); color:#e6f6f1; }
.kp-m .k { color:#9fd8c9; }
.kp-b { background:linear-gradient(180deg,#2c2414,#1a140a); border:2px solid rgba(240,212,138,.7); color:#fff3d6; }
.kp-b .k { color:#f0d48a; }
.ap { width:1200px; padding:30px 40px; border-radius:22px; border:2px dashed rgba(235,230,212,.7); background:rgba(235,230,212,.08); color:#fffaf0; font:600 38px/1.5 var(--sans); }
.ap b { color:#ffb3a8; }
</style>
</head><body><script>
const W = 1920, H = 1080;
const { seg, env, ease: E, clamp, lerp } = WY;
let bg, ov, dust, cv, g, T = {}, N = {}, badgeL, badgeP, end, flash;

// a real, verbatim decision from the local slice-4 run (permutation-gateway/test/fixtures/ai-ac9-slice4)
const CANDS = [
  ['c1', 'Routine: economy and duties only, no march'],
  ['c2', 'Hold: duties only, keep the armies home'],
  ['c3', 'March H1 (200 troops) to a barbarian camp, 6 hexes away; earliest arrival at bell 43'],
  ['c4', 'March H1 (200 troops) to a barbarian camp, 6 hexes away; earliest arrival at bell 43'],
  ['c5', 'Build a wood producer (copy 2)'],
  ['c6', 'Build a stone producer (copy 1)'],
  ['c7', 'Train spearman troops into the reserve'],
  ['c8', 'Send scout H3 to explore the tiles next to it'],
];
const CHOSEN = ['c3', 'c7'];
const cardHTML = `<div class="cc en"><div class="cc-panel" style="width:1040px;padding:18px 22px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(201,162,74,.55)">
  <div class="dec-head"><span class="actor">Noe Iby</span><span class="badge-ai">AI</span><span class="chip chip-model">by: model</span><span class="chip chip-released">released</span><span class="bellmark">bell 40 · session · goal G2</span></div>
  <div class="sub" style="margin-top:10px">Candidates it was offered (made by code)</div>
  <div class="cands">${CANDS.map(([id, l]) => `<div class="cand" data-id="${id}"><span class="cand-id">${id}</span><span>${l}</span></div>`).join('')}</div>
  <div class="sub" id="w-lab">AI's words (model-written, not verified)</div>
  <div class="words" id="w-txt">I am starting my first march to clear a camp and fulfill my daily movement goal, while also training troops to maintain my combat strength.</div>
  <div class="sub" id="m-lab">Remembered (cited by the model):</div>
  <ul class="remembered" id="m-txt" style="margin:4px 0 0;padding-left:14px"><li>At bell 18 your sawmill was finished. <span class="bellmark">bell 18</span></li><li>At bell 27 your farm was finished. <span class="bellmark">bell 27</span></li></ul>
</div></div>`;

WY.scene({
  width: W, height: H, duration: 50, fps: 60,
  setup(stage) {
    AIK.css();
    bg = AIK.bg(stage, { tint: '20,38,34' });
    cv = WY.canvas(stage, W, H); cv.style.zIndex = 5; g = cv.getContext('2d');
    const serif = "'Cormorant Garamond', serif";

    // A
    T.a1 = AIK.text(stage, 'How does a game behave\nwhen [[AI has a will]]?', { x: 0, y: 330, w: W, size: 112, font: serif, weight: 700, lh: 1.15, ls: '0' });
    T.a2 = AIK.text(stage, 'We don’t claim the model wants anything.\nWe make its choices visible — from the outside.', { x: 0, y: 650, w: W, size: 38, font: 'var(--sans)', weight: 500, lh: 1.5, ls: '0', color: 'rgba(255,250,240,.8)', stagger: 0.008, rise: 18, blur: 5 });

    // B
    T.b1 = AIK.text(stage, 'Meet an\n[[AI citizen]].', { x: 120, y: 330, size: 120, font: serif, weight: 700, align: 'left', lh: 1.05, ls: '0' });
    T.b2 = AIK.text(stage, 'It plays with the same keys, fog\nand rate limits as people —\nplus safety limits.', { x: 124, y: 640, size: 34, font: 'var(--sans)', weight: 500, align: 'left', lh: 1.5, ls: '0', color: 'rgba(255,250,240,.8)', stagger: 0.008, rise: 18, blur: 5 });
    const tiles = [['MODEL', 'Local Gemma 4 26B A4B', 'llama.cpp · thinking off · temperature 0 · no paid API'], ['PERSONA', 'One of six, with a creed', '“My nation’s spears answer first; I lead the march others hesitate to make.”'], ['GOALS', 'Four lasting goals', 'e.g. “March at least once a day.”'], ['MEMORY', 'Lines the code writes', 'short episodes from public records — the model never writes them']];
    N.tiles = tiles.map(([k, h, s], i) => AIK.box(stage, `<div class="tile"><div class="k">${k}</div><div class="h">${h}</div><div class="s">${s}</div></div>`, { x: 1040, y: 100 + i * 236, z: 12 }));

    // C
    T.c0 = AIK.text(stage, 'Every decision,\n[[three steps]].', { x: 100, y: 120, size: 64, lh: 1.1, font: serif, weight: 700, align: 'left', ls: '0' });
    N.steps = AIK.box(stage, `<div class="steps">
      <div class="st" id="s1"><div class="n">1</div><div><div class="h">The code offers</div><div class="s">At most 12 legal options, in a fixed order.</div></div></div>
      <div class="st model" id="s2"><div class="n">2</div><div><div class="h">The model chooses</div><div class="s">It picks, writes a one-line reason and may cite memory lines.</div></div></div>
      <div class="st" id="s3"><div class="n">3</div><div><div class="h">The code checks</div><div class="s">Schema, caps, a fresh re-check — then the program itself refuses anything illegal.</div></div></div></div>`, { x: 100, y: 330, z: 12 });
    N.card = AIK.box(stage, cardHTML, { x: 790, y: 150, z: 12 });
    N.real = AIK.box(stage, '<div style="font:600 22px var(--sans);color:#9fe0d2;letter-spacing:.04em">REAL RECORD · local run slice-4 (2026-10-04) · verbatim</div>', { x: 792, y: 112, z: 12 });
    N.cited = AIK.box(stage, '<div class="cited-note">It cited two build records — and chose a march.<br><b>A citation is not a cause.</b></div>', { x: 100, y: 840, z: 13 });

    // D
    T.d1 = AIK.text(stage, 'Late or invalid? The [[autopilot]] plays.', { x: 0, y: 150, w: W, size: 72, font: serif, weight: 700, ls: '0' });
    N.ap = AIK.box(stage, '<div class="ap">It runs the economy and routine duties, and follows council Strike Orders.<br><b>It never starts a march of its own.</b> So every voluntary AI march is the model’s choice — or a council’s order.</div>', { x: 360, y: 300, z: 12 });
    N.share = AIK.box(stage, '<div style="font:500 28px/1.5 var(--sans);color:rgba(255,250,240,.72);text-align:center">In the 6-AI smoke run smoke-b3, at most 29.8% of AI actions were model-chosen; 64.3% were autopilot economy.</div>', { x: 0, y: 620, w: W, z: 12 });
    T.d2 = AIK.text(stage, 'The model [[never sees keys]].', { x: 0, y: 150, w: W, size: 80, font: serif, weight: 700, ls: '0' });
    N.keys = AIK.box(stage, `<div class="keys"><div class="kp kp-m"><div class="k">MIND</div><div class="h">Talks to the model</div><div class="s">Keyless. It cannot read keys, seeds or sealed plaintext.</div></div>
      <div class="kp kp-b"><div class="k">BRAIN</div><div class="h">Signs and sends</div><div class="s">Inside the bot process. Re-checks the board, then signs.</div></div></div>`, { x: 380, y: 340, z: 12 });
    N.keyNote = AIK.box(stage, '<div style="font:500 28px var(--sans);color:rgba(255,250,240,.72);text-align:center">That is structure, not secrecy: the local test keys derive from a public seed.</div>', { x: 0, y: 760, w: W, z: 12 });

    // E
    T.e1 = AIK.text(stage, 'Same rules — [[plus safety limits]].', { x: 0, y: 170, w: W, size: 76, font: serif, weight: 700, ls: '0' });
    N.lims = AIK.box(stage, `<div class="lims"><span class="lim2"><b>≤ 12</b>options</span><span class="lim2"><b>≤ 60%</b>of home troops per decision & day</span><span class="lim2"><b>≥ 40%</b>kept home</span><span class="lim2"><b>≤ 4</b>model-chosen marches a day</span><span class="lim2"><b>3</b>messages a turn, 40 a day</span></div>`, { x: 160, y: 380, z: 12 });

    // F
    T.f1 = AIK.text(stage, 'Running locally. [[Still to prove]]:', { x: 0, y: 160, w: W, size: 76, font: serif, weight: 700, ls: '0' });
    const P = [['ok', 'PASSED', 'take-1: an AI citizen’s own march, verify-minds'], ['no', 'PENDING', 'The formal A/B comparison'], ['no', 'PENDING', 'A completed 18-AI main run (one was aborted)'], ['no', 'NOT YET', 'A world with people and AI citizens together']];
    N.pend = P.map(([c, k, s], i) => AIK.box(stage, `<div class="pend"><span class="k ${c}">${k}</span>${s}</div>`, { x: 400, y: 340 + i * 112, z: 12 }));

    badgeL = AIK.status(stage, 'local', 'Ran on a local test chain', { x: 80, y: 60, lang: 'en' });
    badgeP = AIK.status(stage, 'planned', 'Formal evaluation pending', { x: 410, y: 60, lang: 'en' });
    badgeL.node.style.zIndex = badgeP.node.style.zIndex = 30;
    flash = WYKit.flash(stage, { color: '#fff5dc' });
    dust = WYKit.dust(stage, { count: 40, color: '255,230,180', z: 8, speed: 10 });
    ov = AIK.overlay(stage);
    end = WYKit.endCard(stage, { lang: 'en', line: 'Play the agent economy.', sub: 'A strategy game where people and AI citizens can fight for one map' });

    N.rows = [...N.card.querySelectorAll('.cand')];
    N.sEls = ['#s1', '#s2', '#s3'].map(s => N.steps.querySelector(s));
    N.wl = ['#w-lab', '#w-txt'].map(s => N.card.querySelector(s));
    N.ml = ['#m-lab', '#m-txt'].map(s => N.card.querySelector(s));
  },

  render(t) {
    bg.render(t, { glow: 0.55 });
    ov.render(t); dust.render(t, 0.45);
    AIK.clear(g, t);

    // A 0–6
    T.a1.render(t - 0.4, 5.0); T.a1.node.style.transform = `scale(${1 + 0.03 * seg(t, 0, 6)})`;
    T.a2.render(t - 2.4, 3.0);

    // B 6–13
    T.b1.render(t - 6.1, 6.4);
    T.b2.render(t - 7.0, 5.6);
    N.tiles.forEach((n, i) => AIK.show(n, t, 6.5 + i * 0.35, 12.6, { y: 40 }));

    // C 13–29
    T.c0.render(t - 13.1, 15.4);
    AIK.show(N.steps, t, 13.4, 28.6);
    AIK.show(N.card, t, 13.8, 28.6, { y: 50 });
    AIK.show(N.real, t, 14.2, 28.6, { y: 10 });
    const act = [[13.6, 17.4], [17.4, 25.0], [25.0, 28.6]];
    N.sEls.forEach((el, i) => { const k = env(t, act[i][0], act[i][1], 0.3, 0.3); el.style.opacity = 0.28 + 0.72 * Math.max(k, i === 2 && t > 25 ? 1 : 0); el.style.transform = `translateX(${k * 10}px)`; });
    N.rows.forEach((r, i) => {
      const k = seg(t, 14.4 + i * 0.1, 14.9 + i * 0.1, E.outCubic); const chosen = CHOSEN.includes(r.dataset.id);
      const pick = seg(t, 17.8, 18.3);
      r.classList.toggle('chosen', chosen && t > 17.8);
      let chip = r.querySelector('.chip'); if (chosen && t > 17.8 && !chip) WY.el('span', { class: 'chip chip-model', text: 'chosen' }, r); if (!(chosen && t > 17.8) && chip) chip.remove();
      const col = chosen ? 0 : seg(t, 19.0, 19.6, E.inOutCubic);
      r.style.opacity = k * (chosen ? 1 : 1 - 0.45 * pick) * (1 - col);
      if (!r.dataset.h) r.dataset.h = r.offsetHeight;
      r.style.height = col > 0 ? (+r.dataset.h * (1 - col)) + 'px' : ''; r.style.paddingTop = r.style.paddingBottom = col > 0 ? (6 * (1 - col)) + 'px' : ''; r.style.borderWidth = col > 0.98 ? '0' : '';
      r.style.marginTop = col > 0 ? (-7 * col) + 'px' : '';
    });
    N.wl.forEach(n => { n.style.opacity = seg(t, 19.4, 20.0); n.style.display = t < 19.2 ? 'none' : ''; });
    N.ml.forEach(n => { n.style.opacity = seg(t, 21.6, 22.2); n.style.display = t < 19.2 ? 'none' : ''; });
    // highlight boxes on the card
    const hl = (sel, a, b, col) => { const els = sel.map(s => N.card.querySelector(s)); const k = env(t, a, b, 0.3, 0.3); if (k <= 0) return; const r0 = els[0].getBoundingClientRect(), r1 = els[els.length - 1].getBoundingClientRect(); g.save(); g.globalAlpha = k; g.strokeStyle = col; g.lineWidth = 4; g.shadowColor = col; g.shadowBlur = 18; g.beginPath(); g.roundRect(r0.left - 10, r0.top - 8, Math.max(r0.width, r1.width) + 20, r1.bottom - r0.top + 16, 14); g.stroke(); g.restore(); };
    hl(['#w-lab', '#w-txt'], 19.6, 21.4, '#ffd24d');
    hl(['#m-lab', '#m-txt'], 21.8, 24.8, '#c9a0ea');
    AIK.show(N.cited, t, 22.6, 24.9, { y: 20 });
    if (t > 25.0 && t < 28.7) { // checks: three ticks over the card
      ['schema', 'caps', 'fresh re-check', 'program'].forEach((w, i) => { const k = seg(t, 25.4 + i * 0.4, 25.8 + i * 0.4, E.outBack) * (1 - seg(t, 28.2, 28.6)); if (k <= 0) return; const x = [830, 1050, 1240, 1510][i], y = 1010; g.save(); g.globalAlpha = clamp(k); g.fillStyle = '#2f6b4a'; g.beginPath(); g.arc(x, y, 22 * k, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#e9ffe9'; g.lineWidth = 5; g.beginPath(); g.moveTo(x - 9, y); g.lineTo(x - 2, y + 8); g.lineTo(x + 11, y - 9); g.stroke(); g.fillStyle = '#e2efe9'; g.font = '600 26px Inter, sans-serif'; g.fillText(w, x + 34, y + 9); g.restore(); });
    }

    // D 29–36
    T.d1.render(t - 29.1, 3.2);
    AIK.show(N.ap, t, 29.5, 32.4, { y: 30 });
    AIK.show(N.share, t, 30.2, 32.4);
    T.d2.render(t - 32.7, 3.0);
    AIK.show(N.keys, t, 33.0, 35.8, { y: 30 });
    AIK.show(N.keyNote, t, 33.6, 35.8);

    // E 36–41
    T.e1.render(t - 36.1, 4.6);
    { const e = AIK.show(N.lims, t, 36.5, 40.8, { y: 30 }); if (e) [...N.lims.firstChild.children].forEach((c, i) => { const k = seg(t, 36.6 + i * 0.22, 37.1 + i * 0.22, E.outBack); c.style.opacity = clamp(k); c.style.transform = `scale(${lerp(0.8, 1, clamp(k))})`; }); }

    // F 41–45.5
    T.f1.render(t - 41.1, 4.0);
    N.pend.forEach((n, i) => AIK.show(n, t, 41.6 + i * 0.3, 45.1, { y: 30 }));

    badgeL.render(t, 6.4, 45.1);
    badgeP.render(t, 6.8, 45.1);
    flash.render(t, 6.0, 0.4, 0.3);
    end.render(t - 45.5);
  },

  audio(A) {
    A.music({ style: 'tension', bpm: 96, key: 'C', sections: [[0, 0.25], [6, 0.45], [13, 0.6], [25, 0.0]], end: 26.5, outro: 'none' });
    A.music({ style: 'epic', bpm: 96, key: 'C', start: 25, sections: [[25, 0.0], [26.5, 0.6], [32.5, 0.55], [36, 0.85], [41, 0.5]], end: 45.5, outro: 'hit' });
    A.drone(0, 6, { note: 'C2', gain: 0.5 }); A.chime(0.5, { note: 'G5', gain: 0.6, dur: 3 });
    A.riser(4.6, 6.0, { gain: 0.5 }); A.whoosh(5.8); A.hit(6.0, { gain: 0.8 });
    for (let i = 0; i < 4; i++) A.pop(6.5 + i * 0.35, { gain: 0.6 });
    A.whoosh(12.9, { gain: 0.6 }); A.hit(13.1, { gain: 0.5 });
    for (let i = 0; i < 8; i++) A.tick(14.4 + i * 0.1, { gain: 0.45, pitch: 1.3 });
    A.chime(17.8, { note: 'E6', gain: 0.6 }); A.type(19.4, 20.4, { gain: 0.3 }); A.sparkle(21.8, { root: 'C5', gain: 0.4 });
    for (let i = 0; i < 4; i++) A.ok(25.4 + i * 0.4, { gain: 0.4 });
    A.whoosh(28.9, { gain: 0.6 }); A.hit(29.1, { gain: 0.5 }); A.whoosh(32.5, { gain: 0.5 }); A.lock(33.1);
    A.whoosh(35.9, { gain: 0.6 }); A.hit(36.1, { gain: 0.6 });
    for (let i = 0; i < 5; i++) A.pop(36.6 + i * 0.22, { gain: 0.6 });
    A.whoosh(40.9, { gain: 0.5 }); A.chime(41.2, { note: 'C5', gain: 0.6 });
    for (let i = 0; i < 4; i++) A.tick(41.6 + i * 0.3, { gain: 0.6 });
  },
});
</script></body></html>
