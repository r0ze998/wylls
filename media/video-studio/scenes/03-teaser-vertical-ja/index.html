<!doctype html><html><head><meta charset="utf-8"><title>03 teaser-vertical-ja</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script>
<script src="../../lib/wy-map.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="../01-trailer-ja/tk.js"></script>
<style>
  .chip { position:absolute; left:150px; width:780px; height:120px; border-radius:18px; display:flex; align-items:center; justify-content:center; font:700 50px var(--sans-jp); color:#fffaf0;
          background:linear-gradient(180deg, rgba(36,73,59,.96), rgba(18,38,31,.97)); border:3px solid rgba(201,162,74,.55); box-shadow:0 14px 40px rgba(0,0,0,.5) }
  .chip.pick { border-color:#ffd24d; box-shadow:0 0 0 4px rgba(255,210,77,.35), 0 0 70px rgba(255,210,77,.5), 0 14px 40px rgba(0,0,0,.5) }
</style>
</head><body><script>
const W = 1080, H = 1920;
const T = { hook: 0.12, map: 1.8, seal: 4.2, stamp: 5.4, ai: 9.0, pick: 10.6, chk: 11.6, cast: 13.2, end: 15.0 };
const E = WY.ease, seg = WY.seg, clamp = WY.clamp, lerp = WY.lerp;
const dist = (a, b) => (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;
let ctx, world, ov, flash, ring, L = {}, cards = [], end, badge, notes = {}, chips = [], chipWrap, checks, K = [], marches = [], sealSrc, sealDst;

WY.scene({
  width: W, height: H, duration: 20, fps: 30,
  setup(stage) {
    ctx = WY.canvas(stage, W, H).getContext('2d');
    world = WYMap.build({ rings: 8, seed: 11 }); TK.preloadMap(world);
    for (let n = 0; n < 6; n++) K[n] = world.tiles.find(t => t.keep && t.owner === n);
    const camps = world.tiles.filter(t => t.camp);
    for (let n = 0; n < 6; n++) { const src = K[n]; const dst = camps.filter(c => dist(c, src) >= 2).sort((a, b) => dist(a, src) - dist(b, src))[0]; marches.push({ n, src, dst }); }
    sealSrc = world.tiles.filter(t => t.owner === 0 && t.village && !t.keep).sort((a, b) => b.ring - a.ring)[0] || K[0];
    sealDst = camps.filter(c => dist(c, sealSrc) >= 4).sort((a, b) => dist(a, sealSrc) - dist(b, sealSrc))[0];

    L.h1 = TK.line(stage, ['10分ごとに、'], { y: 1130, size: 128, stagger: 0.03 });
    L.h2 = TK.line(stage, ['世界が動く。'], { y: 1300, size: 140, stagger: 0.04, style: 'slam' });
    L.s1 = TK.line(stage, ['行き先は、'], { y: 1140, size: 124 });
    L.s2 = TK.line(stage, ['封印される。'], { y: 1310, size: 140, style: 'slam' });
    L.sub = TK.block(stage, '<span style="padding:12px 28px;border-radius:999px;background:rgba(10,20,16,.82);border:2px solid rgba(240,212,138,.6)">drand タイムロック · 取り消し不可</span>', { left: '0px', width: W + 'px', top: '1500px', textAlign: 'center', font: '700 42px var(--sans-jp)', color: '#f0d48a' });
    L.a1 = TK.line(stage, ['その中に、'], { y: 300, size: 112 });
    L.a2 = TK.line(stage, ['AI市民がいる。'], { y: 450, size: 124 });

    chipWrap = WY.el('div', { class: 'wy-fill' }, stage); chipWrap.style.zIndex = 22;
    ['進軍 · 野営地 · 400', '建設 · 書庫', '偵察 · 北東', '訓練 · 槍兵 200'].forEach((s, i) => { const c = WY.el('div', { class: 'chip', text: s }, chipWrap); c.style.top = 700 + i * 140 + 'px'; chips.push(c); });
    const gl = WY.el('div', { class: 'wy-abs', html: '候補(例)— コードが最大12個を出す' }, chipWrap); WY.css(gl, { left: '150px', top: '632px', font: '700 38px var(--sans-jp)', color: 'rgba(240,212,138,.95)' });
    const cap = WY.el('div', { class: 'wy-abs', html: 'モデルが選び、<br>コードが確かめる。' }, chipWrap); WY.css(cap, { left: '0px', width: W + 'px', top: '1300px', textAlign: 'center', font: '700 60px/1.4 var(--sans-jp)', color: '#fffaf0', textShadow: '0 3px 16px rgba(0,0,0,.8)' }); L.cap = cap;
    checks = WY.el('div', { class: 'wy-abs', html: '✓' }, chipWrap);
    WY.css(checks, { left: 150 + 780 - 50 + 'px', top: 700 - 36 + 'px', font: '900 52px/84px var(--sans)', width: '84px', height: '84px', textAlign: 'center', color: '#0e2a1f', background: '#9fe0b0', borderRadius: '50%', border: '4px solid #fffaf0', boxShadow: '0 8px 24px rgba(0,0,0,.5)' });

    for (let f = 0; f < 6; f++) cards.push(TK.castCard(stage, f, { portraitSize: 760 }));
    end = TK.end(stage, { lang: 'ja', line: '意志を持つAIと、ひとつの地図を。', sub: '人とAI市民が、ひとつの地図を<br>争える戦略ゲーム' });
    end.node.querySelectorAll('div').forEach(d => { if (d.textContent === '意志を持つAIと、ひとつの地図を。') d.innerHTML = '意志を持つAIと、<br>ひとつの地図を。'; });

    badge = WYKit.status(stage, 'local', 'ja', { x: 60, y: 236, size: 30 }); badge.node.style.zIndex = 53;
    notes.ai = TK.note(stage, 'ローカルのGemma 4で実行(AI市民とBotの世界)。<br>正式な評価は未完了。', { x: 60, y: 1555, size: 30, w: 960 });
    ov = TK.overlays(stage); flash = WYKit.flash(stage, { color: '#fff6e0' }); ring = TK.ring(stage);
  },

  render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    // ---------- hook: bell + world rising behind it
    if (t < T.seal) {
      ctx.fillStyle = '#030504'; ctx.fillRect(0, 0, W, H);
      const mk = seg(t, T.map - 0.6, T.seal, E.inOutCubic);
      if (t > T.map - 0.8) {
        const cam = { x: 0, y: lerp(80, 120, mk), zoom: lerp(0.95, 0.62, mk), W, H };
        const app = tl => seg(t, T.map - 0.6 + tl.ring * 0.18, T.map - 0.1 + tl.ring * 0.18);
        TK.cloudSea(ctx, cam, t, { from: 7, to: 15 });
        WYMap.draw(ctx, world, cam, { t, appear: app, wash: () => 0.3, features: false, background: false });
        TK.features(ctx, world, cam, { t, appear: app, pennant: tl => ({ rise: seg(t, T.map + 0.6 + tl.owner * 0.12, T.map + 1.0 + tl.owner * 0.12), scale: 2 }) });
        // simultaneous marches at the second bell
        const b2 = T.map + 1.2;
        for (const m of marches) if (m.dst && t > b2) { const pt = TK.marchPath(cam, m.src, m.dst, 0.3); const u = seg(t, b2, b2 + 0.9, E.inOutCubic); if (u < 1) TK.drawMarch(ctx, pt, Math.max(0.04, u), { color: m.n === 4 ? '#dfe6e3' : WY.NATIONS[m.n].fill, width: 8, t }); else WYMap.drawClash(ctx, cam, m.dst, seg(t, b2 + 0.9, b2 + 1.8)); }
        ctx.fillStyle = `rgba(3,5,4,${1 - seg(t, T.map - 0.8, T.map + 0.2)})`; ctx.fillRect(0, 0, W, H);
        const g = ctx.createLinearGradient(0, 1000, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.4, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = g; ctx.fillRect(0, 1000, W, H - 1000);
      }
      // medallion: huge at first, then shrinks to the top
      const s = seg(t, T.map - 0.2, T.map + 0.6, E.inOutCubic);
      const r = lerp(250, 110, s) * (1 + 0.08 * Math.exp(-Math.max(0, t - T.hook) * 6));
      TK.medallion(ctx, W / 2, lerp(700, 400, s), r, { turn: t < T.hook ? 42 : 43, clock: t < T.hook ? '0:00' : '10:00', k: t < T.hook ? 1 : 0.02, glow: 0.4 + Math.exp(-Math.max(0, t - T.hook) * 2) * 0.8 });
    }
    // ---------- sealed march + stamp
    else if (t < T.ai) {
      const u = seg(t, T.seal - 0.2, T.ai, E.inOutSine) * 0.62;
      const a = sealSrc, b = sealDst; const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - Math.hypot(b.x - a.x, b.y - a.y) * 0.28;
      const wx = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * mx + u * u * b.x, wy = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * my + u * u * b.y;
      const cam = { x: wx, y: wy + 80, zoom: lerp(1.5, 1.2, seg(t, T.seal, T.ai)), W, H };
      TK.cloudSea(ctx, cam, t, { from: 7, to: 15 });
      WYMap.draw(ctx, world, cam, { t, wash: () => 0.28, features: false, background: false, fog: tl => (dist(tl, sealDst) <= 1 ? 0.95 : 0) });
      TK.features(ctx, world, cam, { t, pennant: () => ({ rise: 1, scale: 1.3 }) });
      TK.drawMarch(ctx, TK.marchPath(cam, a, b, 0.28), u, { color: '#cc303b', width: 10, head: 'seal', t, sealR: 58 });
      const sk = t - T.stamp;
      if (sk >= -0.15) {
        ctx.fillStyle = `rgba(5,8,7,${0.64 * seg(t, T.stamp - 0.15, T.stamp)})`; ctx.fillRect(0, 0, W, H);
        const p = clamp((sk + 0.15) / 0.15); const sc = sk < 0 ? lerp(3.2, 1, E.inQuad(p)) : 1 + 0.06 * Math.exp(-sk * 6) * Math.cos(sk * 30) + sk * 0.02;
        const sh = sk > 0 ? Math.exp(-sk * 8) * 16 : 0;
        ctx.save(); ctx.translate(Math.sin(sk * 70) * sh, Math.cos(sk * 53) * sh); ctx.globalAlpha = sk < 0 ? p : 1; WYMap.drawSeal(ctx, W / 2, 760, 230 * sc); ctx.restore();
      }
    }
    // ---------- AI
    else if (t < T.cast) {
      const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H / 2, 1300); g.addColorStop(0, '#1b3a2f'); g.addColorStop(1, '#060d0a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.strokeStyle = 'rgba(240,212,138,.07)'; ctx.lineWidth = 2; const off = (t - T.ai) * 16;
      for (let r = -1; r < 24; r++) for (let q = -1; q < 12; q++) { const x = q * 110 + (r % 2) * 55 - off % 110, y = r * 95; WYMap.hexPath(ctx, x, y, 62, 1); ctx.stroke(); }
      ctx.restore();
    }

    // ---------- DOM
    L.h1.render(t, 0.1, T.seal - 0.3, { out: 0.3 });
    L.h2.render(t, 0.45, T.seal - 0.3, { out: 0.3 });
    L.s1.render(t, T.stamp + 0.08, T.ai - 0.3, { out: 0.3 });
    L.s2.render(t, T.stamp + 0.35, T.ai - 0.3, { out: 0.3 });
    L.sub.render(t, T.stamp + 0.8, T.ai - 0.3);
    {
      const on = t >= T.ai - 0.05 && t < T.cast + 0.3; chipWrap.style.display = on ? 'block' : 'none';
      if (on) {
        chipWrap.style.opacity = 1 - E.inCubic(seg(t, T.cast - 0.3, T.cast));
        const sel = seg(t, T.pick, T.pick + 0.3, E.outCubic);
        chips.forEach((c, i) => { const p = E.outBack(seg(t, T.ai + 0.5 + i * 0.12, T.ai + 0.9 + i * 0.12)); c.className = 'chip' + (i === 0 && t >= T.pick ? ' pick' : ''); c.style.opacity = p * (i === 0 ? 1 : 1 - 0.65 * sel); c.style.transform = `translateX(${(1 - p) * 80}px) scale(${i === 0 ? 1 + 0.06 * sel : 1 - 0.04 * sel})`; });
        const ck = seg(t, T.chk, T.chk + 0.35, E.outBack); checks.style.opacity = ck; checks.style.transform = `scale(${ck})`;
        const cp = seg(t, T.pick, T.pick + 0.5, E.outCubic); L.cap.style.opacity = cp; L.cap.style.transform = `translateY(${(1 - cp) * 24}px)`;
      }
    }
    L.a1.render(t, T.ai + 0.05, T.cast - 0.3, { out: 0.3 });
    L.a2.render(t, T.ai + 0.3, T.cast - 0.3, { out: 0.3 });
    notes.ai.render(t, T.ai + 0.6, T.cast - 0.3);
    badge.render(t, T.seal + 0.1, T.cast - 0.3);
    cards.forEach((c, i) => c.render(t, T.cast + i * 0.3, i === 5 ? T.end + 0.2 : T.cast + (i + 1) * 0.3 + 0.32));
    end.render(t - T.end);
    const fl = [[T.hook, 0.5, 0.9], [T.map + 1.2, 0.3, 0.4], [T.stamp, 0.35, 0.5], [T.end, 0.5, 0.8]].filter(e => e[0] <= t).pop() || [-9, 0.1, 0];
    flash.render(t, ...fl);
    const rv = [[T.hook, W / 2, 700, 1.0, 14], [T.stamp, W / 2, 760, 0.8, 10]].filter(e => e[0] <= t).pop() || [-9, 0, 0, 0.1, 1];
    ring.render(t, ...rv);
    ov.render(t, { lb: 0 });
  },

  audio(A) {
    A.music({ style: 'epic', bpm: 100, key: 'D', minor: true, start: 0.12, end: T.end,
      sections: [[0, 0.75], [T.map, 0.85], [T.seal, 0.6], [T.stamp, 0.9], [T.ai, 0.55], [T.cast, 1]], outro: 'hit' });
    A.chime(T.hook, { note: 'D5', gain: 1.7, dur: 4 }); A.chime(T.hook, { note: 'A4', gain: 1.1, dur: 4 }); A.boom(T.hook, { gain: 1.1 });
    A.whoosh(T.map - 0.6, { dur: 1.2 });
    for (let n = 0; n < 6; n++) A.drum(T.map + 0.6 + n * 0.12, { gain: 0.5, pitch: 0.9 + n * 0.06 });
    A.chime(T.map + 1.2, { note: 'D5', gain: 0.9 }); A.march(T.map + 1.2, T.map + 2.1, { bpm: 200 }); A.clash(T.map + 2.1);
    A.whoosh(T.seal - 0.3, { dur: 0.5 });
    A.whoosh(T.stamp - 0.4, { dur: 0.45, dir: 'down' }); A.seal(T.stamp, { gain: 1.6 }); A.boom(T.stamp, { gain: 0.9 });
    A.whoosh(T.ai - 0.3, { dur: 0.5 }); A.glitch(T.ai + 0.05, { gain: 0.5 });
    for (let i = 0; i < 4; i++) A.tick(T.ai + 0.5 + i * 0.12, { gain: 0.8, pitch: 1.2 + i * 0.1 });
    A.chime(T.pick, { note: 'A5', gain: 1.1 }); A.ok(T.chk);
    for (let i = 0; i < 6; i++) { A.drum(T.cast + i * 0.3, { gain: 0.8, pitch: 0.8 + i * 0.06 }); A.swish(T.cast + i * 0.3, { gain: 0.7 }); }
    A.riser(T.cast, T.end, { gain: 0.5 });
    A.chime(T.end + 0.3, { note: 'A5', gain: 0.6, dur: 3 });
  },
});
</script></body></html>
