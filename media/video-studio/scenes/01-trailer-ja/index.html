<!doctype html><html><head><meta charset="utf-8"><title>01 trailer-ja</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script>
<script src="../../lib/wy-map.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="tk.js"></script>
<style>
  .chip { position:absolute; width:372px; height:86px; border-radius:14px; display:flex; align-items:center; justify-content:center; font:700 32px var(--sans-jp); color:#fffaf0;
          background:linear-gradient(180deg, rgba(36,73,59,.95), rgba(18,38,31,.96)); border:2px solid rgba(201,162,74,.55); box-shadow:0 10px 30px rgba(0,0,0,.45); letter-spacing:.02em }
  .chip.pick { border-color:#ffd24d; box-shadow:0 0 0 3px rgba(255,210,77,.35), 0 0 50px rgba(255,210,77,.45), 0 10px 30px rgba(0,0,0,.45) }
  .row { display:flex; justify-content:space-between; align-items:center; padding:14px 26px; font:700 36px var(--sans-jp); border-bottom:1px solid rgba(90,60,20,.25) }
  .row .v { font:700 34px var(--sans-jp) } .row .pub { font:700 24px var(--sans-jp); color:#2f6b4a; padding:4px 12px; border:2px solid #2f6b4a; border-radius:8px; margin-left:22px }
  .row .sealed { color:#a8222c; border-color:#a8222c }
</style>
</head><body><script>
const B = 0.625; // beat at 96 bpm
const T = { bell: 7 * B, six: 13 * B, one: 15 * B, ui: 20 * B, bell2: 24 * B, seal: 30 * B, stamp: 36 * B, ai: 42 * B, keep: 54 * B, clash: 57 * B, cap: 61 * B, cast: 66 * B, title: 78 * B, end: 86 * B };
const W = 1920, H = 1080;
const E = WY.ease, seg = WY.seg, clamp = WY.clamp, lerp = WY.lerp;
let ctx, world, ov, flash, ring, L = {}, shotUI, cards = [], title, end, badge = {}, notes = {}, chips = [], chipWrap, capLines = [], pubPanel, rows = [], pick, checks;
let K = [], marches = [], sealSrc, sealDst, capSrc, capKeep, capSet;
const dist = (a, b) => (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;

WY.scene({
  width: W, height: H, duration: 60, fps: 30,
  setup(stage) {
    ctx = WY.canvas(stage, W, H).getContext('2d');
    world = WYMap.build({ rings: 8, seed: 11 });
    for (let n = 0; n < 6; n++) K[n] = world.tiles.find(t => t.keep && t.owner === n);
    TK.preloadMap(world);
    const camps = world.tiles.filter(t => t.camp);
    for (let n = 0; n < 6; n++) {
      const src = world.tiles.filter(t => t.owner === n && t.village && !t.keep).sort((a, b) => dist(a, K[n]) - dist(b, K[n]))[0] || K[n];
      const dst = camps.filter(c => dist(c, src) >= 2).sort((a, b) => dist(a, src) - dist(b, src))[0];
      marches.push({ n, src, dst });
    }
    // sealed march: Aster village -> a camp
    sealSrc = world.tiles.filter(t => t.owner === 0 && t.village && !t.keep).sort((a, b) => b.ring - a.ring)[0] || K[0];
    sealDst = camps.filter(c => dist(c, sealSrc) >= 4).sort((a, b) => dist(a, sealSrc) - dist(b, sealSrc))[0];
    // capture: Aster tile -> Fjordal keep
    capKeep = K[5];
    capSrc = world.tiles.filter(t => t.owner === 0 && t.terrain !== 'water' && dist(t, capKeep) >= 3 && dist(t, capKeep) <= 4).sort((a, b) => a.y - b.y)[0];
    capSet = new Set(world.tiles.filter(t => t.owner === 5 && dist(t, capKeep) <= 1).map(t => t.q + ',' + t.r));

    // --- type
    L.six = TK.line(stage, ['六つの国。'], { y: 700, size: 116 });
    L.one = TK.line(stage, ['ひとつの地図。'], { y: 845, size: 116 });
    L.turn1 = TK.line(stage, ['10分ごとに、'], { y: 640, size: 112 });
    L.turn2 = TK.line(stage, ['世界が動く。'], { y: 790, size: 112 });
    L.seal = TK.line(stage, ['行き先は、封印される。'], { y: 690, size: 112 });
    L.ai = TK.line(stage, ['その中に、AI市民がいる。'], { y: 110, size: 104 });
    L.keep = TK.line(stage, ['砦を奪え。'], { y: 770, size: 150, style: 'slam', stagger: 0.07 });
    L.sub = TK.block(stage, '<span style="padding:10px 24px;border-radius:999px;background:rgba(10,20,16,.78);border:1.5px solid rgba(240,212,138,.6)">drand タイムロックで封印 · 取り消し不可</span>', { left: '0px', width: W + 'px', top: '880px', textAlign: 'center', font: '700 38px var(--sans-jp)', color: '#f0d48a' });
    L.adv = TK.block(stage, '<span style="padding:10px 22px;border-radius:12px;background:rgba(10,20,16,.85);border:1.5px solid rgba(240,212,138,.6)">ローカルで時計を72ターン送り</span>', { left: '0px', width: W + 'px', top: '282px', textAlign: 'center', font: '700 34px var(--sans-jp)', color: '#f0d48a' });

    // --- real UI shot
    shotUI = TK.shot(stage, TK.ui('hand-ja'), { label: '実際のクライアント画面 · テストデータ' });

    // --- sealed march public-info panel (parchment)
    pubPanel = WY.el('div', { class: 'wy-abs wy-paper' }, stage);
    WY.css(pubPanel, { left: '1170px', top: '150px', width: '670px', padding: '20px 10px 18px', zIndex: 25, opacity: 0 });
    pubPanel.innerHTML = '<div style="font:800 34px var(--serif-jp);padding:6px 26px 14px;color:#3b2a14">進軍 — 誰にでも見えること</div>';
    [['出発', 'ターン 43', '公開'], ['兵数', '400', '公開'], ['到着', 'ターン 46', '公開'], ['行き先', '■■■■', '封印']].forEach(([k, v, p], i) => {
      const r = WY.el('div', { class: 'row', html: `<span>${k}</span><span style="display:flex;align-items:center"><span class="v">${v}</span><span class="pub ${i === 3 ? 'sealed' : ''}">${p}</span></span>` }, pubPanel);
      r.style.color = '#2b2013'; rows.push(r);
    });

    // --- AI beat: chips
    chipWrap = WY.el('div', { class: 'wy-fill' }, stage); chipWrap.style.zIndex = 22;
    const labels = ['進軍 · 野営地 · 400', '建設 · 書庫', '偵察 · 北東', '訓練 · 槍兵 200', '進軍 · 野営地 · 200', '建設 · 農場', '待機', '偵察 · 南', '訓練 · 弓兵 100', '建設 · 城壁', '建設 · 伐採場', '建設 · 鉱山'];
    labels.forEach((s, i) => { const c = WY.el('div', { class: 'chip', text: s }, chipWrap); const col = i % 4, row = Math.floor(i / 4); c.style.left = 172 + col * 400 + 'px'; c.style.top = 330 + row * 110 + 'px'; chips.push(c); });
    const gl = WY.el('div', { html: '候補(例) · 最大12', class: 'wy-abs' }, chipWrap); WY.css(gl, { left: '172px', top: '272px', font: '700 28px var(--sans-jp)', color: 'rgba(240,212,138,.9)', letterSpacing: '.06em' });
    checks = WY.el('div', { class: 'wy-abs' }, chipWrap);
    WY.css(checks, { left: '0px', top: '0px', font: '900 34px/56px var(--sans)', width: '56px', height: '56px', textAlign: 'center', color: '#0e2a1f', background: '#9fe0b0', borderRadius: '50%', border: '3px solid #fffaf0', boxShadow: '0 6px 20px rgba(0,0,0,.5)' });
    checks.innerHTML = '✓';
    const cap = [['コードが候補を出し、', 0], ['モデルが選び、', 1], ['コードが確かめる。', 2]];
    const capRow = WY.el('div', { class: 'wy-abs' }, chipWrap); WY.css(capRow, { left: '0px', width: W + 'px', top: '720px', textAlign: 'center', font: '700 54px var(--sans-jp)', color: '#fffaf0', textShadow: '0 3px 16px rgba(0,0,0,.8)' });
    cap.forEach(([s, i]) => { const sp = WY.el('span', { text: s }, capRow); sp.style.display = 'inline-block'; sp.style.color = i === 1 ? '#ffd24d' : '#fffaf0'; capLines.push(sp); });
    const model = WY.el('div', { class: 'wy-abs', html: 'モデル = ローカルの Gemma 4(有料APIなし)' }, chipWrap);
    WY.css(model, { left: '0px', width: W + 'px', top: '815px', textAlign: 'center', font: '600 32px var(--sans-jp)', color: 'rgba(255,250,240,.75)' }); capLines.push(model);

    // --- cast
    for (let f = 0; f < 6; f++) cards.push(TK.castCard(stage, f, { mirror: f % 2 === 1 }));

    title = TK.title(stage, { size: 190, sub: 'Play the agent economy.' });
    end = TK.end(stage, { lang: 'ja', line: '意志を持つAIと、ひとつの地図を。', sub: '人とAI市民が、ひとつの地図を争える戦略ゲーム' });

    // --- honesty
    badge.a = WYKit.status(stage, 'local', 'ja', { x: 80, y: 70 }); badge.a.node.style.zIndex = 53;
    notes.ai = TK.note(stage, 'AI市民:ローカルの Gemma 4 で実行(AI市民とスクリプトBotの世界)。正式な比較評価は未完了。人とAIが同じ世界で遊んだ記録はまだありません。', { y: 985, size: 24 });
    notes.keep = TK.note(stage, 'own1 の記録を再構成:人間が操作したローカルデモ · AI・ボットなし · 時計を72ターン送ったうえでの奪取', { y: 1000, size: 24 });
    notes.turn = TK.note(stage, '1日144ターン。同じターンの命令は、いっせいに解決されます。', { y: 1000, size: 26 });

    ov = TK.overlays(stage);
    flash = WYKit.flash(stage, { color: '#fff6e0' });
    ring = TK.ring(stage);
  },

  render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    let lb = 0, vig = 1;
    // ---------------------------------------------------------------- 0: cold open
    if (t < T.bell) {
      ctx.fillStyle = '#030504'; ctx.fillRect(0, 0, W, H);
      const left = Math.max(0, Math.ceil(T.bell - t - 0.375 + 0.0001));
      const k = clamp(t / T.bell);
      const a = E.outCubic(clamp(t / 1.2));
      ctx.globalAlpha = a;
      const pulse = Math.max(0, 1 - ((t - 0.375 + 10) % 1) / 0.25) * (t > 0.3 ? 1 : 0);
      TK.medallion(ctx, W / 2, H / 2, 150 + k * 18, { turn: 42, clock: '0:0' + left, k: k, glow: 0.25 + pulse * 0.6 + k * 0.4 });
      ctx.globalAlpha = 1;
      // fine dial ticks
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.strokeStyle = 'rgba(240,212,138,.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 60; i++) { const an = (i / 60) * Math.PI * 2 + t * 0.05; const r0 = 215 + k * 18, r1 = r0 + (i % 5 ? 10 : 22); ctx.globalAlpha = a * (i % 5 ? 0.5 : 1); ctx.beginPath(); ctx.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); ctx.lineTo(Math.cos(an) * r1, Math.sin(an) * r1); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha = 1;
      lb = 120;
    }
    // ---------------------------------------------------------------- 1: world assembles
    else if (t < T.ui) {
      const k = seg(t, T.bell, T.ui - 0.4, E.inOutCubic);
      const cam = { x: lerp(0, 40, k), y: lerp(-40, 30, k), zoom: lerp(1.15, 0.5, k), W, H };
      TK.cloudSea(ctx, cam, t, { from: 6, to: 14 });
      const app = tl => { const j = (tl.q * 13 + tl.r * 7 + 99) % 5 / 5; return seg(t, T.bell + 0.15 + tl.ring * 0.42 + j * 0.3, T.bell + 0.85 + tl.ring * 0.42 + j * 0.3); };
      WYMap.draw(ctx, world, cam, { t, appear: app, fog: tl => 1 - seg(t, T.bell + tl.ring * 0.42 - 0.2, T.bell + tl.ring * 0.42 + 0.7), wash: () => 0.3 * seg(t, T.six - 0.6, T.six + 0.8), features: false, background: false });
      TK.features(ctx, world, cam, { t, appear: app, pennant: tl => ({ rise: seg(t, T.six + tl.owner * 0.208, T.six + tl.owner * 0.208 + 0.45), scale: 1.9 }) });
      // scrim for type
      const g = ctx.createLinearGradient(0, 560, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.globalAlpha = seg(t, T.six - 0.5, T.six); ctx.fillRect(0, 560, W, H - 560); ctx.globalAlpha = 1;
      lb = lerp(120, 0, seg(t, T.bell, T.bell + 1.5, E.inOutCubic));
    }
    // ---------------------------------------------------------------- 2a: real UI
    else if (t < T.bell2) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    }
    // ---------------------------------------------------------------- 2b: everyone resolves at once
    else if (t < T.seal) {
      const k = seg(t, T.bell2, T.seal, E.outCubic);
      const cam = { x: lerp(-20, 30, k), y: lerp(0, 20, k), zoom: lerp(0.66, 0.6, k), W, H };
      TK.cloudSea(ctx, cam, t, { from: 7, to: 13 });
      WYMap.draw(ctx, world, cam, { t, wash: () => 0.3, features: false, background: false });
      TK.features(ctx, world, cam, { t, pennant: () => ({ rise: 1, scale: 1.4 }) });
      const mk = seg(t, T.bell2 + 0.1, T.bell2 + 1.25, E.inOutCubic);
      for (const m of marches) if (m.dst) {
        const pt = TK.marchPath(cam, m.src, m.dst, 0.3);
        if (t < T.bell2 + 1.25) TK.drawMarch(ctx, pt, Math.max(0.03, mk), { color: m.n === 4 ? '#dfe6e3' : WY.NATIONS[m.n].fill, width: 7, t });
        else WYMap.drawClash(ctx, cam, m.dst, seg(t, T.bell2 + 1.25, T.bell2 + 2.4), '#ffd24d');
      }
      // medallion flips 42 -> 43 at the bell
      const mp = seg(t, T.bell2, T.bell2 + 0.4, E.outBack);
      TK.medallion(ctx, W / 2, 118, 78 * (0.6 + 0.4 * mp), { turn: 43, clock: '10:00', k: 0.02, glow: Math.max(0, 1 - (t - T.bell2) / 1.2) });
      const g = ctx.createLinearGradient(0, 560, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 560, W, H - 560);
    }
    // ---------------------------------------------------------------- 3: sealed march
    else if (t < T.ai) {
      const u = seg(t, T.seal + 0.3, T.stamp + 3.5, E.inOutSine) * 0.62;
      const cam0 = { x: 0, y: 0, zoom: 1.2, W, H };
      // track the head in world space
      const a = sealSrc, b = sealDst; const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - Math.hypot(b.x - a.x, (b.y - a.y)) * 0.28;
      const wx = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * mx + u * u * b.x, wy = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * my + u * u * b.y;
      const zoom = lerp(1.35, 1.05, seg(t, T.seal, T.ai, E.inOutCubic));
      const cam = { x: wx + 160, y: wy + 40, zoom, W, H };
      TK.cloudSea(ctx, cam, t, { from: 7, to: 14 });
      WYMap.draw(ctx, world, cam, { t, wash: () => 0.28, features: false, background: false, fog: tl => (tl === sealDst || dist(tl, sealDst) <= 1 ? 0.95 : 0) });
      TK.features(ctx, world, cam, { t, pennant: () => ({ rise: 1, scale: 1.2 }) });
      const pt = TK.marchPath(cam, a, b, 0.28);
      TK.drawMarch(ctx, pt, u, { color: '#cc303b', width: 9, head: 'seal', t, sealR: 34 });
      // question mark over the unknown destination
      const [qx, qy] = TK.scr(cam, sealDst);
      ctx.save(); ctx.globalAlpha = 0.8 * seg(t, T.seal + 0.5, T.seal + 1.2); ctx.fillStyle = '#3b2a14'; ctx.font = `900 ${110 * zoom}px "Noto Serif JP"`; ctx.textAlign = 'center'; ctx.fillText('?', qx, qy - 20 * zoom); ctx.restore();
      // stamp: dim + giant seal
      const sk = t - T.stamp;
      if (sk >= -0.15) {
        ctx.fillStyle = `rgba(5,8,7,${0.62 * seg(t, T.stamp - 0.15, T.stamp)})`; ctx.fillRect(0, 0, W, H);
        const p = clamp((sk + 0.15) / 0.15); const sc = sk < 0 ? lerp(3.2, 1, E.inQuad(p)) : 1 + 0.06 * Math.exp(-sk * 6) * Math.cos(sk * 30) + sk * 0.02;
        const shake = sk > 0 ? Math.exp(-sk * 8) * 14 : 0;
        ctx.save(); ctx.translate(Math.sin(sk * 70) * shake, Math.cos(sk * 53) * shake);
        ctx.globalAlpha = sk < 0 ? p : 1;
        WYMap.drawSeal(ctx, W / 2, 380, 175 * sc);
        ctx.restore();
      }
      lb = 0;
    }
    // ---------------------------------------------------------------- 4: AI citizens
    else if (t < T.keep) {
      const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H / 2, 1200); g.addColorStop(0, '#1b3a2f'); g.addColorStop(1, '#060d0a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // faint hex lattice drifting
      ctx.save(); ctx.strokeStyle = 'rgba(240,212,138,.06)'; ctx.lineWidth = 1.5; const off = (t - T.ai) * 12;
      for (let r = -2; r < 14; r++) for (let q = -2; q < 22; q++) { const x = q * 100 + (r % 2) * 50 - off % 100, y = r * 86; WYMap.hexPath(ctx, x, y, 56, 1); ctx.stroke(); }
      ctx.restore();
    }
    // ---------------------------------------------------------------- 5: take the keep
    else if (t < T.cast) {
      const k = seg(t, T.keep, T.cast, E.inOutSine);
      const [kx] = [capKeep.x];
      const cam = { x: lerp((capSrc.x + capKeep.x) / 2, capKeep.x, seg(t, T.keep, T.clash, E.inOutCubic)), y: lerp((capSrc.y + capKeep.y) / 2, capKeep.y, seg(t, T.keep, T.clash, E.inOutCubic)) - 40, zoom: lerp(1.0, 1.35, k), W, H };
      const shake = t > T.clash ? Math.exp(-(t - T.clash) * 7) * 12 : 0;
      ctx.save(); ctx.translate(Math.sin(t * 80) * shake, Math.cos(t * 61) * shake);
      const cp = seg(t, T.cap, T.cap + 0.6);
      const own = tl => (capSet.has(tl.q + ',' + tl.r) && t >= T.cap ? 0 : tl.owner);
      TK.cloudSea(ctx, cam, t, { from: 7, to: 14 });
      WYMap.draw(ctx, world, cam, { t, owner: own, wash: tl => (capSet.has(tl.q + ',' + tl.r) && t >= T.cap ? 0.3 + 0.35 * (1 - cp) : 0.3), features: false, background: false });
      TK.features(ctx, world, cam, { t, owner: own, pennant: () => ({ rise: 1, scale: 1.7 }) });
      const pt = TK.marchPath(cam, capSrc, capKeep, 0.3);
      const u = seg(t, T.keep - 0.3, T.clash - 0.35, E.inOutSine);
      if (t < T.clash) TK.drawMarch(ctx, pt, u, { color: '#cc303b', width: 9, head: t < T.clash - 0.45 ? 'seal' : 'arrow', t, sealR: 32 });
      // seal breaks just before the clash
      const bk = seg(t, T.clash - 0.45, T.clash - 0.05);
      if (bk > 0 && bk < 1) { const [hx, hy] = pt(u); for (const s of [-1, 1]) { ctx.save(); ctx.translate(hx + s * bk * 60, hy + bk * bk * 80); ctx.rotate(s * bk * 0.8); ctx.globalAlpha = 1 - bk; ctx.beginPath(); ctx.rect(s < 0 ? -40 : 0, -40, 40, 80); ctx.clip(); WYMap.drawSeal(ctx, 0, 0, 32); ctx.restore(); } }
      if (t >= T.clash) WYMap.drawClash(ctx, cam, capKeep, seg(t, T.clash, T.clash + 1.1), '#ffd24d');
      TK.capture(ctx, cam, capKeep, seg(t, T.cap - 0.1, T.cap + 1.7), 0);
      ctx.restore();
      // clock advance
      const ak = seg(t, T.clash + 0.7, T.cap - 0.15);
      const vis = WY.env(t, T.clash + 0.5, T.cap + 1.6, 0.3, 0.4);
      if (vis > 0) { ctx.globalAlpha = vis; TK.medallion(ctx, W / 2, 160, 92, { turn: Math.round(lerp(43, 110, E.inOutCubic(ak))), clock: ak < 1 ? '▶▶' : '0:00', k: (ak * 7.2) % 1, glow: ak > 0 && ak < 1 ? 0.6 : 0.2 }); ctx.globalAlpha = 1; }
      const g = ctx.createLinearGradient(0, 600, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.65)'); ctx.fillStyle = g; ctx.fillRect(0, 600, W, H - 600);
    }
    // ---------------------------------------------------------------- 7: title / end
    else if (t >= T.title) {
      const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1100); g.addColorStop(0, '#1d2a22'); g.addColorStop(1, '#040605'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const k = t - T.title; ctx.save(); ctx.globalAlpha = 0.5 * Math.exp(-k * 1.2); const rg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900); rg.addColorStop(0, 'rgba(255,220,150,.7)'); rg.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); ctx.restore();
    }

    // ---------------------------------------------------------------- DOM layers
    // real UI: push into the turn medallion
    {
      const k = seg(t, T.ui, T.bell2, E.inOutCubic);
      shotUI.render(t, T.ui, T.bell2, { x: 960, y: lerp(540, 400, k), s: lerp(1.02, 1.25, k) }, { ring: { x: 960, y: 42, r: 52, k: seg(t, T.ui + 0.7, T.ui + 1.2, E.outBack) }, fade: 0.12 });
    }
    L.six.render(t, T.six + 0.05, T.ui - 0.35);
    L.one.render(t, T.one + 0.05, T.ui - 0.35);
    L.turn1.render(t, T.ui + 0.5, T.seal - 0.4);
    L.turn2.render(t, T.ui + 0.9, T.seal - 0.4);
    notes.turn.render(t, T.bell2 + 0.4, T.seal - 0.4);
    L.seal.render(t, T.stamp + 0.12, T.ai - 0.4, { out: 0.3 });
    L.sub.render(t, T.stamp + 0.6, T.ai - 0.35);
    // public info panel
    {
      const vis = WY.env(t, T.seal + 0.4, T.stamp - 0.2, 0.4, 0.2);
      pubPanel.style.opacity = vis; pubPanel.style.transform = `translateX(${(1 - E.outCubic(seg(t, T.seal + 0.4, T.seal + 1.0))) * 60}px)`;
      rows.forEach((r, i) => { const p = seg(t, T.seal + 1.0 + i * 0.625, T.seal + 1.35 + i * 0.625, E.outBack); r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * 30}px)`; });
    }
    // AI beat
    {
      const on = t >= T.ai - 0.05 && t < T.keep + 0.4;
      chipWrap.style.display = on ? 'block' : 'none';
      if (on) {
        const out = E.inCubic(seg(t, T.keep - 0.35, T.keep));

        const pickAt = T.ai + 3.75, chkAt = T.ai + 5.0;
        chips.forEach((c, i) => {

          c.style.transform = `translateY(${(1 - p) * 30}px) scale(${picked ? 1 + 0.08 * sel : 1 - 0.04 * sel})`;
        });
        const ck = seg(t, chkAt, chkAt + 0.35, E.outBack);
        WY.css(checks, { left: 172 + 372 - 34 + 'px', top: 330 - 26 + 'px', opacity: ck, transform: `scale(${ck})` });
        capLines.forEach((s, i) => { const at = i < 3 ? T.ai + 1.25 + i * 1.25 : T.ai + 4.4; const p = seg(t, at, at + 0.45, E.outCubic); s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 22}px)`; });
      }
    }
    L.ai.render(t, T.ai + 0.1, T.keep - 0.35, { out: 0.3 });
    notes.ai.render(t, T.ai + 0.6, T.keep - 0.3);
    L.adv.render(t, T.clash + 0.6, T.cap + 1.4);
    L.keep.render(t, T.cap + 0.02, T.cast - 0.35, { out: 0.3 });
    notes.keep.render(t, T.keep + 0.4, T.cast - 0.3);
    badge.a.render(t, T.bell2 + 0.2, T.seal - 0.3);
    if (t >= T.seal) badge.a.render(t, T.seal + 0.2, T.cast - 0.3);
    // cast
    cards.forEach((c, i) => c.render(t, T.cast + i * 1.25, i === 5 ? T.title : T.cast + (i + 1) * 1.25 + 0.32));
    // title & end
    title.render(t, T.title, T.end - 0.5);
    end.render(t - T.end);
    // flashes on cuts
    flash.render(t, T.bell, 0.6, 0.95);
    if (t >= T.bell2 && t < T.bell2 + 0.5) flash.render(t, T.bell2, 0.45, 0.7);
    if (t >= T.stamp && t < T.stamp + 0.5) flash.render(t, T.stamp, 0.35, 0.5);
    if (t >= T.clash && t < T.clash + 0.5) flash.render(t, T.clash, 0.28, 0.5);
    if (t >= T.cap && t < T.cap + 0.6) flash.render(t, T.cap, 0.5, 0.5);
    if (t >= T.title && t < T.title + 0.6) flash.render(t, T.title, 0.5, 0.9);
    { const ev = [[T.bell, W / 2, H / 2, 1.0, 16], [T.bell2, W / 2, 118, 0.9, 10], [T.stamp, W / 2, 380, 0.8, 9], [T.title, W / 2, H / 2, 1.0, 12]].filter(e => e[0] <= t).pop() || [T.bell, W / 2, H / 2, 1, 16]; ring.render(t, ...ev); }
    ov.render(t, { lb });
  },

  audio(A) {
    A.music({ style: 'epic', bpm: 96, key: 'D', minor: true, start: T.bell, end: T.end,

    A.whoosh(T.bell + 0.1, { dur: 1.6, gain: 0.8 });
    for (let r = 0; r <= 8; r++) A.pop(T.bell + 0.9 + r * 0.42, { gain: 0.5, pitch: 0.8 + r * 0.05 });
    for (let n = 0; n < 6; n++) A.drum(T.six + n * 0.208, { gain: 0.55, pitch: 0.9 + n * 0.06, pan: -0.5 + n * 0.2 });

    A.whoosh(T.seal - 0.3, { dur: 0.6 });

    A.lock(T.seal + 1.0 + 3 * 0.625, { gain: 1.1 });

    A.seal(T.clash - 0.45, { gain: 0.9 }); A.hit(T.clash, { gain: 1.1 }); A.clash(T.clash, { gain: 1.2 }); A.clash(T.clash + 0.08, { gain: 0.8 });
    A.type(T.clash + 0.8, T.cap - 0.2, { cps: 26, gain: 0.45 });

    A.riser(T.title - 1.6, T.title, { gain: 0.6 }); A.boom(T.title, { gain: 1.1 });
    for (let i = 0; i < 5; i++) A.drum(T.title + 0.35 + i * 0.3 + 0.12, { gain: 0.7, pitch: 0.85 + i * 0.05 });
    A.chime(T.title + 1.9, { note: 'D6', gain: 0.6 });
