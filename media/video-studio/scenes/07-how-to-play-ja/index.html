<!doctype html><html><head><meta charset="utf-8"><title>07 how to play</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script>
<script src="../../lib/wy-map.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="lk.js"></script>
<style>
  .num { font: 900 210px/1 Cinzel, serif; background: linear-gradient(180deg, #fff3c4 0%, #f0d48a 45%, #b8892e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 12px; background: rgba(10,24,19,.82); border: 1.5px solid rgba(240,212,138,.55); font: 600 27px/1.2 var(--sans-jp); color: #fffaf0; white-space: nowrap; }
  .chip b { color: #f0d48a; font-weight: 700; }
  .frame { position: absolute; border-radius: 16px; overflow: hidden; border: 3px solid rgba(201,162,74,.9); box-shadow: 0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,240,200,.15); background: #0b1512; }
  .rail span { display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; margin-right: 14px; border-radius: 50%; font: 700 28px Cinzel, serif; border: 2px solid rgba(240,212,138,.6); color: #f0d48a; }
</style>
</head><body><script>
const E = WY.ease, N = WY.NATIONS;
const FX = 790, FY = 214, FW = 1060, FH = 596, K = 2560 / 1920;
const STEPS = [
  { s: 4.5, e: 13.5, title: '国を選ぶ', body: ['選ぶのは国だけ。', '村はその場で置かれる。'], chips: ['チケットも抽選もなし ・ 自分の国の土地に<b>すぐ確定</b>'] },
  { s: 13.5, e: 23.5, title: '育てる', body: ['資源はリアルタイムで増える。', '建てて、兵を訓練する。'], chips: ['経済は<b>リアルタイム</b>、戦いは<b>ターン制</b>'] },
  { s: 23.5, e: 32.0, title: '偵察する', body: ['斥候を出すと、', '結果は次のターンに届く。'], chips: ['1ターン = <b>10分</b> ・ 1日 <b>144</b> ターン'] },
  { s: 32.0, e: 42.0, title: '封印して進軍', body: ['行き先は封印される。', '最短2ターン。取り消しはできない。'], chips: ['公開:<b>出発地・兵数・到着ターン</b>', '封印:<b>行き先</b>(drand の時間ロック)'] },
  { s: 42.0, e: 50.5, title: '報告を読む', body: ['衝突の報告を、', 'ブラウザが同じルールで再計算する。'], chips: ['監査ではなく、<b>同じルールでの再計算</b>'] },
];
const END = 50.5, DUR = 55.0;
let bg, bgc, intro = {}, frame, fc, steps = [], rail, badge, cap, ov, end, flash, world, imgs = {}, scout, flow, lattice;

WY.scene({
  width: 1920, height: 1080, duration: DUR, fps: 30,
  setup(stage) {
    for (const k of ['scene-join-ja', 'scene-hand-build-ja', 'scene-hand-train-ja', 'scene-march-ja', 'scene-report-ja']) imgs[k] = WY.img(`ui/${k}.jpg`);
    lattice = LK.hexLattice(2400, 1400, 64, 'rgba(240,212,138,0.05)', 1.5);
    bgc = WY.canvas(stage, 1920, 1080); bg = bgc.getContext('2d');
    // world for map steps: our hamlet at the centre, fog beyond ring 1, a camp to find at (2,-1)
    world = WYMap.build({ rings: 5, seed: 21, sea: false, concord: -1 });
    const TER = ['grassland', 'forest', 'plains', 'grassland', 'hills', 'forest', 'grassland'];
    for (const tl of world.tiles) { tl.village = null; tl.keep = false; tl.camp = false; tl.freecity = false; tl.owner = tl.ring <= 1 ? 0 : -1; tl.terrain = TER[Math.abs(tl.q * 5 + tl.r * 11) % 7]; }
    world.get(0, 0).village = 'hamlet'; world.get(0, 0).terrain = 'plains';
    world.target = world.get(2, -1); world.target.camp = true; world.target.terrain = 'grassland';
    { const oc = document.createElement('canvas'); oc.width = 64; oc.height = 64; WYMap.draw(oc.getContext('2d'), world, { x: 0, y: 0, zoom: 0.05, W: 64, H: 64 }, { fog: () => 1 }); }
    intro.world = WYMap.build({ rings: 8, seed: 11 });
    { const oc = document.createElement('canvas'); oc.width = 64; oc.height = 64; WYMap.draw(oc.getContext('2d'), intro.world, { x: 0, y: 0, zoom: 0.05, W: 64, H: 64 }, { fog: () => 1 }); }
    scout = WY.img(WY.ART + 'units/mobs-v1/cards/0_scout.webp');

    // intro
    intro.root = WY.el('div', { class: 'wy-fill' }, stage);
    intro.cv = WY.canvas(intro.root, 1920, 1080); intro.ctx = intro.cv.getContext('2d');
    intro.shade = LK.div(intro.root, '', { width: '1920px', height: '1080px', background: 'radial-gradient(ellipse at 50% 50%, rgba(5,10,8,.45) 0%, rgba(5,10,8,.75) 70%)' });
    intro.title = LK.lines(intro.root, ['Wyllsの遊び方'], { left: '0px', width: '1920px', top: '380px', textAlign: 'center' }, { font: '900 140px/1.15 var(--serif-jp)', color: '#fffaf0', textShadow: '0 8px 40px rgba(0,0,0,.8)' });
    intro.sub = LK.div(intro.root, '<span style="color:#f0d48a">5</span> つのステップで、ひとつの地図へ', { left: '0px', width: '1920px', top: '590px', textAlign: 'center', font: '700 46px var(--sans-jp)', color: '#fffaf0', textShadow: '0 2px 14px rgba(0,0,0,.9)' });

    // frame (the right-hand viewport)
    frame = WY.el('div', { class: 'frame' }, stage);
    WY.css(frame, { left: FX + 'px', top: FY + 'px', width: FW + 'px', height: FH + 'px' });
    const fcv = WY.canvas(frame, FW, FH); fc = fcv.getContext('2d');
    flow = LK.div(frame, `<div style="display:flex;align-items:center;justify-content:center;gap:18px">
        <span class="chip" style="font-size:26px">ルール(Rust)</span><span style="font:700 34px Inter;color:#f0d48a">→</span>
        <span class="chip" style="font-size:26px">WebAssembly</span><span style="font:700 34px Inter;color:#f0d48a">→</span>
        <span class="chip" style="font-size:26px">このブラウザ</span></div>
        <div id="match" style="margin:34px auto 0;display:flex;align-items:center;justify-content:center;gap:18px;font:800 54px Inter;color:#dff7e6">
        <span style="display:inline-grid;place-items:center;width:70px;height:70px;border-radius:50%;background:#2f8f5b;box-shadow:0 0 30px rgba(80,220,140,.6);font-size:44px">✓</span>Match<span style="font:700 34px var(--sans-jp);color:#fffaf0;opacity:.85">再計算の結果が一致</span></div>`,
      { left: '0px', top: '0px', width: FW + 'px', height: FH + 'px', paddingTop: '170px', background: 'rgba(6,12,10,.82)' });
    flow.match = flow.querySelector('#match');
    cap = LK.div(stage, '', { left: FX + 'px', top: FY + FH + 18 + 'px', width: FW + 'px', textAlign: 'right', font: '500 22px var(--sans-jp)', color: 'rgba(255,250,240,.6)' });

    // left column per step
    for (let i = 0; i < 5; i++) {
      const S = STEPS[i], st = { ...S, i };
      st.root = WY.el('div', { class: 'wy-fill' }, stage);
      st.step = LK.div(st.root, 'STEP', { left: '86px', top: '150px', font: '700 30px Cinzel, serif', letterSpacing: '.4em', color: '#f0d48a' });
      st.num = LK.div(st.root, `<span class="num">${i + 1}</span>`, { left: '76px', top: '186px' });
      st.title = LK.lines(st.root, [S.title], { left: '80px', top: '410px' }, { font: '900 88px/1.15 var(--serif-jp)', color: '#fffaf0', textShadow: '0 4px 20px rgba(0,0,0,.6)' });
      st.body = LK.lines(st.root, S.body, { left: '84px', top: '540px' }, { font: '600 40px/1.6 var(--sans-jp)', color: 'rgba(255,250,240,.92)' });
      st.chips = S.chips.map((c, j) => LK.div(st.root, `<span class="chip">${c}</span>`, { left: '84px', top: 700 + j * 70 + 'px' }));
      steps.push(st);
    }
    rail = LK.div(stage, [1, 2, 3, 4, 5].map(n => `<span>${n}</span>`).join(''), { left: '84px', top: '900px' });
    rail.className += ' rail'; rail.dots = [...rail.querySelectorAll('span')];
    badge = WYKit.status(stage, 'local', 'ja', { x: 80, y: 56 });
    ov = LK.overlays(stage, 45, { vignette: 0.5 }); ov.g.style.display = 'none';
    flash = WYKit.flash(stage, { color: '#fff8e8', z: 50 });
    end = WYKit.endCard(stage, { lang: 'ja', line: '選ぶ。育てる。偵察する。封をして、進む。' });
  },

  render(t) {
    // ---------------- background
    const g = bg;
    const gr = g.createRadialGradient(1300, 480, 50, 1100, 540, 1400); gr.addColorStop(0, '#1d3d31'); gr.addColorStop(1, '#070d0b');
    g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
    g.drawImage(lattice, -240 + t * 6, -160 - t * 3);
    // ---------------- intro
    const iVis = t < 5.2;
    intro.root.style.display = iVis ? 'block' : 'none';
    if (iVis) {
      const out = E.inOutCubic(WY.seg(t, 4.1, 5.0));
      const cam = { x: 0, y: -20, zoom: WY.lerp(0.5, 0.62, E.outCubic(WY.seg(t, 0, 4.5))) + out * 0.5, W: 1920, H: 1080 };
      const ap = tl => WY.seg(t, 0.1 + tl.ring * 0.14, 0.6 + tl.ring * 0.14);
      WYMap.draw(intro.ctx, intro.world, cam, { t, appear: ap, wash: () => 0.3, fog: tl => (tl.ring >= 8 ? 0.85 * ap(tl) : 0) });
      WY.revealChars(intro.title.spans, t - 0.7, { stagger: 0.06, dur: 0.6, rise: 50, blur: 12, out: 3.8 });
      LK.show(intro.sub, t, 1.5, 4.3, { rise: 16 });
      intro.root.style.opacity = 1 - out;
    }
    // ---------------- frame
    const fin = E.outExpo(WY.seg(t, 4.4, 5.4)), fout = E.inCubic(WY.seg(t, END - 0.5, END));
    frame.style.opacity = fin * (1 - fout);
    frame.style.transform = `translate(${(1 - fin) * 120}px, ${Math.sin(t * 0.6) * 5}px) scale(${0.96 + 0.04 * fin})`;
    let si = -1; STEPS.forEach((S, i) => { if (t >= S.s - 0.3) si = i; });
    if (si >= 0 && t < END) drawFrame(si, t - STEPS[si].s, t);
    // dissolve flash between steps inside the frame
    // ---------------- left column
    for (const st of steps) {
      const vis = t > st.s - 0.5 && t < st.e + 0.1;
      st.root.style.display = vis ? 'block' : 'none';
      if (!vis) continue;
      const u = t - st.s, uo = st.e - t;
      const kOut = E.inCubic(WY.clamp(1 - uo / 0.35));
      st.root.style.opacity = 1 - kOut; st.root.style.transform = `translateY(${-kOut * 30}px)`;
      LK.show(st.step, u, 0.0, 99, { rise: 0, x: -20 });
      const kn = E.outBack(WY.seg(u, 0.05, 0.6));
      st.num.style.opacity = WY.seg(u, 0, 0.3); st.num.style.transform = `translateY(${(1 - kn) * 80}px)`;
      WY.revealChars(st.title.spans, u - 0.2, { stagger: 0.06, dur: 0.5, rise: 40, blur: 10 });
      WY.revealChars(st.body.spans, u - 0.7, { stagger: 0.03, dur: 0.45, rise: 18, blur: 6 });
      st.chips.forEach((c, j) => LK.show(c, u, 1.7 + j * 0.35, 99, { rise: 0, x: -30 }));
    }
    rail.style.opacity = fin * (1 - fout);
    rail.dots.forEach((d, i) => { const on = i === si; const done = i < si; d.style.background = on ? '#f0d48a' : done ? 'rgba(240,212,138,.25)' : 'transparent'; d.style.color = on ? '#1b140a' : '#f0d48a'; d.style.transform = `scale(${on ? 1.12 : 1})`; });
    badge.render(t, 4.8, END - 0.3);
    flash.render(t, END - 0.05, 0.6, 0.4);
    end.render(t - END);
  },

  audio(A) {
    A.music({ style: 'heroic', bpm: 100, key: 'D', sections: [[0, 0.35], [4.5, 0.55], [13.5, 0.62], [23.5, 0.5], [32, 0.72], [42, 0.8], [END - 0.6, 0.4]], end: END, outro: 'ring' });
    A.swell(0, 4, { note: 'D3', gain: 0.5 }); A.hit(0.75, { gain: 0.6 });
    for (const S of STEPS) { A.whoosh(S.s - 0.4, { dur: 0.5, gain: 0.7 }); A.hit(S.s + 0.05, { gain: 0.55, bright: 0.7 }); A.drum(S.s + 0.3, { gain: 0.4, pitch: 1.2 }); }
    // step 1: highlight clicks
    A.click(4.5 + 2.6); A.pop(4.5 + 6.2); A.sparkle(4.5 + 7.2, { root: 'A5', gain: 0.35 });
    // step 2: coins ticking
    for (let k = 0; k < 8; k++) A.coin(13.5 + 1.0 + k * 0.5, { gain: 0.25 });
    A.click(13.5 + 5.2); A.pop(13.5 + 7.6);
    // step 3: scout, ticks, bell
    A.march(23.5 + 1.0, 23.5 + 3.0, { gain: 0.6, bpm: 160 });
    A.ticks(23.5 + 3.2, 23.5 + 4.6, 0.25, { gain: 0.5 });
    A.chime(23.5 + 4.6, { note: 'D5', gain: 0.9, dur: 3 }); A.chime(23.5 + 4.66, { note: 'A5', gain: 0.6, dur: 3 });
    A.sparkle(23.5 + 5.3, { root: 'D5', gain: 0.4 });
    // step 4: seal, march, open
    A.click(32 + 1.0); A.pop(32 + 3.4); A.lock(32 + 4.0);
    A.seal(32 + 4.8); A.march(32 + 5.0, 32 + 8.4, { gain: 0.7, bpm: 140 });
    A.clash(32 + 8.6); A.hit(32 + 8.6, { gain: 0.7 });
    // step 5: report, recompute, match
    A.click(42 + 2.4); A.type(42 + 3.5, 42 + 5.0, { cps: 16, gain: 0.35 }); A.ok(42 + 5.4);
  },
});

// ---------------------------------------------------------------- frame content
const lerpV = (a, b, k) => ({ x: WY.lerp(a.x, b.x, k), y: WY.lerp(a.y, b.y, k), w: WY.lerp(a.w, b.w, k) });
const FULL = { x: 0, y: 0, w: 1920 };
function shot(im, v, alpha = 1) {
  const h = v.w * FH / FW;
  fc.globalAlpha = alpha;
  if (im.naturalWidth) fc.drawImage(im, v.x * K, v.y * K, v.w * K, h * K, 0, 0, FW, FH);
  fc.globalAlpha = 1;
  return (x, y) => [(x - v.x) / v.w * FW, (y - v.y) / h * FH, FW / v.w];
}
function hl(m, [x0, y0, x1, y1], k, t) {
  if (k <= 0) return;
  const [a, b, s] = m(x0, y0), [c, d] = m(x1, y1), pad = 8;
  fc.save(); fc.globalAlpha = k;
  fc.fillStyle = 'rgba(0,0,0,.38)'; fc.beginPath(); fc.rect(0, 0, FW, FH); fc.roundRect(a - pad, b - pad, c - a + pad * 2, d - b + pad * 2, 12); fc.fill('evenodd');
  fc.shadowColor = '#ffd24d'; fc.shadowBlur = 22 + 8 * Math.sin(t * 6);
  fc.strokeStyle = '#ffd24d'; fc.lineWidth = 5; fc.beginPath(); fc.roundRect(a - pad, b - pad, c - a + pad * 2, d - b + pad * 2, 12); fc.stroke();
  fc.restore();
}
function setCap(text) { if (cap.textContent !== text) cap.textContent = text; }
const REAL = '実際のクライアント画面(テストデータ)', ILLU = '説明用のイメージ(ゲームの地図アートで作図)';

function drawFrame(i, u, t) {
  fc.clearRect(0, 0, FW, FH);
  flow.style.display = 'none';
  // crossfade from the previous step during the first 0.35 s
  const fadeIn = E.inOutCubic(WY.seg(u, -0.3, 0.25));
  if (i === 0) {
    const v = u < 5.5 ? lerpV(FULL, { x: 300, y: 330, w: 1320 }, E.inOutCubic(WY.seg(u, 1.0, 2.6))) : lerpV({ x: 300, y: 330, w: 1320 }, { x: 760, y: 560, w: 900 }, E.inOutCubic(WY.seg(u, 5.5, 6.5)));
    const m = shot(imgs['scene-join-ja'], v);
    hl(m, [370, 648, 1550, 883], WY.env(u, 2.6, 5.4, 0.3, 0.3), t);
    hl(m, [1198, 900, 1423, 946], WY.env(u, 6.2, 9.5, 0.3, 0.3), t);
    setCap(REAL);
  } else if (i === 1) {
    if (u < 5.3) {
      const v = lerpV(FULL, { x: 520, y: 190, w: 980 }, E.inOutCubic(WY.seg(u, 0.6, 2.2)));
      const m = shot(imgs['scene-hand-build-ja'], v);
      hl(m, [622, 245, 1298, 720], WY.env(u, 2.3, 5.3, 0.3, 0.3), t);
    } else {
      const v = lerpV(FULL, { x: 520, y: 520, w: 880 }, E.inOutCubic(WY.seg(u, 5.4, 6.8)));
      const m = shot(imgs['scene-hand-train-ja'], v, WY.seg(u, 5.2, 5.6));
      hl(m, [584, 870, 900, 902], WY.env(u, 7.4, 10.5, 0.3, 0.3), t);
    }
    // live resource counters over the top of the frame
    drawCounters(u);
    setCap(REAL);
  } else if (i === 2) {
    drawMap(u, t, 'scout');
    setCap(ILLU);
  } else if (i === 3) {
    if (u < 4.6) {
      const v = u < 2.4 ? lerpV(FULL, { x: 1140, y: 60, w: 780 }, E.inOutCubic(WY.seg(u, 0.3, 1.5))) : lerpV({ x: 1140, y: 60, w: 780 }, { x: 1140, y: 640, w: 780 }, E.inOutCubic(WY.seg(u, 2.4, 3.2)));
      const m = shot(imgs['scene-march-ja'], v);
      hl(m, [1548, 280, 1880, 322], WY.env(u, 1.2, 2.5, 0.25, 0.25), t);
      hl(m, [1548, 1003, 1803, 1051], WY.env(u, 3.2, 4.8, 0.25, 0.25), t);
      setCap(REAL);
    } else { drawMap(u, t, 'march'); setCap(ILLU); }
  } else if (i === 4) {
    const v = lerpV(FULL, { x: 470, y: 90, w: 980 }, E.inOutCubic(WY.seg(u, 0.4, 1.8)));
    const m = shot(imgs['scene-report-ja'], v);
    hl(m, [538, 588, 747, 619], WY.env(u, 1.9, 3.3, 0.25, 0.25), t);
    if (u > 3.2) {
      flow.style.display = 'block';
      const k = E.outCubic(WY.seg(u, 3.2, 3.7));
      flow.style.opacity = k;
      const km = E.outBack(WY.seg(u, 5.3, 5.8));
      flow.match.style.opacity = WY.seg(u, 5.3, 5.5); flow.match.style.transform = `scale(${0.7 + 0.3 * km})`;
    }
    setCap(u > 3.2 ? 'ブラウザが共通のルールカーネル(frontier-wasm)で報告を再計算' : REAL);
  }
  // white dissolve at the start of each step
  if (u < 0.35) { fc.fillStyle = `rgba(11,21,18,${1 - fadeIn})`; fc.fillRect(0, 0, FW, FH); }
}

const ICON = n => WY.img(WY.ART + `ui/illustrated/${n}-64.webp`);
const CNT = [['food', '食料', 1220, 40], ['wood', '木材', 815, 30], ['stone', '石材', 662, 25], ['ore', '鉱石', 305, 10], ['gold', '金', 122, 5]].map(c => ({ im: ICON(c[0]), name: c[1], v: c[2], r: c[3] }));
function drawCounters(u) {
  const k = E.outCubic(WY.seg(u, 0.4, 0.9));
  if (k <= 0) return;
  fc.save(); fc.globalAlpha = k;
  const y = FH - 78, w = 196, x0 = (FW - w * 5) / 2;
  fc.fillStyle = 'rgba(8,18,14,.88)'; fc.strokeStyle = 'rgba(240,212,138,.7)'; fc.lineWidth = 2;
  fc.beginPath(); fc.roundRect(x0 - 14, y - 12, w * 5 + 28, 70, 14); fc.fill(); fc.stroke();
  const hours = Math.max(0, u - 0.6) * 0.9; // time-lapse: ~0.9 game hour per second
  CNT.forEach((c, i) => {
    const x = x0 + i * w;
    if (c.im.naturalWidth) fc.drawImage(c.im, x, y - 2, 46, 46);
    fc.fillStyle = '#fffaf0'; fc.font = '800 30px Inter'; fc.textBaseline = 'middle';
    fc.fillText(WY.count(Math.floor(c.v + c.r * hours)), x + 54, y + 14);
    fc.fillStyle = '#9fe0b0'; fc.font = '600 18px Inter'; fc.fillText(`+${c.r}/時`, x + 56, y + 40);
  });
  fc.fillStyle = 'rgba(255,250,240,.7)'; fc.font = '500 18px "Noto Sans JP"'; fc.textAlign = 'right';
  fc.fillText('早送り表示', x0 + w * 5 + 6, y - 24);
  fc.restore(); fc.textAlign = 'left';
}

function drawMap(u, t, mode) {
  const cam = mode === 'scout'
    ? { x: WY.lerp(90, 150, WY.seg(u, 0, 8.5)), y: -70, zoom: WY.lerp(1.45, 1.55, WY.seg(u, 0, 8.5)), W: FW, H: FH }
    : { x: WY.lerp(150, 190, WY.seg(u, 4.6, 10)), y: -80, zoom: WY.lerp(1.4, 1.5, WY.seg(u, 4.6, 10)), W: FW, H: FH };
  const tgt = world.target;
  const revealAt = 4.8;
  const clear = mode === 'scout' ? E.outCubic(WY.seg(u, revealAt, revealAt + 1.0)) : 1;
  WYMap.draw(fc, world, cam, { t, background: true, wash: tl => (tl.owner === 0 ? 0.25 : 0), fog: tl => (tl.ring <= 1 ? 0 : tl === tgt ? 1 - clear : tl.ring === 2 ? 0.55 : 0.85) });
  const home = world.get(0, 0);
  if (mode === 'scout') {
    // scout walks to the edge of the fog
    const k = E.inOutCubic(WY.seg(u, 1.0, 3.0));
    const [hx, hy] = WYMap.toScreen(cam, home.x, home.y - 20), [tx, ty] = WYMap.toScreen(cam, tgt.x, tgt.y - 20);
    const x = WY.lerp(hx, tx, k * 0.8), y = WY.lerp(hy, ty, k * 0.8) - Math.abs(Math.sin(u * 9)) * 6 * (k > 0 && k < 1);
    fc.save(); fc.setLineDash([10, 10]); fc.strokeStyle = 'rgba(255,210,77,.8)'; fc.lineWidth = 4; fc.beginPath(); fc.moveTo(hx, hy); fc.lineTo(x, y); fc.stroke(); fc.restore();
    if (scout.naturalWidth) { fc.globalAlpha = 1 - WY.seg(u, 4.7, 5.2); fc.drawImage(scout, x - 80, y - 180, 160, 200); fc.globalAlpha = 1; }
    // turn dial
    drawDial(u >= 4.6 ? 43 : 42, u, 4.6);
    if (u > 5.3) tag(tx, ty - 120, '蛮族の野営地を発見', WY.seg(u, 5.3, 5.7));
    if (u > 1.6 && u < 4.6) tag(x, y - 210, '結果は次のターン', WY.env(u, 1.8, 4.5, 0.3, 0.3));
  } else {
    const k = E.inOutCubic(WY.seg(u, 4.9, 8.5));
    const sealed = u < 8.6;
    WYMap.drawMarch(fc, cam, home, tgt, Math.max(0.01, k), { sealed, color: '#cc303b', width: 9 });
    const [hx, hy] = WYMap.toScreen(cam, home.x, home.y);
    tag(hx, hy - 150, '槍兵 600 ・ ターン 44 に到着', WY.seg(u, 5.0, 5.4));
    const [tx, ty] = WYMap.toScreen(cam, tgt.x, tgt.y);
    if (sealed) tag(tx, ty - 140, '行き先 : 封印中', WY.seg(u, 5.6, 6.0), '#a8222c');
    else { WYMap.drawClash(fc, cam, tgt, WY.seg(u, 8.6, 9.6)); tag(tx, ty - 140, '到着のターンが終わり、開封', WY.seg(u, 8.7, 9.0)); }
    drawDial(u < 6.7 ? 42 : u < 8.6 ? 43 : 44, u, u < 6.7 ? 99 : u < 8.6 ? 6.7 : 8.6);
  }
}
function tag(x, y, text, k, color = '#12261f') {
  if (k <= 0) return;
  fc.save(); fc.globalAlpha = k; fc.font = '700 26px "Noto Sans JP"';
  const w = fc.measureText(text).width + 36;
  x = WY.clamp(x, w / 2 + 12, FW - w / 2 - 12);
  fc.fillStyle = color; fc.strokeStyle = '#f0d48a'; fc.lineWidth = 2;
  fc.beginPath(); fc.roundRect(x - w / 2, y - 24 + (1 - k) * 10, w, 48, 10); fc.fill(); fc.stroke();
  fc.fillStyle = '#fffaf0'; fc.textAlign = 'center'; fc.textBaseline = 'middle'; fc.fillText(text, x, y + 1 + (1 - k) * 10);
  fc.restore();
}
function drawDial(turn, u, ringAt) {
  const x = FW - 92, y = 92, r = 62;
  fc.save();
  fc.fillStyle = 'rgba(10,22,17,.92)'; fc.beginPath(); fc.arc(x, y, r, 0, Math.PI * 2); fc.fill();
  fc.strokeStyle = '#c9a24a'; fc.lineWidth = 4; fc.stroke();
  const ringK = WY.seg(u, ringAt, ringAt + 0.8);
  if (ringK > 0 && ringK < 1) { fc.strokeStyle = `rgba(255,210,77,${1 - ringK})`; fc.lineWidth = 6; fc.beginPath(); fc.arc(x, y, r + ringK * 50, 0, Math.PI * 2); fc.stroke(); }
  fc.fillStyle = '#f0d48a'; fc.font = '700 18px "Noto Sans JP"'; fc.textAlign = 'center'; fc.textBaseline = 'middle';
  fc.fillText('ターン', x, y - 26);
  fc.fillStyle = '#fffaf0'; fc.font = '800 44px Inter'; fc.fillText(String(turn), x, y + 10);
  fc.restore();
}
