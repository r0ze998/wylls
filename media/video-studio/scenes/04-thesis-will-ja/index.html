<!doctype html><html><head><meta charset="utf-8"><title>04 thesis-will-ja</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script>
<script src="../../lib/wy-map.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="../01-trailer-ja/tk.js"></script>
<style>
  .card { position:absolute; left:110px; top:150px; width:1700px; height:760px; }
  .card .num { position:absolute; left:70px; top:40px; font:900 230px/1 Cinzel, serif; color:#f0d48a; text-shadow:0 10px 40px rgba(0,0,0,.5) }
  .card .ttl { position:absolute; left:70px; top:300px; width:860px; font:800 92px/1.25 var(--serif-jp); color:#fffaf0 }
  .card .exp { position:absolute; left:74px; top:440px; width:820px; font:600 40px/1.6 var(--sans-jp); color:rgba(255,250,240,.86) }
  .card .vis { position:absolute; left:960px; top:70px; width:660px; height:620px; }
  .mini { position:absolute; border-radius:14px; background:rgba(9,22,17,.85); border:1.5px solid rgba(201,162,74,.5); color:#fffaf0; font:600 30px/1.4 var(--sans-jp); padding:18px 24px }
  .lab { font:700 22px var(--sans-jp); color:#f0d48a; letter-spacing:.06em; margin-bottom:8px }
  .bar { height:14px; border-radius:7px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:10px } .bar i { display:block; height:100%; background:linear-gradient(90deg,#c9a24a,#ffd24d) }
  .pip { position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(240,212,138,.25); border:1.5px solid rgba(240,212,138,.6) }
</style>
</head><body><script>
const W = 1920, H = 1080, B = 0.75;
const T = { will: 0.3, morph: 2.4, kanji: 3.6, q: 8.0, honest: 15.0, honest2: 18.0, forms: 24.75, end: 45.0 };
const E = WY.ease, seg = WY.seg, clamp = WY.clamp, lerp = WY.lerp;
let ctx, world, ov, flash, L = {}, end, word, slots = {}, tile, cards = [], pips = [], dust, badges = [], fnotes = [];
const FORMS = [
  { n: 'I', ttl: '続く目標', exp: 'ペルソナごとに4つの目標。<br>ターンをまたいで持ち越され、<br>公開カードに進捗が載る。', badge: 'local' },
  { n: 'II', ttl: '記憶を引用する理由', exp: 'コードが公開記録から書いた<br>「記憶の行」を、モデルは<br>理由の中で引用できる。', badge: 'local' },
  { n: 'III', ttl: '信頼と、<br>未解決の不満', exp: '誰を信頼し、どの仕打ちが<br>まだ報われていないか。<br>それが記録として残る。', badge: 'local', note: 'この形は、正式な本番実行ではまだ確認されていません。' },
  { n: 'IV', ttl: '命令を断る権利', exp: '評議会の攻撃命令を、<br>AI市民は公に<br>断ることができる。', badge: 'code', btxt: 'コード実装済み · 実行での記録なし', note: 'この形は、正式な本番実行ではまだ確認されていません。攻撃命令が採択された記録もまだありません。' },
  { n: 'V', ttl: '評議会での<br>発言と投票', exp: 'コードが標的を最大3つ示し、<br>市民が発言して投票する。<br>評議会はオフチェーン。', badge: 'code', note: '記録された実行では、まだ攻撃命令は採択されていません。' },
];

WY.scene({
  width: W, height: H, duration: 50, fps: 30,
  setup(stage) {
    ctx = WY.canvas(stage, W, H).getContext('2d');
    world = WYMap.build({ rings: 8, seed: 5 }); TK.preloadMap(world);
    // ----- Will -> Wylls
    word = WY.el('div', { class: 'wy-abs' }, stage);
    WY.css(word, { left: '0px', top: '250px', width: W + 'px', display: 'flex', justifyContent: 'center', alignItems: 'baseline', font: '700 260px/1 "Cormorant Garamond", serif', color: '#fffaf0', zIndex: 30, textShadow: '0 10px 50px rgba(0,0,0,.6)' });
    const mk = (txt, wEm) => { const s = WY.el('span', {}, word); WY.css(s, { display: 'inline-block', position: 'relative', width: wEm + 'em', height: '1em', overflow: 'visible', textAlign: 'center' }); const a = WY.el('span', { text: txt }, s); WY.css(a, { position: 'absolute', left: '0px', right: '0px', bottom: '0px' }); return { s, a }; };
    slots.W = mk('W', 0.94); slots.i = mk('i', 0.27); const y = WY.el('span', { text: 'y' }, slots.i.s); WY.css(y, { position: 'absolute', left: '0px', right: '0px', bottom: '0px', color: '#ffd24d' }); slots.y = y;
    slots.l1 = mk('l', 0.26); slots.l2 = mk('l', 0.26); slots.s = mk('s', 0.36); slots.s.a.style.color = '#ffd24d';
    L.kanji = TK.line(stage, ['意志'], { y: 560, size: 170, weight: 900, ls: 0.2, stagger: 0.12 });
    L.eq = TK.block(stage, 'Wylls = will(意志)', { left: '0px', width: W + 'px', top: '800px', textAlign: 'center', font: '600 46px var(--sans-jp)', color: 'rgba(240,212,138,.95)', letterSpacing: '.06em' });
    // ----- question
    L.q1 = TK.line(stage, ['AIに意志があったら、'], { y: 360, size: 100, stagger: 0.05 });
    L.q2 = TK.line(stage, ['ゲームはどう振る舞うのか。'], { y: 520, size: 100, stagger: 0.05 });
    L.qn = TK.block(stage, 'Wylls の思考実験', { left: '0px', width: W + 'px', top: '720px', textAlign: 'center', font: '600 40px var(--sans-jp)', color: 'rgba(240,212,138,.9)', letterSpacing: '.1em' });
    // ----- honest framing
    L.h1 = TK.line(stage, ['モデルが何かを「望んでいる」とは、言わない。'], { y: 330, size: 66, weight: 700, stagger: 0.035 });
    L.h2 = TK.line(stage, ['意志は、仕組みがつくり、外から見せるもの。'], { y: 520, size: 70, weight: 800, color: '#ffe7b0', stagger: 0.035 });
    L.h3 = TK.block(stage, 'その形は、五つ。', { left: '0px', width: W + 'px', top: '740px', textAlign: 'center', font: '700 52px var(--sans-jp)', color: '#fffaf0' });
    // ----- five cards
    FORMS.forEach((f, i) => {
      const c = WY.el('div', { class: 'card wy-panel' }, stage); c.style.zIndex = 25;
      c.innerHTML = `<div class="num">${f.n}</div><div class="ttl">${f.ttl}</div><div class="exp">${f.exp}</div><div class="vis"></div>`;
      if (f.ttl.includes('<br>')) { c.querySelector('.exp').style.top = '515px'; c.querySelector('.ttl').style.top = '262px'; }
      const vis = c.querySelector('.vis'); const parts = buildVis(i, vis);
      cards.push({ node: c, parts });
      const b = WYKit.status(stage, f.badge, 'ja', { x: 80, y: 60, text: f.btxt || (f.badge === 'code' ? 'コード実装済み · 採択の記録なし' : 'ローカル実行で記録') }); b.node.style.zIndex = 53; badges.push(b);
      fnotes.push(f.note ? TK.note(stage, f.note, { y: 960, size: 28, align: 'center', x: 80 }) : null);
      const p = WY.el('div', { class: 'pip' }, stage); WY.css(p, { left: W / 2 - 70 + i * 32 + 'px', top: '935px', zIndex: 30 }); pips.push(p);
    });
    end = TK.end(stage, { lang: 'ja', line: '意志を持つAIと、ひとつの地図を。', sub: '人とAI市民が、ひとつの地図を争える戦略ゲーム' });
    dust = WYKit.dust(stage, { count: 70, z: 8 });
    ov = TK.overlays(stage); flash = WYKit.flash(stage, { color: '#fff6e0' });
  },

  render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // background: warm dark, map breathing behind the question
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H / 2, 1200);
    const warm = seg(t, T.forms - 0.5, T.forms + 0.5);
    g.addColorStop(0, warm > 0 ? '#1b3a2f' : '#1d1a14'); g.addColorStop(1, '#050605'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const ma = WY.env(t, T.q - 1, T.forms, 1.2, 1.0) * 0.3;
    if (ma > 0.005) {
      const cam = { x: lerp(-200, 200, seg(t, T.q - 1, T.forms)), y: lerp(-60, 60, seg(t, T.q - 1, T.forms)), zoom: lerp(0.95, 0.75, seg(t, T.q - 1, T.forms, E.inOutSine)), W, H };
      WYMap.draw(ctx, world, cam, { t, wash: () => 0.25, features: false, background: false });
      ctx.fillStyle = `rgba(6,7,6,${1 - ma})`; ctx.fillRect(0, 0, W, H);
    }
    if (t >= T.forms - 0.5) {
      ctx.save(); ctx.strokeStyle = 'rgba(240,212,138,.05)'; ctx.lineWidth = 1.5; const off = (t - T.forms) * 10;
      for (let r = -2; r < 14; r++) for (let q = -2; q < 22; q++) { const x = q * 100 + (r % 2) * 50 - off % 100, y = r * 86; WYMap.hexPath(ctx, x, y, 56, 1); ctx.stroke(); }
      ctx.restore();
    }
    // ---------- Will -> Wylls
    {
      const on = t < T.q + 0.2; word.style.display = on ? 'flex' : 'none';
      if (on) {
        const inn = E.outCubic(seg(t, T.will, T.will + 1.2)), out = E.inCubic(seg(t, T.q - 0.8, T.q - 0.1));
        word.style.opacity = inn * (1 - out); word.style.filter = inn < 1 || out > 0 ? `blur(${((1 - inn) * 12 + out * 14).toFixed(1)}px)` : 'none';
        word.style.transform = `translateY(${(1 - inn) * 30 - out * 30}px) scale(${1 + t * 0.006})`;
        const m = E.inOutCubic(seg(t, T.morph, T.morph + 0.8));
        slots.i.s.style.width = lerp(0.27, 0.46, m) + 'em';
        slots.i.a.style.transform = `translateY(${-m * 0.6}em)`; slots.i.a.style.opacity = 1 - m;
        slots.y.style.transform = `translateY(${(1 - m) * 0.7}em)`; slots.y.style.opacity = m;
        const sm = E.outBack(seg(t, T.morph + 0.5, T.morph + 1.1));
        slots.s.s.style.width = lerp(0, 0.36, clamp(sm)) + 'em'; slots.s.a.style.opacity = clamp(sm); slots.s.a.style.transform = `translateX(${(1 - clamp(sm)) * 0.3}em)`;
        const gold = seg(t, T.morph + 1.4, T.morph + 2.4); slots.y.style.color = slots.s.a.style.color = `rgb(${lerp(255, 255, gold)},${lerp(210, 250, gold) | 0},${lerp(77, 240, gold) | 0})`;
      }
    }
    L.kanji.render(t, T.kanji, T.q - 0.4, { out: 0.4 });
    L.eq.render(t, T.kanji + 1.0, T.q - 0.4);
    L.q1.render(t, T.q, T.honest - 0.5, { out: 0.45 });
    L.q2.render(t, T.q + 1.6, T.honest - 0.5, { out: 0.45 });
    L.qn.render(t, T.q + 3.6, T.honest - 0.5);
    L.h1.render(t, T.honest, T.forms - 0.55, { out: 0.4 });
    L.h2.render(t, T.honest2, T.forms - 0.55, { out: 0.4 });
    L.h3.render(t, T.honest2 + 3.2, T.forms - 0.55);
    // ---------- cards (4 s each)
    cards.forEach((c, i) => {
      const a = T.forms + i * 4, b = a + 4;
      const vis = t >= a - 0.1 && t < b + 0.5;
      c.node.style.display = vis ? 'block' : 'none';
      if (vis) {
        const inn = E.outExpo(seg(t, a, a + 0.7)), out = E.inCubic(seg(t, b - 0.35, b + (i === 4 ? 0.3 : 0.1)));
        c.node.style.opacity = clamp(inn * 1.5) * (1 - out);
        c.node.style.transform = `perspective(1600px) translateX(${(1 - inn) * 260 - out * 220}px) rotateY(${(1 - inn) * -14 + out * 10}deg) scale(${0.96 + 0.04 * inn + (t - a) * 0.006})`;
        c.parts(t - a);
        const n = c.node.querySelector('.num'); n.style.transform = `translateY(${(1 - inn) * 40}px)`;
      }
      badges[i].render(t, a + 0.2, b - 0.3);
      if (fnotes[i]) fnotes[i].render(t, a + 0.6, b - 0.3);
      const act = t >= a && t < b; pips[i].style.background = act ? '#ffd24d' : t >= b ? 'rgba(240,212,138,.7)' : 'rgba(240,212,138,.2)';
      pips[i].style.opacity = WY.env(t, T.forms, T.end - 0.4, 0.4, 0.4); pips[i].style.transform = `scale(${act ? 1.3 : 1})`;
    });
    dust.render(t, t < T.end ? 0.8 : 0);
    end.render(t - T.end);
    const fl = [[T.morph + 0.5, 0.4, 0.25], [T.forms, 0.4, 0.35], [T.end, 0.5, 0.5]].filter(e => e[0] <= t).pop() || [-9, 0.1, 0];
    flash.render(t, ...fl);
    ov.render(t, { lb: lerp(110, 0, seg(t, T.forms - 1, T.forms)) });
  },

  audio(A) {
    A.music({ style: 'calm', bpm: 80, key: 'D', minor: true, start: 0, end: T.forms, sections: [[0, 0.32], [T.q, 0.42], [T.honest, 0.36], [T.honest2, 0.5]], outro: 'none' });
    A.music({ style: 'epic', bpm: 80, key: 'D', minor: true, start: T.forms, end: T.end, sections: [[T.forms, 0.55], [T.forms + 8, 0.7], [T.forms + 16, 0.88]], outro: 'ring' });
    A.drone(0, T.q, { note: 'D2', gain: 0.6 });
    A.chime(T.will + 0.1, { note: 'D5', gain: 0.8, dur: 3 });
    A.whoosh(T.morph - 0.1, { dur: 0.8, gain: 0.7 }); A.sparkle(T.morph + 0.6, { root: 'A5', gain: 0.6 });
    A.hit(T.kanji, { gain: 0.6, bright: 0.2 });
    A.swell(T.q - 1.5, T.q, { gain: 0.5, note: 'D3' }); A.chime(T.q, { note: 'F5', gain: 0.6 });
    A.chime(T.honest, { note: 'A4', gain: 0.6 }); A.chime(T.honest2, { note: 'D5', gain: 0.7 });
    A.riser(T.forms - 2.5, T.forms, { gain: 0.5 }); A.hit(T.forms, { gain: 0.8 });
    for (let i = 0; i < 5; i++) { const a = T.forms + i * 4; A.whoosh(a - 0.25, { dur: 0.5, gain: 0.8 }); A.drum(a, { gain: 0.8, pitch: 0.8 + i * 0.05 }); A.chime(a + 0.3, { note: ['D5', 'E5', 'F5', 'G5', 'A5'][i], gain: 0.5 }); }
    A.click(T.forms + 4 + 1.6, {}); A.ok(T.forms + 4 + 2.4, { gain: 0.6 });
    A.seal(T.forms + 12 + 2.0, { gain: 1.1 });
    A.chime(T.end + 0.3, { note: 'D5', gain: 0.7, dur: 3 });
  },
});

/* mini visuals for the five forms; each returns render(k) with k = seconds since the card arrived */
function buildVis(i, vis) {
  const box = (html, css) => { const d = WY.el('div', { class: 'mini', html }, vis); WY.css(d, css); return d; };
  const fade = (n, k, a, d = 0.5) => { const p = E.outCubic(seg(k, a, a + d)); n.style.opacity = p; n.style.transform = `translateY(${(1 - p) * 20}px)`; };
  if (i === 0) {
    const head = box('<div class="lab">Wyllカード(例)</div><div style="font:700 34px var(--sans-jp)">目標</div>', { left: '0px', top: '0px', width: '640px' });
    const rows = ['目標 1', '目標 2', '目標 3', '目標 4'].map((s, j) => box(`<div style="display:flex;justify-content:space-between"><span>${s}</span><span style="color:rgba(255,250,240,.55);font-size:24px">進捗</span></div><div class="bar"><i></i></div>`, { left: '0px', top: 150 + j * 112 + 'px', width: '640px', padding: '14px 24px' }));
    const lens = [0.62, 0.35, 0.18, 0.08];
    return k => { fade(head, k, 0.3); rows.forEach((r, j) => { fade(r, k, 0.6 + j * 0.18); r.querySelector('i').style.width = lens[j] * 100 * E.outCubic(seg(k, 1.0 + j * 0.15, 2.4 + j * 0.15)) + '%'; }); };
  }
  if (i === 1) {
    const mem = box('<div class="lab">記憶の行(例)— コードが書く</div>ターン 33:北の野営地で衝突があった', { left: '0px', top: '20px', width: '640px' });
    const why = box('<div class="lab">理由(例)— モデルが書いた · 未検証</div>「北の野営地を攻める。<span style="background:rgba(255,210,77,.25);border-bottom:2px solid #ffd24d">記憶 #1 を引用</span>」', { left: '0px', top: '300px', width: '640px' });
    const ln = WY.el('div', {}, vis); WY.css(ln, { position: 'absolute', left: '320px', top: '150px', width: '4px', height: '0px', background: '#ffd24d', boxShadow: '0 0 14px rgba(255,210,77,.8)' });
    const cav = box('引用は「見せられ、名指しされた」ことを示すだけ。選択の原因とは言えない。', { left: '0px', top: '500px', width: '640px', font: '600 26px/1.5 var(--sans-jp)', color: 'rgba(255,250,240,.75)', background: 'transparent', border: 'none', padding: '0 4px' });
    return k => { fade(mem, k, 0.3); fade(why, k, 1.2); ln.style.height = 150 * E.inOutCubic(seg(k, 0.8, 1.3)) + 'px'; fade(cav, k, 2.0); };
  }
  if (i === 2) {
    const svg = WY.el('svg', { width: 640, height: 620, viewBox: '0 0 640 620' }, vis); svg.style.position = 'absolute';
    const P = [...Array(6)].map((_, j) => { const a = -Math.PI / 2 + (j * Math.PI) / 3; return [320 + Math.cos(a) * 230, 300 + Math.sin(a) * 230]; });
    const lines = [];
    for (let a = 0; a < 6; a++) for (let b = a + 1; b < 6; b++) { const bad = a === 0 && b === 3; const l = WY.el('line', { x1: P[a][0], y1: P[a][1], x2: P[b][0], y2: P[b][1], stroke: bad ? '#e0525c' : 'rgba(159,224,176,.6)', 'stroke-width': bad ? 6 : 2.5, 'stroke-dasharray': bad ? '14 10' : '0', opacity: 0 }, svg); lines.push([l, bad]); }
    const crests = P.map(([x, y], j) => { const g = WY.el('g', {}, svg); g.innerHTML = WY.crest(j, 90).replace('<svg', `<svg x="${x - 39}" y="${y - 45}"`); return g; });
    const tag = box('未解決の不満(例)', { left: '200px', top: '262px', width: '240px', textAlign: 'center', color: '#ffb3b8', border: '1.5px solid #e0525c', padding: '10px 14px', font: '700 28px var(--sans-jp)' });
    return k => { crests.forEach((c, j) => { const p = E.outBack(seg(k, 0.2 + j * 0.08, 0.6 + j * 0.08)); c.setAttribute('opacity', clamp(p)); }); lines.forEach(([l, bad], j) => l.setAttribute('opacity', bad ? seg(k, 1.6, 2.0) : seg(k, 0.8 + j * 0.03, 1.2 + j * 0.03) * 0.8)); fade(tag, k, 2.0); };
  }
  if (i === 3) {
    const ord = box('<div class="lab">評議会</div><div style="font:800 46px var(--serif-jp);margin:6px 0 10px">攻撃命令(例)</div>標的:評議会が選んだ1つ<br>採択後、攻撃の2ターン後まで封印', { left: '30px', top: '60px', width: '580px', padding: '26px 30px' });
    const st = WY.el('div', { html: '辞退' }, vis); WY.css(st, { position: 'absolute', left: '380px', top: '370px', font: '900 64px var(--serif-jp)', color: '#e0525c', border: '6px solid #e0525c', borderRadius: '14px', padding: '0 20px', transform: 'rotate(-14deg)', opacity: 0, background: 'rgba(30,8,10,.4)' });
    const pub = box('辞退は公開される', { left: '30px', top: '520px', width: '580px', textAlign: 'center', font: '700 32px var(--sans-jp)' });
    return k => { fade(ord, k, 0.3); const p = seg(k, 1.8, 2.05); st.style.opacity = p > 0 ? 1 : 0; st.style.transform = `rotate(-14deg) scale(${lerp(2.4, 1, E.inQuad(p))})`; fade(pub, k, 2.4); };
  }
  const bub = [['発言', 'この野営地を、まず片づけよう。(例)'], ['発言', 'いや、東の守りが先だ。(例)']].map(([a, b], j) => box(`<div class="lab">${a}</div>${b}`, { left: j ? '120px' : '0px', top: j * 150 + 'px', width: '520px' }));
  const tally = box('<div class="lab">投票のきまり(例)— 2票以上、かつ他より多いこと</div><div class="tl"></div>', { left: '0px', top: '330px', width: '640px' });
  const tl = tally.querySelector('.tl'); const opts = [['標的 A', 2], ['標的 B', 1], ['標的 C', 0]];
  tl.innerHTML = opts.map(([n]) => `<div style="display:flex;align-items:center;gap:16px;margin-top:10px"><span style="width:110px">${n}</span><span class="v" style="display:flex;gap:8px"></span></div>`).join('');
  const vs = [...tl.querySelectorAll('.v')];
  return k => { bub.forEach((b, j) => fade(b, k, 0.3 + j * 0.6)); fade(tally, k, 1.4); vs.forEach((v, j) => { const n = Math.min(opts[j][1], Math.floor(seg(k, 1.8, 2.8) * 3)); v.innerHTML = '●'.repeat(n).split('').map(() => '<span style="color:#ffd24d;font-size:30px">●</span>').join(''); }); };
}
</script></body></html>
