<!doctype html><html><head><meta charset="utf-8"><title>21 Same rules for AI</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="wyx.js"></script>
<style>
  .blk { position: absolute; left: 70px; top: 420px; width: 940px; z-index: 8; text-align: center; }
  .blk .lb { font: 700 34px Inter; letter-spacing: .3em; color: #f0d48a; }
  .blk .h div { font: 700 92px/1.15 'Cormorant Garamond'; font-variant-numeric: lining-nums; color: #fffaf0; text-shadow: 0 4px 30px rgba(0,0,0,.7); white-space: nowrap; }
  .blk .h em { font-style: normal; color: #ffd24d; }
  .blk .s { font: 500 52px/1.4 Inter; color: rgba(255,250,240,.85); margin-top: 18px; }
  .blk .f { font: 500 36px/1.5 Inter; color: #ffd9a0; }
  .chip { position: absolute; width: 440px; height: 190px; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .chip b { font: 700 64px 'Cormorant Garamond'; color: #fffaf0; }
  .chip span { font: 500 34px Inter; color: rgba(255,250,240,.7); margin-top: 6px; }
</style>
</head><body><script>
let bg, cv, g, ov, badge, end, hook, same, chips = [], blocks = [], dots;
const S = { hook: [0, 3.8], same: [3.8, 8.2], L: [[8.2, 12.0], [12.0, 17.0], [17.0, 21.0], [21.0, 25.4], [25.4, 29.6]] };
const VX = 90, VY = 880, VW = 900, VH = 520; // visual area

WY.scene({
  width: 1080, height: 1920, duration: 34.3, fps: 30,
  setup(stage) {
    bg = X.bg(stage, { tint: '#13281f', hex: 0.06, hexSize: 56 });
    cv = WY.canvas(stage, 1080, 1920); g = cv.getContext('2d'); cv.style.zIndex = 5;

    hook = X.lines(stage, [
      { t: 'SAME RULES', css: { font: '700 124px/1.2 Cinzel', color: '#fffaf0' } },
      { t: 'FOR AI.', css: { font: '700 124px/1.2 Cinzel', color: '#ffd24d' } },
      { t: 'Plus a few safety limits.', css: { font: '500 56px Inter', color: 'rgba(255,250,240,.88)', marginTop: '44px' } },
    ], { y: 640, lineDelay: 0.35, stagger: 0.05 });
    hook.node.style.zIndex = 8;

    same = X.box(stage, {}, `<div class="lb">SAME AS PEOPLE</div><div class="h" style="margin-top:20px"><div>AI citizens play</div><div>on equal terms.</div></div>`); same.className = 'blk';
    [['Keys', 'same setup'], ['Rate limit', '30 actions / hour'], ['Fog', 'same fog of war'], ['Relay', 'same quota']].forEach(([b, s], i) => {
      const c = X.box(stage, { left: (i % 2 ? 560 : 80) + 'px', top: 900 + Math.floor(i / 2) * 230 + 'px' }, `<b>${b}</b><span>${s}</span>`); c.className = 'chip wy-panel'; chips.push(c);
    });

    const L = [
      ['At most', '<em>12 options</em>.', 'The code offers only legal moves.'],
      ['Send at most', '<em>60%</em> of home troops.', 'Per decision, and per day.'],
      ['Model-chosen marches:', '<em>4 a day</em>, max.', ''],
      ['Speech: <em>3</em> per turn,', '<em>40</em> per day.', ''],
      ['The model', '<em>never sees keys</em>.', ''],
    ];
    const SUB = ['', '', '', '', 'A separate process signs.'];
    const FOOT = ['', 'Under 200 troops, the daily cap and floor are waived.', '', '', ''];
    L.forEach(([a, b, s], i) => {
      const d = X.box(stage, {}, `<div class="lb">LIMIT ${i + 1} OF 5</div><div class="h" style="margin-top:20px"><div>${a}</div>${b ? `<div>${b}</div>` : ''}</div><div class="s">${s || SUB[i]}</div>`);
      d.className = 'blk'; blocks.push({ d, parts: [...d.children] });
      if (FOOT[i]) { const f = X.box(stage, { left: '70px', top: '1450px', width: '940px', textAlign: 'center', zIndex: 8 }, `<div class="f" style="font:500 34px Inter;color:#ffd9a0">${FOOT[i]}</div>`); blocks[i].foot = f; }
    });

    badge = WYKit.status(stage, 'local', 'en', { x: 60, y: 1530, size: 30 }); badge.node.style.zIndex = 20;
    ov = X.overlay(stage);
    end = WYKit.endCard(stage, { lang: 'en', line: 'Same rules for AI.' });
  },

  render(t) {
    const E = WY.ease;
    bg.render(t, { gx: 0.5, gy: 0.45 });
    g.clearRect(0, 0, 1080, 1920);
    let drew = false;

    hook.render(t, 0.05, 3.5);

    // same rules
    const [sa, sb] = S.same; const sv = t > sa - 0.1 && t < sb + 0.5;
    same.style.display = sv ? '' : 'none';
    if (sv) [...same.children].forEach((p, j) => { const k = WY.env(t, sa + 0.1 + j * 0.2, sb - 0.1, 0.5, 0.4, E.outCubic); p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 24}px)`; });
    chips.forEach((c, i) => X.show(c, t, sa + 0.8 + i * 0.25, sb - 0.1, { dy: 40, s0: 0.9 }));

    // limits
    blocks.forEach((B, i) => {
      const [a, b] = S.L[i]; const vis = t > a - 0.1 && t < b + 0.5;
      B.d.style.display = vis ? '' : 'none';
      if (B.foot) X.show(B.foot, t, a + 1.6, b - 0.1, { dy: 14 });
      if (!vis) return;
      B.parts.forEach((p, j) => { const k = WY.env(t, a + 0.08 + j * 0.2, b - 0.1, 0.5, 0.35, E.outCubic); p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 30}px)`; p.style.filter = k < 0.99 ? `blur(${(1 - k) * 6}px)` : 'none'; });
      const A = WY.env(t, a + 0.3, b - 0.05, 0.5, 0.35); if (A <= 0) return;
      drew = true; g.save(); g.globalAlpha = A; const lt = t - a;
      if (i === 0) visCands(lt); else if (i === 1) visTroops(lt); else if (i === 2) visMarches(lt); else if (i === 3) visSpeech(lt); else visKeys(lt);
      g.restore();
    });

    // progress dots
    const pa = WY.env(t, 8.0, 29.7, 0.4, 0.4);
    if (pa > 0) {
      drew = true; g.save(); g.globalAlpha = pa;
      for (let i = 0; i < 5; i++) { const on = t >= S.L[i][0]; const cur = t >= S.L[i][0] && t < S.L[i][1]; g.fillStyle = cur ? '#ffd24d' : on ? 'rgba(255,210,77,.5)' : 'rgba(255,250,240,.18)'; g.beginPath(); g.arc(540 + (i - 2) * 46, 360, cur ? 11 : 8, 0, 7); g.fill(); }
      g.restore();
    }
    cv.style.display = drew ? '' : 'none';

    badge.render(t, 3.6, 29.6);
    ov.render(t);
    end.render(t - 29.8);
  },

  audio(A) {
    A.music({ style: 'tech', bpm: 116, key: 'F', minor: true, sections: [[0, 0.55], [3.4, 0.7], [8, 0.85], [17.2, 0.95], [25.8, 0.7]], end: 29.8, outro: 'hit' });
    A.hit(0.1, { gain: 0.9 }); A.whoosh(0.05, { dur: 0.6 }); A.hit(0.6, { gain: 0.6, bright: 0.8 });
    A.whoosh(3.2); [0, 1, 2, 3].forEach(i => A.pop(4.2 + i * 0.25));
    S.L.forEach(([a]) => { A.whoosh(a - 0.25); A.hit(a + 0.05, { gain: 0.45, bright: 0.7 }); });
    for (let i = 0; i < 12; i++) A.tick(8.6 + i * 0.12, { gain: 0.5, pitch: 1 + i * 0.04 }); A.ok(10.4, { gain: 0.5 });
    A.riser(12.4, 13.8, { gain: 0.3 }); A.lock(14.0, { gain: 0.6 });
    for (let i = 0; i < 4; i++) A.drum(17.8 + i * 0.4, { gain: 0.5, pitch: 1.3 }); A.bad(19.6, { gain: 0.4 });
    for (let i = 0; i < 3; i++) A.pop(22.0 + i * 0.3); A.ticks(23.2, 24.4, 0.05, { gain: 0.3, pitch: 1.6 });
    A.lock(27.0, { gain: 0.8 });
    A.chime(30.2, { note: 'C6', gain: 0.4 });
  },
});

// ---------------- visuals (canvas, area VX..VX+VW, VY..VY+VH); lt = time since the beat started
function visCands(lt) {
  const cols = 4, rows = 3, cw = 190, ch = 140, x0 = 540 - (cols * cw) / 2 + cw / 2, y0 = VY + 70;
  for (let i = 0; i < 12; i++) {
    const c = i % cols, r = Math.floor(i / cols); const x = x0 + c * cw, y = y0 + r * ch;
    const k = WY.seg(lt, 0.6 + i * 0.12, 0.9 + i * 0.12, WY.ease.outBack);
    const pick = i === 6 && lt > 2.6; const kp = WY.seg(lt, 2.6, 3.0, WY.ease.outBack);
    g.save(); g.translate(x, y); g.scale(k * (pick ? 1 + 0.15 * kp : 1), k * (pick ? 1 + 0.15 * kp : 1));
    g.beginPath(); for (let j = 0; j < 6; j++) { const an = Math.PI / 6 + (j * Math.PI) / 3; const px = Math.cos(an) * 62, py = Math.sin(an) * 62; j ? g.lineTo(px, py) : g.moveTo(px, py); } g.closePath();
    g.fillStyle = pick ? '#ffd24d' : 'rgba(31,107,79,.85)'; g.fill(); g.strokeStyle = pick ? '#fff3c4' : '#3fdc93'; g.lineWidth = 4; g.stroke();
    g.fillStyle = pick ? '#2b1d0a' : '#eafff2'; g.font = '800 40px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(pick ? '★' : String(i + 1), 0, 2);
    g.restore();
  }
  g.globalAlpha *= WY.seg(lt, 2.7, 3.1); g.fillStyle = '#ffd24d'; g.font = '700 40px Inter'; g.textAlign = 'center'; g.fillText('The model picks one.', 540, VY + VH - 10); g.textAlign = 'left';
}
function visTroops(lt) {
  const x0 = 110, w = 860, y = VY + 120, h = 130;
  const k = WY.seg(lt, 0.6, 1.8, WY.ease.inOutCubic);
  g.fillStyle = 'rgba(255,255,255,.06)'; g.strokeStyle = 'rgba(240,212,138,.4)'; g.lineWidth = 2; g.beginPath(); g.roundRect(x0, y, w, h, 16); g.fill(); g.stroke();
  const wA = w * 0.6 * k;
  g.fillStyle = '#d9a93a'; g.beginPath(); g.roundRect(x0, y, wA, h, [16, 0, 0, 16]); g.fill();
  g.fillStyle = '#2f8a5e'; g.beginPath(); g.roundRect(x0 + w * 0.6, y, w * 0.4 * WY.seg(lt, 1.6, 2.4, WY.ease.outCubic), h, [0, 16, 16, 0]); g.fill();
  // troop dots
  for (let i = 0; i < 40; i++) { const c = i % 20, r = Math.floor(i / 20); const x = x0 + 22 + c * 42, yy = y + 40 + r * 50; if (x > x0 + wA + w * 0.4 * (i % 20 >= 12 ? WY.seg(lt, 1.6, 2.4) : 1) && c >= 12) continue; if (c < 12 && x > x0 + wA) continue; g.fillStyle = 'rgba(255,250,240,.85)'; g.beginPath(); g.arc(x, yy, 9, 0, 7); g.fill(); }
  g.textAlign = 'center'; g.font = '800 64px Inter'; g.fillStyle = '#ffd24d'; g.fillText('60%', x0 + w * 0.3, y + h + 90);
  g.globalAlpha *= 1; g.fillStyle = '#3fdc93'; g.fillText('40%', x0 + w * 0.8, y + h + 90);
  g.font = '700 38px Inter'; g.fillStyle = '#fffaf0'; g.fillText('may march', x0 + w * 0.3, y + h + 150); g.fillText('stays home', x0 + w * 0.8, y + h + 150);
  g.textAlign = 'left';
}
function visMarches(lt) {
  for (let i = 0; i < 5; i++) {
    const x = 160 + i * 190, y = VY + 200; const k = WY.seg(lt, 0.6 + i * 0.4, 1.0 + i * 0.4, WY.ease.outBack);
    const over = i === 4;
    g.save(); g.translate(x, y); g.scale(k, k);
    g.fillStyle = over ? 'rgba(80,20,26,.9)' : 'rgba(16,36,29,.95)'; g.strokeStyle = over ? '#ff6b73' : '#c9a24a'; g.lineWidth = 4; g.beginPath(); g.roundRect(-75, -95, 150, 190, 18); g.fill(); g.stroke();
    // arrow
    g.strokeStyle = over ? 'rgba(255,107,115,.6)' : '#ffd24d'; g.lineWidth = 8; g.setLineDash([16, 12]); g.beginPath(); g.moveTo(-40, 40); g.quadraticCurveTo(0, -60, 40, -20); g.stroke(); g.setLineDash([]);
    g.fillStyle = over ? 'rgba(255,107,115,.6)' : '#ffd24d'; g.beginPath(); g.moveTo(52, -10); g.lineTo(26, -36); g.lineTo(22, -2); g.closePath(); g.fill();
    g.fillStyle = '#fffaf0'; g.font = '800 40px Inter'; g.textAlign = 'center'; g.fillText(String(i + 1), 0, 82);
    if (over) { g.strokeStyle = '#ff5a64'; g.lineWidth = 10; g.beginPath(); g.moveTo(-60, -80); g.lineTo(60, 80); g.moveTo(60, -80); g.lineTo(-60, 80); g.stroke(); }
    g.restore();
  }
  g.globalAlpha *= WY.seg(lt, 2.6, 3.0); g.textAlign = 'center'; g.font = '700 38px Inter'; g.fillStyle = 'rgba(255,250,240,.85)'; g.fillText('No fifth march.', 540, VY + 400); g.textAlign = 'left';
}
function visSpeech(lt) {
  const y = VY + 150;
  for (let i = 0; i < 3; i++) {
    const x = 250 + i * 290; const k = WY.seg(lt, 0.6 + i * 0.3, 1.0 + i * 0.3, WY.ease.outBack);
    g.save(); g.translate(x, y); g.scale(k, k);
    g.fillStyle = 'rgba(255,250,240,.95)'; g.beginPath(); g.roundRect(-120, -70, 240, 130, 26); g.fill(); g.beginPath(); g.moveTo(-30, 58); g.lineTo(-60, 100); g.lineTo(10, 58); g.closePath(); g.fill();
    g.fillStyle = 'rgba(43,32,19,.25)'; for (let l = 0; l < 3; l++) g.fillRect(-90, -40 + l * 30, 180 - l * 40, 12);
    g.restore();
  }
  g.textAlign = 'center'; g.fillStyle = 'rgba(255,250,240,.7)'; g.font = '700 36px Inter'; g.fillText('per turn', 540, y + 160);
  const kc = WY.seg(lt, 1.8, 3.0, WY.ease.outQuart);
  g.globalAlpha *= WY.seg(lt, 1.6, 2.0);
  g.font = '800 120px Inter'; g.fillStyle = '#ffd24d'; g.fillText(Math.round(40 * kc) + ' / day', 540, y + 330);
  g.textAlign = 'left';
}
function visKeys(lt) {
  const y = VY + 160;
  const box = (x, title, sub, gold) => { g.fillStyle = 'rgba(16,36,29,.95)'; g.strokeStyle = gold ? '#ffd24d' : '#c9a24a'; g.lineWidth = 4; g.beginPath(); g.roundRect(x - 190, y - 110, 380, 220, 20); g.fill(); g.stroke(); g.textAlign = 'center'; g.fillStyle = '#fffaf0'; g.font = '700 56px "Cormorant Garamond"'; g.fillText(title, x, y - 20); g.font = '500 32px Inter'; g.fillStyle = 'rgba(255,250,240,.75)'; g.fillText(sub, x, y + 40); };
  const k1 = WY.seg(lt, 0.5, 1.0, WY.ease.outCubic), k2 = WY.seg(lt, 0.9, 1.4, WY.ease.outCubic);
  g.save(); g.globalAlpha *= k1; box(300, 'Mind', 'calls the model', false); g.restore();
  g.save(); g.globalAlpha *= k2; box(780, 'Brain', 'signs', true); g.restore();
  // key icon in the brain, crossed key over the mind
  const key = (x, yy, s, col) => { g.save(); g.translate(x, yy); g.scale(s, s); g.strokeStyle = col; g.lineWidth = 9; g.beginPath(); g.arc(-26, 0, 20, 0, 7); g.stroke(); g.beginPath(); g.moveTo(-6, 0); g.lineTo(46, 0); g.moveTo(30, 0); g.lineTo(30, 18); g.moveTo(44, 0); g.lineTo(44, 14); g.stroke(); g.restore(); };
  const kk = WY.seg(lt, 1.3, 1.8, WY.ease.outBack);
  if (kk > 0) key(780, y + 190, kk * 1.2, '#ffd24d');
  const kx = WY.seg(lt, 1.8, 2.3, WY.ease.outBack);
  if (kx > 0) { key(300, y + 190, 1.2, 'rgba(255,250,240,.35)'); g.strokeStyle = '#ff5a64'; g.lineWidth = 8; g.beginPath(); g.arc(300, y + 190, 54 * kx, 0, 7); g.moveTo(300 - 38 * kx, y + 190 + 38 * kx); g.lineTo(300 + 38 * kx, y + 190 - 38 * kx); g.stroke(); }
  g.strokeStyle = 'rgba(240,212,138,.6)'; g.lineWidth = 4; g.setLineDash([12, 10]); g.lineDashOffset = -lt * 40; g.beginPath(); g.moveTo(495, y); g.lineTo(585, y); g.stroke(); g.setLineDash([]);
  g.textAlign = 'left';
}
</script></body></html>
