<!doctype html><html><head><meta charset="utf-8"><title>22 Why a chain</title>
<link rel="stylesheet" href="../../lib/wy.css">
<script src="../../lib/wy.js"></script><script src="../../lib/wy-audio.js"></script>
<script src="../../lib/wy-map.js"></script><script src="../../lib/wy-kit.js"></script>
<script src="wyx.js"></script>
<style>
  .col { position: absolute; left: 110px; top: 230px; width: 700px; z-index: 8; }
  .rn { font: 700 26px Inter; letter-spacing: .3em; color: #f0d48a; display: flex; align-items: center; gap: 16px; }
  .rn i { width: 46px; height: 2px; background: #c9a24a; display: inline-block; }
  .hl div { font: 700 74px/1.1 'Cormorant Garamond'; font-variant-numeric: lining-nums; color: #fffaf0; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
  .sb { font: 500 36px/1.45 Inter; color: rgba(255,250,240,.84); margin-top: 30px; text-shadow: 0 2px 16px rgba(0,0,0,.8); }
  .fn { font: 500 26px/1.45 Inter; color: #ffd9a0; margin-top: 26px; }
  .card { position: absolute; width: 500px; padding: 22px 28px; z-index: 7; }
  .card h3 { font: 700 48px 'Cormorant Garamond'; color: #fffaf0; }
  .card p { font: 500 29px/1.4 Inter; color: rgba(255,250,240,.82); margin-top: 8px; }
  .chip2 { display: inline-block; font: 700 92px Cinzel; color: rgba(255,250,240,.9); padding: 10px 48px; border: 3px solid rgba(240,212,138,.5); border-radius: 18px; background: rgba(0,0,0,.35); position: relative; margin: 0 30px; }
  .chip2 .x { position: absolute; left: -12%; top: 50%; width: 124%; height: 8px; background: #e0414b; border-radius: 4px; transform-origin: left center; box-shadow: 0 0 20px rgba(224,65,75,.6); }
</style>
</head><body><script>
let ctx, world, cv, mapDim, leftShade, ov, badge, end, flash, bg;
let tA, tB, cols = [], shotWrap, shotImg, shotBox, shotTag, chips, judge, chain, chainG, roles, rolesG, roleTitle, fin;
let K0, K1, MID;
const BE = { b0: [0, 5.2], b1: [5.2, 10.2], b2: [10.2, 17.4], b3: [17.4, 27.2], b4: [27.2, 35.9], b5: [35.9, 42.9], b6: [42.9, 47.9] };

WY.scene({
  width: 1920, height: 1080, duration: 52.5, fps: 30,
  setup(stage) {
    bg = X.bg(stage, { tint: '#13281f', hex: 0.05, hexSize: 66 });
    cv = WY.canvas(stage, 1920, 1080); ctx = cv.getContext('2d'); cv.style.zIndex = 1;
    world = WYMap.build({ rings: 8, seed: 11 });
    K0 = world.keeps.find(k => k.owner === 0); K1 = world.keeps.find(k => k.owner === 1);
    const mx = (K0.x + K1.x) / 2, my = (K0.y + K1.y) / 2; let bd = 1e9;
    for (const tl of world.tiles) { if (tl.terrain === 'water' || tl.village || tl.camp || tl.keep) continue; const d = Math.hypot(tl.x - mx, tl.y - my); if (d < bd) { bd = d; MID = tl; } }
    { const tmp = document.createElement('canvas'); tmp.width = 400; tmp.height = 300; WYMap.draw(tmp.getContext('2d'), world, { x: 0, y: 0, zoom: 0.2, W: 400, H: 300 }, { t: 0 }); }
    mapDim = X.box(stage, { left: 0, top: 0, width: '1920px', height: '1080px', background: '#05090a', zIndex: 2 });
    leftShade = X.box(stage, { left: 0, top: 0, width: '1920px', height: '1080px', background: 'linear-gradient(90deg, rgba(5,9,10,.94) 0%, rgba(5,9,10,.85) 36%, rgba(5,9,10,0) 62%)', zIndex: 3 });

    tA = X.lines(stage, [{ t: 'Why a blockchain?', css: { font: '700 128px/1.2 Cinzel', color: '#fffaf0', textShadow: '0 6px 40px rgba(0,0,0,.8)' } }], { y: 430, stagger: 0.06 });
    tA.node.style.zIndex = 8;
    chips = X.box(stage, { left: '0px', top: '330px', width: '1920px', textAlign: 'center', zIndex: 8 }, `<span class="chip2">Speed<span class="x"></span></span><span class="chip2">Cost<span class="x"></span></span>`);
    tB = X.lines(stage, [{ t: "Neither is the reason.", css: { font: "700 66px 'Cormorant Garamond'", color: '#fffaf0' } }], { y: 640, stagger: 0.04 });
    tB.node.style.zIndex = 8;

    const mkCol = (n, lines, sb, fn = '') => { const c = X.box(stage, {}, `<div class="rn"><i></i>REASON ${n}</div><div class="hl" style="margin-top:22px">${lines.map(l => `<div>${l}</div>`).join('')}</div><div class="sb">${sb}</div>${fn ? `<div class="fn">${fn}</div>` : ''}`); c.className = 'col'; return { c, parts: [c.children[0], ...c.children[1].children, ...[...c.children].slice(2)] }; };
    cols = [
      mkCol(1, ['The program judges', 'every clash,', 'not an operator.'], 'Only the on-chain program<br>decides an outcome.'),
      mkCol(2, ['Destinations', 'stay sealed until', 'arrival.'], 'Size and arrival turn are public;<br>the target is time-locked (drand).', '* Seal secrecy is untested in recorded runs.'),
      mkCol(3, ['The season is', 'a public log.'], 'Anyone can replay it<br>and re-check every rule.', '* Our own verifier, not an independent audit.'),
    ];

    // B2 judge panel
    judge = X.box(stage, { left: '1290px', top: '650px', width: '520px', padding: '26px 32px', zIndex: 8 }, `<div style="font:700 22px Inter;letter-spacing:.24em;color:#f0d48a">WHO DECIDES A CLASH</div>
      <div style="display:flex;align-items:center;gap:18px;margin-top:18px"><span style="font:700 52px 'Cormorant Garamond';color:rgba(255,250,240,.45);position:relative">The operator<span id="jx" style="position:absolute;left:-6%;top:52%;width:112%;height:6px;background:#e0414b;border-radius:3px;transform-origin:left"></span></span><span style="font:700 26px Inter;color:#ff8a8f" id="jx2">no</span></div>
      <div style="display:flex;align-items:center;gap:18px;margin-top:12px"><span style="font:700 60px 'Cormorant Garamond';color:#ffd24d;white-space:nowrap" id="jp">The program</span></div><div style="font:600 20px var(--mono);color:rgba(255,250,240,.55);margin-top:4px">permutation-frontier</div>`);
    judge.className += ' wy-panel';

    // B3 real UI screenshot
    shotWrap = X.box(stage, { left: '800px', top: '200px', width: '1040px', height: '585px', overflow: 'hidden', borderRadius: '14px', border: '2px solid rgba(201,162,74,.8)', boxShadow: '0 30px 80px rgba(0,0,0,.6)', zIndex: 7, background: '#000' });
    shotImg = X.box(shotWrap, { left: 0, top: 0, width: '3840px', height: '2160px', transformOrigin: '0 0' });
    const im = WY.img('../../assets/ui/fx-sealed-t0p6-en-1920x1080.png'); im.style.width = '3840px'; im.style.height = '2160px'; im.style.display = 'block'; shotImg.appendChild(im);
    shotBox = X.box(shotImg, { left: '1962px', top: '862px', width: '486px', height: '70px', border: '6px solid #ffd24d', borderRadius: '12px', boxShadow: '0 0 0 4000px rgba(0,0,0,.35), 0 0 40px rgba(255,210,77,.7)' });
    shotTag = X.box(stage, { left: '800px', top: '800px', width: '1040px', zIndex: 8 }, `<div style="display:flex;justify-content:space-between;font:500 22px Inter;color:rgba(255,250,240,.68)"><span>The real web client (effects demo, sample data)</span><span style="color:#f0d48a">“Arrives on turn 43 · only you can see this”</span></div>`);

    // B4 chain canvas
    chain = WY.canvas(stage, 1100, 560); chain.style.left = '780px'; chain.style.top = '250px'; chain.style.zIndex = 7; chainG = chain.getContext('2d');

    // B5 roles
    roleTitle = X.lines(stage, [{ t: 'Only the program decides outcomes.', css: { font: "700 80px 'Cormorant Garamond'", color: '#fffaf0' } }], { y: 100, stagger: 0.04 });
    roleTitle.node.style.zIndex = 8;
    rolesG = WY.canvas(stage, 1920, 1080); rolesG.style.zIndex = 6; rolesG = rolesG.getContext('2d');
    roles = [
      X.box(stage, { left: '120px', top: '420px' }, '<h3>Keeper</h3><p>Permissionless.<br>Anyone can run one.</p>'),
      X.box(stage, { left: '1300px', top: '420px' }, '<h3>Herald</h3><p>Read-only.<br>Recomputable from the log.</p>'),
      X.box(stage, { left: '640px', top: '760px', width: '640px' }, '<h3>Relay</h3><p>Pays fees for players.<br>Can refuse, but can\'t change results.</p>'),
    ];
    roles.forEach(r => (r.className += ' card wy-panel'));
    roles.prog = X.box(stage, { left: '760px', top: '370px', width: '400px', height: '260px', zIndex: 8, textAlign: 'center' }, `<div style="font:700 22px Inter;letter-spacing:.2em;color:#f0d48a;margin-top:66px">THE ONLY JUDGE</div><div style="font:700 56px 'Cormorant Garamond';color:#fffaf0;margin-top:6px">The program</div>`);

    // B6
    fin = X.lines(stage, [
      { t: 'For now: a local test chain.', css: { font: "700 84px 'Cormorant Garamond'", color: '#fffaf0' } },
      { t: 'The rebuilt game has not run on devnet', css: { font: '500 40px/1.5 Inter', color: 'rgba(255,250,240,.82)', marginTop: '34px' } },
      { t: 'or mainnet yet.', css: { font: '500 40px/1.5 Inter', color: 'rgba(255,250,240,.82)' } },
    ], { y: 390, stagger: 0.03, lineDelay: 0.5 });
    fin.node.style.zIndex = 8;

    badge = WYKit.status(stage, 'local', 'en', { x: 80, y: 966 }); badge.node.style.zIndex = 20;
    flash = WYKit.flash(stage, { color: '#ffe8b0', z: 65 });
    ov = X.overlay(stage);
    end = WYKit.endCard(stage, { lang: 'en', line: 'The program judges, not the operator.' });
  },

  render(t) {
    const E = WY.ease;
    bg.render(t, { gx: 0.62, gy: 0.5, hexA: 0.05 });

    // ---------- map (b0–b2)
    const mapOn = t < BE.b2[1] + 0.6;
    ctx.clearRect(0, 0, 1920, 1080);
    if (mapOn) {
      const kz = WY.seg(t, 9.6, 11.4, E.inOutCubic);
      const z = WY.lerp(0.42 + t * 0.004, 1.05, kz);
      const fx = WY.lerp(0, MID.x, kz), fy = WY.lerp(0, MID.y, kz);
      const cam = { x: fx - WY.lerp(0, (1340 - 960) / z, kz) + WY.drift(t, 1, 10), y: fy + WY.drift(t, 2, 8), zoom: z, W: 1920, H: 1080 };
      WYMap.draw(ctx, world, cam, { t, background: true, appear: tl => WY.seg(t, tl.ring * 0.12, tl.ring * 0.12 + 0.6), wash: () => 0.24 });
      // b2 marches + clash
      const km = WY.seg(t, 11.6, 13.4, E.inOutCubic);
      if (km > 0) {
        WYMap.drawMarch(ctx, cam, K0, MID, km, { color: WY.NATIONS[0].fill, width: 8 });
        WYMap.drawMarch(ctx, cam, K1, MID, km, { color: WY.NATIONS[1].fill, width: 8 });
      }
      if (t > 13.4) { WYMap.drawClash(ctx, cam, MID, WY.seg(t, 13.4, 14.8)); const kk = ((t - 13.4) % 1.6) / 1.6; WYMap.drawClash(ctx, cam, MID, 0.3 + kk * 0.7, '#fff3c4'); }
      cv.style.opacity = WY.env(t, -1, BE.b2[1] + 0.2, 0.5, 0.5);
    }
    cv.style.display = mapOn ? '' : 'none';
    mapDim.style.opacity = t < 10.2 ? 0.55 : WY.lerp(0.55, 0, WY.seg(t, 10.2, 11));
    mapDim.style.display = mapOn ? '' : 'none';
    leftShade.style.opacity = WY.env(t, 10.4, BE.b4[1], 0.6, 0.5);

    // ---------- b0, b1
    tA.render(t, 0.3, 4.9);
    const kc = X.show(chips, t, 5.4, 9.9, { dy: 30 });
    if (kc > 0) chips.querySelectorAll('.x').forEach((x, i) => { x.style.transform = `translateY(-50%) scaleX(${WY.seg(t, 6.3 + i * 0.35, 6.6 + i * 0.35, E.outCubic)})`; });
    tB.render(t, 6.6, 9.9);

    // ---------- reason columns
    const spans = [BE.b2, BE.b3, BE.b4];
    cols.forEach((C, i) => {
      const [a, b] = spans[i]; const vis = t > a - 0.1 && t < b + 0.6;
      C.c.style.display = vis ? '' : 'none'; if (!vis) return;
      C.parts.forEach((p, j) => { const k = WY.env(t, a + 0.1 + j * 0.2, b - 0.1, 0.6, 0.4, E.outCubic); p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 26}px)`; p.style.filter = k < 0.99 ? `blur(${(1 - k) * 6}px)` : 'none'; });
    });
    // judge
    const kj = X.show(judge, t, 13.9, BE.b2[1] - 0.05, { dx: 40, dy: 0 });
    if (kj > 0) { WY.$('#jx').style.transform = `scaleX(${WY.seg(t, 14.6, 14.9, E.outCubic)})`; WY.$('#jx2').style.opacity = WY.seg(t, 14.8, 15.1); WY.$('#jp').style.textShadow = `0 0 ${30 * WY.seg(t, 15.0, 15.6)}px rgba(255,210,77,.7)`; }

    // ---------- b3 screenshot push-in
    const ks = X.show(shotWrap, t, BE.b3[0] + 0.2, BE.b3[1] - 0.05, { dx: 50, dy: 0, fi: 0.7 });
    X.show(shotTag, t, BE.b3[0] + 0.9, BE.b3[1] - 0.05, { dy: 10 });
    if (ks > 0) {
      const kp = WY.seg(t, BE.b3[0] + 0.5, BE.b3[0] + 5.5, E.inOutCubic);
      const s0 = 1040 / 3840, s1 = 0.85; const s = WY.lerp(s0, s1, kp) * (1 + 0.01 * Math.sin(t * 0.7));
      const cx = WY.lerp(1920, 2230, kp), cy = WY.lerp(1080, 990, kp);
      shotImg.style.transform = `translate(${520 - cx * s}px, ${292 - cy * s}px) scale(${s})`;
      const kb = WY.seg(t, BE.b3[0] + 4.6, BE.b3[0] + 5.2, E.outBack);
      shotBox.style.opacity = WY.seg(t, BE.b3[0] + 4.6, BE.b3[0] + 4.9); shotBox.style.transform = `scale(${0.8 + 0.2 * kb})`;
    }

    // ---------- b4 chain of blocks
    const kch = WY.env(t, BE.b4[0] - 0.1, BE.b4[1] - 0.05, 0.6, 0.4);
    chain.style.display = kch > 0 ? '' : 'none';
    if (kch > 0) {
      const g = chainG; g.clearRect(0, 0, 1100, 560); g.globalAlpha = kch;
      const a4 = BE.b4[0]; const scroll = (t - a4) * 70;
      const ks2 = WY.seg(t, a4 + 1.6, a4 + 4.2, E.inOutCubic); // replay sweep
      const bw = 150, gap = 36, y = 120;
      for (let i = -2; i < 9; i++) {
        const n = Math.floor(scroll / (bw + gap)) + i; const x = i * (bw + gap) - (scroll % (bw + gap)) + 30;
        if (x < -bw || x > 1100) continue;
        const swept = x + bw / 2 < ks2 * 1100;
        g.fillStyle = swept ? 'rgba(31,107,79,.9)' : 'rgba(16,36,29,.95)'; g.strokeStyle = swept ? '#3fdc93' : 'rgba(201,162,74,.75)'; g.lineWidth = 2.5;
        g.beginPath(); g.roundRect(x, y, bw, 120, 12); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,250,240,.9)'; g.font = '700 22px Inter'; g.fillText('Turn ' + (100 + n), x + 16, y + 38);
        g.fillStyle = 'rgba(255,250,240,.5)'; g.font = '500 16px "JetBrains Mono"';
        const r = WY.rng(n * 17 + 3); for (let l = 0; l < 3; l++) g.fillRect(x + 16, y + 58 + l * 16, 40 + r() * 80, 5);
        if (swept) { g.fillStyle = '#3fdc93'; g.font = '700 28px Inter'; g.fillText('✓', x + bw - 34, y + 38); }
        if (i < 8) { g.strokeStyle = 'rgba(240,212,138,.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + bw, y + 60); g.lineTo(x + bw + gap, y + 60); g.stroke(); }
      }
      // sweep head
      if (ks2 > 0 && ks2 < 1) { const sx = ks2 * 1100; const gr = g.createLinearGradient(sx - 80, 0, sx, 0); gr.addColorStop(0, 'rgba(63,220,147,0)'); gr.addColorStop(1, 'rgba(63,220,147,.35)'); g.fillStyle = gr; g.fillRect(sx - 80, y - 30, 80, 180); g.fillStyle = '#3fdc93'; g.fillRect(sx - 2, y - 30, 4, 180); }
      g.fillStyle = 'rgba(255,250,240,.6)'; g.font = '500 24px Inter'; g.fillText("The season's transaction log", 30, 80);
      // counters
      const kn = WY.seg(t, a4 + 1.6, a4 + 4.2, E.outQuart);
      g.globalAlpha = kch * WY.seg(t, a4 + 1.2, a4 + 1.8);
      g.fillStyle = '#fffaf0'; g.font = '800 96px Inter'; g.fillText(X.num(Math.round(144300 * kn)), 30, 400);
      g.font = '700 30px Inter'; g.fillStyle = 'rgba(255,250,240,.8)'; g.fillText('transactions replayed (M1 exit)', 30, 450);
      g.fillStyle = '#fffaf0'; g.font = '800 96px Inter'; g.fillText(Math.round(30 * kn) + '/30', 660, 400);
      g.font = '700 30px Inter'; g.fillStyle = 'rgba(255,250,240,.8)'; g.fillText('tamper classes caught', 660, 450);
      const kp2 = WY.seg(t, a4 + 4.3, a4 + 4.6, E.outBack);
      if (t > a4 + 4.3) { g.save(); g.translate(30, 470); g.globalAlpha = kch; g.strokeStyle = '#3fdc93'; g.lineWidth = 4; g.fillStyle = '#3fdc93'; g.font = '900 44px Cinzel'; g.translate(90, 40); g.scale(1.5 - 0.5 * kp2, 1.5 - 0.5 * kp2); g.strokeRect(-90, -30, 180, 62); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('PASS', 0, 4); g.restore(); }
      g.globalAlpha = 1;
    }

    // ---------- b5 roles
    roleTitle.render(t, BE.b5[0] + 0.2, BE.b5[1] - 0.1);
    const kr = WY.env(t, BE.b5[0] + 0.4, BE.b5[1] - 0.05, 0.6, 0.4);
    const g5 = rolesG; g5.clearRect(0, 0, 1920, 1080);
    g5.canvas.style.display = kr > 0 ? '' : 'none';
    X.show(roles.prog, t, BE.b5[0] + 0.5, BE.b5[1] - 0.05, { s0: 0.7, dy: 0 });
    roles.forEach((r, i) => X.show(r, t, BE.b5[0] + 1.0 + i * 0.5, BE.b5[1] - 0.05, { dy: 24 }));
    if (kr > 0) {
      const cx = 960, cy = 500; g5.globalAlpha = kr;
      // centre disc
      const p = 1 + 0.02 * Math.sin(t * 3);
      g5.fillStyle = 'rgba(16,36,29,.96)'; g5.strokeStyle = '#ffd24d'; g5.lineWidth = 5; g5.beginPath(); g5.arc(cx, cy, 175 * p, 0, 7); g5.fill(); g5.stroke();
      g5.strokeStyle = 'rgba(255,210,77,.25)'; g5.lineWidth = 2; g5.beginPath(); g5.arc(cx, cy, 205 + 6 * Math.sin(t * 2), 0, 7); g5.stroke();
      const links = [[[620, 520], [cx - 180, cy + 10], 1, '#f0d48a'], [[cx + 180, cy + 10], [1300, 520], 1, '#7fb7a4'], [[960, 760], [960, cy + 178], 1, '#f0d48a']];
      links.forEach(([a, b, , col], i) => {
        const kl = WY.seg(t, BE.b5[0] + 1.2 + i * 0.5, BE.b5[0] + 1.8 + i * 0.5);
        g5.strokeStyle = col; g5.globalAlpha = kr * 0.6; g5.lineWidth = 3; g5.setLineDash([10, 10]); g5.lineDashOffset = -t * 40;
        g5.beginPath(); g5.moveTo(a[0], a[1]); g5.lineTo(a[0] + (b[0] - a[0]) * kl, a[1] + (b[1] - a[1]) * kl); g5.stroke(); g5.setLineDash([]);
        if (kl >= 1) for (let q = 0; q < 4; q++) { const u = (t * 0.6 + q / 4) % 1; g5.globalAlpha = kr * Math.sin(u * Math.PI); g5.fillStyle = col; g5.beginPath(); g5.arc(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, 6, 0, 7); g5.fill(); }
      });
      g5.globalAlpha = 1;
    }

    // ---------- b6
    fin.render(t, BE.b6[0] + 0.2, BE.b6[1] - 0.5);

    flash.render(t, 13.4, 0.5, 0.35);
    badge.render(t, 10.6, 48.0);
    ov.render(t);
    end.render(t - 48.1);
  },

  audio(A) {
    A.music({ style: 'tech', bpm: 100, key: 'D', minor: true, sections: [[0, 0.25], [5.2, 0.35], [10.2, 0.7], [17.4, 0.6], [27.2, 0.8], [35.9, 0.9], [42.9, 0.4]], end: 48.1, outro: 'hit' });
    A.drone(0, 5.2, { note: 'D2', gain: 0.8 }); A.whoosh(0.2, { dur: 1.4 }); A.hit(0.5, { gain: 0.5 });
    A.whoosh(5.0); A.hit(6.3, { gain: 0.4, bright: 0.8 }); A.hit(6.65, { gain: 0.4, bright: 0.8 });
    A.whoosh(9.9, { dur: 1.2 }); A.march(11.6, 13.4, { bpm: 200, gain: 0.8 }); A.clash(13.4); A.boom(13.4, { gain: 0.6 }); A.seal(15.0, { gain: 0.6 });
    A.whoosh(17.2); A.lock(22.1, { gain: 0.7 });
    A.whoosh(27.0); A.ticks(28.8, 31.4, 0.12, { gain: 0.4, pitch: 1.3 }); A.ok(31.6);
    A.whoosh(35.7); A.swell(36.1, 39.5, { note: 'D3', gain: 0.5 }); A.pop(36.9); A.pop(37.4); A.pop(37.9);
    A.whoosh(42.7); A.chime(48.5, { note: 'A5', gain: 0.5 });
  },
});
</script></body></html>
