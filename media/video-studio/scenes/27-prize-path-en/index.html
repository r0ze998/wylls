      // amount in the vault

      g.strokeStyle = 'rgba(240,212,138,.25)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x0 + 56, y0 + h / 2); g.lineTo(x0 + 56, y0 + h / 2 + 3 * (h + gap)); g.stroke();
      g.strokeStyle = '#ffd24d'; g.beginPath(); g.moveTo(x0 + 56, y0 + h / 2); g.lineTo(x0 + 56, y0 + h / 2 + 3 * (h + gap) * sp); g.stroke();

        const at = T.c + 0.6 + i * 2.0; const p = e.outCubic(WY.seg(t, at - 0.5, at + 0.3)); const lit = WY.seg(t, at, at + 0.4);

        label(en, x0 + 150, y + 40, '700 30px Inter', '#ffe8a3', 'left');
        label(ja, x0 + 150, y + 80, '600 28px Inter', '#fffaf0', 'left');
        // node
        g.fillStyle = lit > 0 ? '#ffd24d' : '#3a3216'; g.beginPath(); g.arc(x0 + 56, y + h / 2, 22 + 4 * lit, 0, 7); g.fill();
        g.strokeStyle = '#f0d48a'; g.lineWidth = 3; g.stroke();

        g.restore();
      });
      g.globalAlpha = 1;
    }
