[package]
name = "runtime-contract-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
solana-program = "=4.0.0"
solana-program-runtime = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-account = "=4.3.2"
solana-instruction = "=3.4.1"
solana-rent = "=4.3.0"
# Keep the shared SDK identity types on the cached runtime-compatible graph.
solana-pubkey = "=4.2.1"
solana-address = "=2.6.1"
solana-account-info = "=3.1.1"
solana-program-entrypoint = "=3.1.1"
solana-clock = "=3.1.1"

[features]
system-cpi = ["dep:solana-system-program", "dep:solana-svm-callback", "dep:solana-svm-feature-set"]

[dependencies.solana-system-program]
version = "=4.2.2"
features = ["agave-unstable-api"]
optional = true

[dependencies.solana-svm-callback]
version = "=4.2.2"
features = ["agave-unstable-api"]
optional = true

[dependencies.solana-svm-feature-set]
version = "=4.2.2"
features = ["agave-unstable-api"]
optional = true
