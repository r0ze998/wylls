[package]
name = "permutation-frontier"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Wylls M1 on-chain program (SBPF v2, no money): seasons, beacons, rings, provinces, holdings, marches, clashes and transits over the permutation-rules frontier kernels"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

# M1 contract §3.2: the crate builds, clippies and tests on the host with the
# default features (the entrypoint and the custom heap are
# `cfg(target_os = "solana")`-gated); `--no-default-features` leaves the
# layouts and the pure helpers only (crypto math, clock, addresses, events,
# evidence parser, heap arithmetic).
[features]
default = ["program", "custom-heap"]
# Instruction handlers, account initialisation, the prologue wrapper and the
# entrypoint.
program = []
# Explicit opt-in for real native BLS math in unit tests only.
# Non-test host libraries still fail closed; SBF never includes this adapter.
native-crypto-tests = []
no-entrypoint = []
# Our own 256-KiB-aware bump allocator (heap.rs, I-50) instead of the
# entrypoint's default one.
custom-heap = []
# Measurement builds only: CU checkpoints and the heap high-water mark in the
# log; carries the marker PSF_TRACE_BUILD (build-frontier.sh refuses it for a
# deployable build).
trace = []
# Tests only: the single-transaction ResolveClash (0x62); marker
# PSF_ORACLE_BUILD, never deployable.
oracle = []
# Tests only (I-53): pins the deterministic local beacon key of
# `drand-replay --test-key` and its own QUICKNET_PK_HASH; marker
# PSF_TEST_BEACON_BUILD, never deployable.
test-beacon = []
# Local development only: unallocated wire tag, no deployment or stable ABI.
nft-experimental = ["program"]
# Workstream 10 (custody), a preview: the custody instructions, embedding
# RULESET_HASH_V4 and program_version 5 (so it refuses every S1 season, and
# the default S1 build refuses every custody tag). Marker
# PSF_CUSTODY_PREVIEW_BUILD; never deployable until LiteSVM tests, measured
# budgets and the verifier's V26 exist.
custody-preview = []
# Workstream 09 (capacity lending), a preview: the capacity instructions
# 0xF0–0xFD (`proc::capacity`, workstream 4's provisional band), dispatched
# before the v2 tags; the build carries the `0x2000` program-version bit
# (workstream 09's proposal) so its Seasons never mix with others. No PS2
# record (the kinds are not allocated). Not deployable.
capacity-preview = [
    "program",
    "frontier-abi/capacity-preview",
    "permutation-rules/capacity-preview",
]
# Local development only (2026-11-07): the draft wide land write path on the
# provisional band 0xD6–0xDA (`proc::wide`), the wide terrain kernel and the
# `world_index` identity models; the build carries the `0x4000` program
# version bit so its Seasons never mix with production ones. Not deployable;
# no stable ABI, no allocated numbers.
wide-world-experimental = [
    "program",
    "frontier-abi/world-index-experimental",
    "permutation-rules/wide-terrain-experimental",
]

# Dependency sections: owned by the integrator (M1 contract §3.4, I-55); the
# set below is the one listed in docs/frontier/m1/W2-A-NOTES.md.
[dependencies]
solana-program = "=4.0.0"
ark-ff = { version = "=0.5.0", default-features = false }
ark-ec = { version = "=0.5.0", default-features = false }
ark-bls12-381 = { version = "=0.5.0", default-features = false, features = ["curve"] }
borsh = { version = "=1.6.1", default-features = false }
permutation-rules = { path = "../permutation-rules" }
frontier-abi = { path = "../frontier-abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-panic"))'] }

[target.'cfg(not(target_os = "solana"))'.dev-dependencies]
solana-bls12-381-syscall = "=0.1.1"
