# The resident program of the spike (R2, approved scope: InitConfig, SetPrice,
# MintResident, TransferResident, SetSession, Op). Its own workspace, built with
# cargo-build-sbf 3.1.9 / platform-tools v1.52 (docs/ENV-RECORD.ja.md). Not the
# Frontier program: an isolated crate whose instruction layouts are the
# proposal for ④ (docs/MINT-FLOW.ja.md §4, docs/INTEGRATION-04.ja.md).
[package]
name = "wylls-resident-program"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# TEST ONLY design proof (2026-11-15, the 0x51 A→B→A boundary): never in a default build, never deployed.
#   signed-transfer-test-only: adds 0x54 TransferResidentAt { gen u32 } — 0x51's accounts and effects, refused unless
#     the SIGNED generation is the record's now (an old transfer signed before A→B→A is refused on the chain too).
#   transfer-requires-generation-test-only: also refuses the unsigned-generation 0x51 (closes the direct-chain path;
#     breaks every 0x51 client, so it is a compatibility decision for the owner, not made here).
signed-transfer-test-only = []
transfer-requires-generation-test-only = ["signed-transfer-test-only"]

[dependencies]
solana-program = "3"
mpl-core = "=0.12.1"
solana-system-interface = { version = "2", features = ["bincode"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
